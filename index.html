<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>冲压工艺与模具设计 · 期末刷题</title>
<style>
:root{
  --bg:#F4F5F1; --bg2:#EDEFEA; --card:#FFFFFF; --card2:#F7F8F5;
  --ink:#1B1F24; --ink2:#4B5560; --ink3:#7E878F;
  --line:#E3E6E0; --line2:#EFF1EC;
  --primary:#1E3A5F; --primary-2:#2E5A8A; --primary-soft:#ECF1F7;
  --red:#A63A2E; --red-soft:#FBEEEB; --red-line:#E8C4BD;
  --green:#2C6E49; --green-soft:#EBF3ED; --green-line:#BFDACA;
  --amber:#8A6218; --amber-soft:#FBF4E4;
  --shadow:0 1px 2px rgba(20,30,40,.05), 0 10px 28px -18px rgba(20,30,40,.35);
  --shadow-sm:0 1px 2px rgba(20,30,40,.06);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  --math:"Cambria Math",Cambria,"Times New Roman",serif;
}
html[data-theme="dark"]{
  --bg:#11151A; --bg2:#0D1116; --card:#191F26; --card2:#212932;
  --ink:#E6EAEE; --ink2:#B2BBC4; --ink3:#8B959F;
  --line:#343D47; --line2:#262E37;
  --primary:#8FB6E0; --primary-2:#9FC4EA; --primary-soft:#1B2733;
  --red:#E39183; --red-soft:#2C2020; --red-line:#4A2F2B;
  --green:#82C79F; --green-soft:#192A21; --green-line:#2E4A3A;
  --amber:#DCBA80; --amber-soft:#2A2418;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -20px rgba(0,0,0,.8);
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.75; -webkit-font-smoothing:antialiased;
}
b,strong{font-weight:650;color:var(--ink)}
sub,sup{font-size:.72em;line-height:0}
.eq{font-family:var(--math);font-style:italic;font-size:1.03em;color:var(--ink);letter-spacing:.2px;padding:0 .5px}
/* 真根号：√ 符号 + 上划线覆盖被开方内容 */
.rt{display:inline-flex;align-items:flex-start;white-space:nowrap;max-width:100%;vertical-align:.03em;
  font-style:normal}
.rt-sign{font-family:var(--math);font-size:1.46em;line-height:.84;margin-right:-.07em;
  transform:translateY(-.02em);letter-spacing:0}
.rt-body{border-top:1.1px solid currentColor;padding:.19em .26em 0 .1em;line-height:1.55;white-space:nowrap}
.fml .rt-body{border-top-width:1.2px}
.unit{font-style:normal;font-family:var(--math);letter-spacing:.02em;margin-left:.18em}
.fml{overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.fml::-webkit-scrollbar{display:none}
code.fx{font-family:var(--math);font-style:italic;background:var(--primary-soft);color:var(--primary);
  padding:.05em .34em;border-radius:5px;border:1px solid var(--line)}

/* ---------- 外壳 ---------- */
.shell{display:flex;min-height:100vh;align-items:flex-start}
.side{
  width:248px;flex:0 0 248px;height:100vh;position:sticky;top:0;z-index:40;
  background:var(--card);border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:14px;padding:18px 14px 16px;
}
.side-scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:16px;margin:0 -6px;padding:0 6px 6px}
.side-scroll::-webkit-scrollbar{width:5px}
.side-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.main{flex:1;min-width:0;padding:26px 34px 70px;max-width:1080px}
.view{display:none;animation:fade .26s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ---------- 品牌 ---------- */
.brand{display:flex;align-items:center;gap:10px;padding:0 4px 14px;border-bottom:1px solid var(--line2)}
.logo{width:34px;height:34px;flex:0 0 34px;border-radius:9px;background:var(--primary);color:#fff;
  display:grid;place-items:center;font-size:16px;font-weight:700}
html[data-theme="dark"] .logo{color:#0F1419}
.brand b{display:block;font-size:13.5px;line-height:1.35;font-weight:700;letter-spacing:.2px}
.brand span{display:block;font-size:10.5px;color:var(--ink3);letter-spacing:.8px;margin-top:1px}

/* ---------- 一级导航 ---------- */
.nav1{display:flex;flex-direction:column;gap:3px}
.nav1 button{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:9px 10px;border:0;border-radius:9px;background:transparent;font:inherit;
  font-size:14px;color:var(--ink2);cursor:pointer;transition:.15s;line-height:1.4;
}
.nav1 button i{font-style:normal;font-size:10px;color:var(--ink3);letter-spacing:.5px;
  width:15px;flex:0 0 15px;font-variant-numeric:tabular-nums}
.nav1 button em{margin-left:auto;font-style:normal;font-size:11px;color:var(--ink3);
  font-variant-numeric:tabular-nums}
.nav1 button:hover{background:var(--bg2);color:var(--ink)}
.nav1 button.on{background:var(--primary);color:#fff;font-weight:650;box-shadow:var(--shadow-sm)}
.nav1 button.on i{color:rgba(255,255,255,.65)}
.nav1 button.on em{color:rgba(255,255,255,.8)}
html[data-theme="dark"] .nav1 button.on{color:#0F1419}
html[data-theme="dark"] .nav1 button.on i{color:rgba(15,20,25,.55)}
html[data-theme="dark"] .nav1 button.on em{color:rgba(15,20,25,.7)}

/* ---------- 二级导航 ---------- */
.nav2{display:flex;flex-direction:column;gap:15px}
.grp h5{margin:0 0 7px;font-size:10px;letter-spacing:1.3px;color:var(--ink3);
  font-weight:700;display:flex;align-items:baseline;gap:6px}
.grp h5 span{font-weight:400;letter-spacing:.2px;font-size:10.5px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips button{
  border:1px solid var(--line);background:var(--card);color:var(--ink2);font:inherit;
  font-size:11.5px;padding:4px 9px;border-radius:7px;cursor:pointer;transition:.15s;line-height:1.5;
}
.chips button:hover{border-color:var(--primary);color:var(--primary)}
.chips button.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);font-weight:650}
.list{display:flex;flex-direction:column;gap:1px}
.list button{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;
  font:inherit;font-size:12.5px;color:var(--ink2);padding:6px 8px;border-radius:7px;cursor:pointer;
  transition:.15s;line-height:1.45;
}
.list button:hover{background:var(--bg2);color:var(--ink)}
.list button.on{background:var(--primary-soft);color:var(--primary);font-weight:650}
.list button > b{font-weight:inherit;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list button > em{font-style:normal;font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.list button .btxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;line-height:1.35}
.list button .btxt b{font-weight:inherit;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list button .btxt i{font-style:normal;font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.list button.on .btxt i{color:var(--primary);opacity:.8}
.list button .dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex:0 0 6px;opacity:0}
.list button.seen .dot{opacity:1}
.list button .num{width:15px;flex:0 0 15px;font-size:10px;color:var(--ink3);font-variant-numeric:tabular-nums}

/* 答题卡 */
.sheet{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:2px}
.cell{aspect-ratio:1;border-radius:6px;border:1px solid var(--line);background:var(--card2);
  font-size:11px;font-weight:600;color:var(--ink3);cursor:pointer;display:grid;place-items:center;
  font-variant-numeric:tabular-nums;transition:.12s;padding:0}
.cell:hover{transform:translateY(-1px);border-color:var(--primary)}
.cell.ok{background:var(--green-soft);border-color:var(--green-line);color:var(--green)}
.cell.bad{background:var(--red-soft);border-color:var(--red-line);color:var(--red)}
.cell.cur{box-shadow:0 0 0 2px var(--primary) inset;border-color:var(--primary);color:var(--primary)}
.stat{display:flex;gap:10px;font-size:11px;color:var(--ink3);margin-top:9px;font-variant-numeric:tabular-nums}
.stat b{color:var(--ink);font-weight:650}
.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:10px;color:var(--ink3);margin-top:8px}
.legend span{display:flex;align-items:center;gap:3px}
.legend em{width:8px;height:8px;border-radius:2px;display:block;border:1px solid var(--line)}
.progress{height:4px;border-radius:2px;background:var(--line2);overflow:hidden;margin-top:7px}
.progress i{display:block;height:100%;background:var(--green);border-radius:2px;transition:.3s}

/* 侧栏底部 */
.sidefoot{border-top:1px solid var(--line2);padding-top:11px;display:flex;flex-direction:column;gap:6px}
.sidefoot .btn{width:100%;justify-content:center;display:flex}

/* ---------- 通用控件 ---------- */
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink2);font:inherit;font-size:12.5px;
  padding:7px 13px;border-radius:9px;cursor:pointer;transition:.16s;line-height:1.5}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
html[data-theme="dark"] .btn.primary{color:#0F1419}
.btn.primary:hover{filter:brightness(1.08)}
.btn.lg{padding:11px 22px;font-size:14px;border-radius:11px}
.btn[disabled]{opacity:.45;cursor:default}
.muted{color:var(--ink3)}
.hide{display:none !important}

/* ---------- 刷题页 ---------- */
.qbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:12.5px;color:var(--ink3);
  font-variant-numeric:tabular-nums}
.qbar .sp{flex:1}
.qbar b{font-size:13px;color:var(--ink);font-weight:650;letter-spacing:.2px}
.qbar #qbarText{color:var(--ink3)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow);padding:26px 28px 20px;min-height:392px;display:flex;flex-direction:column}
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:15px}
.qno{font-family:var(--math);font-size:30px;line-height:1;color:var(--primary);font-weight:600;
  min-width:46px;letter-spacing:-1px}
.qmeta{display:flex;flex-direction:column;line-height:1.35}
.qmeta b{font-size:13px;color:var(--ink2);font-weight:600;letter-spacing:.3px}
.qmeta span{font-size:11.5px;color:var(--ink3)}
.qflag{margin-left:auto;font-size:12px;font-weight:650;padding:3px 10px;border-radius:20px;
  border:1px solid transparent;opacity:0;transition:.2s}
.qflag.show{opacity:1}
.qflag.ok{color:var(--green);background:var(--green-soft);border-color:var(--green-line)}
.qflag.bad{color:var(--red);background:var(--red-soft);border-color:var(--red-line)}
.stem{font-size:17px;line-height:1.85;font-weight:500;color:var(--ink);margin:0 0 19px;letter-spacing:.2px}
.stem b{font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin-bottom:6px}
.opt{display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%;
  border:1px solid var(--line);background:var(--card2);border-radius:12px;
  padding:13px 14px;cursor:pointer;font:inherit;font-size:14.5px;line-height:1.6;
  color:var(--ink);transition:.16s;position:relative}
.opt:hover:not(.locked){border-color:var(--primary);background:var(--primary-soft);transform:translateY(-1px)}
.opt i{flex:0 0 22px;height:22px;border-radius:7px;border:1px solid var(--line);
  background:var(--card);display:grid;place-items:center;font-style:normal;
  font-size:12px;font-weight:700;color:var(--ink3);margin-top:1px;transition:.16s}
.opt:hover:not(.locked) i{border-color:var(--primary);color:var(--primary)}
.opt.locked{cursor:default}
.opt.correct{border-color:var(--green-line);background:var(--green-soft)}
.opt.correct i{background:var(--green);border-color:var(--green);color:#fff}
html[data-theme="dark"] .opt.correct i{color:#0F1419}
.opt.wrong{border-color:var(--red-line);background:var(--red-soft)}
.opt.wrong i{background:var(--red);border-color:var(--red);color:#fff}
html[data-theme="dark"] .opt.wrong i{color:#0F1419}
.opt.dim{opacity:.5}
.opt .mk{position:absolute;right:12px;top:11px;font-size:13px;font-weight:700}
.opt.correct .mk{color:var(--green)}
.opt.wrong .mk{color:var(--red)}
.verdict{margin:15px 0 0;font-size:13.5px;color:var(--ink2);display:flex;align-items:center;gap:8px}
.verdict b{font-weight:700}
.verdict .ok{color:var(--green)}
.verdict .bad{color:var(--red)}
.analysis{margin-top:12px;border:1px solid var(--line);border-radius:13px;background:var(--card2);
  padding:14px 16px;display:flex;flex-direction:column;gap:9px;animation:fade .22s ease}
.anrow{display:flex;gap:10px;align-items:flex-start}
.lab{flex:0 0 auto;font-size:11.5px;font-weight:700;letter-spacing:.5px;padding:2px 8px;
  border-radius:6px;margin-top:3px;line-height:1.5}
.lab.l1{color:var(--primary);background:var(--primary-soft)}
.lab.l2{color:var(--green);background:var(--green-soft)}
.lab.l3{color:var(--amber);background:var(--amber-soft)}
.anrow p{margin:0;font-size:13.5px;line-height:1.8;color:var(--ink2)}
.anrow p b{color:var(--ink)}
.qfoot{margin-top:auto;padding-top:18px;display:flex;align-items:center;gap:12px;border-top:1px solid var(--line2)}
.qfoot .pos{font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums;margin:0 auto}
.qfoot .btn{min-width:88px}
.empty{text-align:center;color:var(--ink3);padding:80px 20px;font-size:14px;line-height:2}

/* ---------- 思考题 ---------- */
.thinkbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.search{flex:0 0 250px;display:flex;align-items:center;gap:7px;background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:6px 11px}
.search input{border:0;background:transparent;font:inherit;font-size:13px;color:var(--ink);outline:none;width:100%}
.search span{color:var(--ink3);font-size:13px}
.tlist{display:flex;flex-direction:column;gap:11px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow-sm);overflow:hidden;transition:.18s}
.tcard.open{border-color:var(--primary);box-shadow:var(--shadow)}
.thead{display:flex;align-items:center;gap:12px;padding:15px 18px;cursor:pointer;user-select:none}
.tno{flex:0 0 26px;height:26px;border-radius:8px;background:var(--primary-soft);color:var(--primary);
  font-size:12px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.tcard.done .tno{background:var(--green-soft);color:var(--green)}
.ttitle{flex:1;min-width:0}
.ttitle b{display:block;font-size:14.5px;font-weight:600;line-height:1.55;color:var(--ink)}
.ttitle em{display:block;font-style:normal;font-size:11.5px;color:var(--ink3);margin-top:2px}
.badge{font-size:10.5px;padding:1px 7px;border-radius:20px;background:var(--amber-soft);
  color:var(--amber);margin-left:6px;font-weight:600;vertical-align:1px}
.caret{flex:0 0 auto;width:7px;height:7px;border-right:1.6px solid var(--ink3);
  border-bottom:1.6px solid var(--ink3);transform:rotate(45deg);margin:-4px 4px 0 2px;transition:.22s}
.tcard.open .caret{transform:rotate(-135deg);margin-top:4px;border-color:var(--primary)}
.tbody{display:none;padding:2px 20px 20px;border-top:1px solid var(--line2)}
.tcard.open .tbody{display:block;animation:fade .2s ease}
.sec-t{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--ink3);
  margin:16px 0 6px;display:flex;align-items:center;gap:8px}
.sec-t::after{content:"";flex:1;height:1px;background:var(--line2)}
.tbody p{margin:0 0 9px;font-size:14px;line-height:1.95;color:var(--ink2);text-align:justify}
.tbody p b{color:var(--ink)}
.tbody ul{margin:4px 0 10px;padding-left:0;list-style:none}
.tbody li{position:relative;padding-left:16px;font-size:14px;line-height:1.9;color:var(--ink2);
  margin-bottom:5px;text-align:justify}
.tbody li::before{content:"";position:absolute;left:3px;top:.78em;width:4px;height:4px;
  border-radius:50%;background:var(--primary);opacity:.55}
.tbody .fml{font-family:var(--math);font-size:15px;color:var(--primary);text-align:center;
  margin:10px 0;letter-spacing:.4px;font-style:italic}
.recite{margin-top:16px;background:var(--green-soft);border-left:3px solid var(--green);
  border-radius:0 10px 10px 0;padding:12px 15px}
.recite .rz{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:1px;
  color:var(--green);margin-bottom:4px}
.recite p{margin:0;font-size:13.5px;line-height:1.9;color:var(--ink2)}
.tactions{display:flex;align-items:center;gap:10px;margin-top:16px;padding-top:13px;border-top:1px dashed var(--line)}
.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);cursor:pointer;
  margin-left:auto;user-select:none}
.chk input{width:15px;height:15px;accent-color:var(--green);cursor:pointer;margin:0}
.editbox{margin-top:14px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px}
.editbox label{display:block;font-size:11.5px;font-weight:650;color:var(--ink3);letter-spacing:.5px;margin:0 0 5px}
.editbox textarea{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--card);
  color:var(--ink);font:inherit;font-size:13.5px;line-height:1.85;padding:10px 12px;
  resize:vertical;outline:none;margin-bottom:11px}
.editbox textarea:focus{border-color:var(--primary)}
.editfoot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.editfoot .hint{font-size:11.5px;color:var(--ink3);margin-left:auto}
.tcard.editing .tbody > *:not(.tactions):not(.editbox){display:none}
.tcard.editing .tbody > .editbox{margin-top:12px}
.masked .tbody p, .masked .tbody li, .masked .recite p{filter:blur(6px);transition:.2s;cursor:pointer}
.masked .tbody p:hover, .masked .tbody li:hover, .masked .recite p:hover{filter:none}
.masked .tbody .fml{filter:blur(6px)}

/* ---------- 文档型 ---------- */
.doc{background:var(--card);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow);padding:30px 34px 36px}
.doc-h{padding-bottom:15px;margin-bottom:18px;border-bottom:2px solid var(--primary)}
.doc-h h2{margin:0;font-size:21px;line-height:1.45;color:var(--primary);letter-spacing:.3px}
.doc-h p{margin:4px 0 0;font-size:12.5px;color:var(--ink3);letter-spacing:.4px}
.doc h3{font-size:16px;margin:26px 0 9px;color:var(--ink);letter-spacing:.2px;position:relative;
  padding-left:12px;line-height:1.5}
.doc h3::before{content:"";position:absolute;left:0;top:.34em;width:3px;height:.92em;
  border-radius:2px;background:var(--primary)}
.doc h4{font-size:14px;margin:18px 0 6px;color:var(--ink);font-weight:650}
.doc p{margin:0 0 10px;font-size:14.2px;line-height:1.98;color:var(--ink2);text-align:justify}
.doc p b{color:var(--ink)}
.doc .lead{font-size:12.8px;line-height:1.85;color:var(--ink3);border-left:2px solid var(--line);
  padding-left:11px;margin-bottom:14px}
.doc ul{margin:6px 0 12px;padding:0;list-style:none}
.doc li{position:relative;padding-left:17px;font-size:14px;line-height:1.95;color:var(--ink2);
  margin-bottom:5px;text-align:justify}
.doc li::before{content:"";position:absolute;left:3px;top:.8em;width:4px;height:4px;border-radius:50%;
  background:var(--primary);opacity:.5}
.doc .fml{font-family:var(--math);font-size:15.5px;color:var(--primary);text-align:center;
  margin:12px 0;letter-spacing:.5px;font-style:italic}
.callout{background:var(--primary-soft);border-left:3px solid var(--primary);border-radius:0 11px 11px 0;
  padding:13px 16px;margin:14px 0}
.callout .ct{font-size:12.5px;font-weight:700;color:var(--primary);letter-spacing:.4px;margin-bottom:5px}
.callout .cb p{font-size:13.5px;margin:0 0 5px;line-height:1.9}
.callout .cb p:last-child{margin-bottom:0}
.doc .recite{margin:14px 0 6px}
.tbl{width:100%;border-collapse:collapse;margin:12px 0 16px;font-size:13px}
.tbl th{background:var(--primary-soft);color:var(--primary);font-weight:650;text-align:left;
  padding:8px 10px;border:1px solid var(--line);font-size:12.5px;letter-spacing:.2px}
.tbl td{padding:7px 10px;border:1px solid var(--line);color:var(--ink2);line-height:1.7;
  font-variant-numeric:tabular-nums}
.tbl tr:nth-child(even) td{background:var(--card2)}

/* ---------- 大题 ---------- */
.bigwrap{max-width:920px}
.bhead{margin-bottom:16px}
.btop{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.btag{font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--primary);
  background:var(--primary-soft);padding:3px 10px;border-radius:20px}
.btag.exam{color:var(--red);background:var(--red-soft);box-shadow:0 0 0 1px var(--red-line) inset}
.bmeta{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.btitle{margin:0;font-size:23px;line-height:1.4;letter-spacing:.2px;color:var(--ink);font-weight:700}
.bsub{margin:4px 0 0;font-size:12.5px;color:var(--ink3);letter-spacing:.5px;
  font-family:var(--math);font-style:italic}
.bq{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
  padding:22px 28px 24px}
.bq .sec-t{margin-top:0}
.bq p{margin:0 0 10px;font-size:14.5px;line-height:1.98;color:var(--ink2);text-align:justify}
.bq p b{color:var(--ink)}
.bq .fml{font-family:var(--math);font-size:16px;color:var(--primary);text-align:center;
  margin:13px 0;letter-spacing:.5px;font-style:italic}
.bq .lead{font-size:12.8px;color:var(--ink3);border-left:2px solid var(--line);padding-left:11px}
.bq ul{margin:6px 0 12px;padding:0;list-style:none}
.bq li{position:relative;padding-left:17px;font-size:14px;line-height:1.95;color:var(--ink2);margin-bottom:5px}
.bq li::before{content:"";position:absolute;left:3px;top:.8em;width:4px;height:4px;border-radius:50%;
  background:var(--primary);opacity:.5}
.bq .callout{background:var(--primary-soft)}
.btables{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:0 18px;box-shadow:var(--shadow-sm)}
.btables summary{cursor:pointer;font-size:12.5px;color:var(--ink2);padding:12px 0;list-style:none;
  display:flex;align-items:center;gap:8px;user-select:none}
.btables summary::-webkit-details-marker{display:none}
.btables summary::before{content:"";display:block;flex:0 0 auto;width:0;height:0;
  border-left:5px solid var(--ink3);border-top:4px solid transparent;border-bottom:4px solid transparent;
  transition:.2s}
.btables[open] summary::before{transform:rotate(90deg)}
.btables[open] summary{border-bottom:1px solid var(--line2);margin-bottom:12px}
.btables .doc-plain{padding-bottom:6px}
.btables h4{margin:12px 0 6px;font-size:13.5px;color:var(--ink)}
.btables .lead{font-size:12px;color:var(--ink3);border-left:2px solid var(--line);padding-left:10px;margin:8px 0}
.btables .tbl{font-size:12.5px}
.btables .tbl th,.btables .tbl td{padding:6px 9px}

.banswer{margin:20px 0 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.banswer .hint{font-size:12.5px;color:var(--ink3)}
.bans{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow);padding:0 28px 28px;animation:fade .28s ease;border-top:3px solid var(--green)}
.bans-head{display:flex;align-items:center;gap:12px;padding:16px 0 12px;margin-bottom:4px;
  border-bottom:1px solid var(--line2)}
.bans-head b{font-size:13px;letter-spacing:1px;color:var(--green);font-weight:700}
.bans-sum{margin-left:auto;font-size:12px;color:var(--ink3);font-family:var(--math);
  font-style:italic;text-align:right;line-height:1.5}
.bans h3{font-size:15px;margin:20px 0 8px;color:var(--ink);position:relative;padding-left:12px;line-height:1.5}
.bans h3::before{content:"";position:absolute;left:0;top:.34em;width:3px;height:.92em;
  border-radius:2px;background:var(--green)}
.bans h4{font-size:13.8px;margin:16px 0 6px;color:var(--ink);font-weight:650}
.bans p{margin:0 0 9px;font-size:14px;line-height:1.95;color:var(--ink2);text-align:justify}
.bans .fml{font-family:var(--math);font-size:15px;color:var(--ink);text-align:center;
  margin:9px 0;letter-spacing:.5px;font-style:italic}
.bans .lead{font-size:12.8px;color:var(--ink3);border-left:2px solid var(--line);padding-left:11px;margin:10px 0}
.bans ul{margin:6px 0 12px;padding:0;list-style:none}
.bans li{position:relative;padding-left:17px;font-size:13.8px;line-height:1.9;color:var(--ink2);margin-bottom:5px}
.bans li::before{content:"";position:absolute;left:3px;top:.78em;width:4px;height:4px;border-radius:50%;
  background:var(--green);opacity:.55}
.bans .callout{background:var(--green-soft);border-left-color:var(--green)}
.bans .callout .ct{color:var(--green)}
.bpager{display:flex;align-items:center;gap:12px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.bpager .pos{margin:0 auto;font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums}

/* ---------- 题型预测：填空 / 简答 / 名词解释 ---------- */
.v{font-family:var(--math);font-style:italic;letter-spacing:.2px}
.phead{margin:0 0 14px}
.ph1{margin:0;font-size:21px;line-height:1.45;font-weight:700;color:var(--primary);letter-spacing:.2px}
.ph-lead{margin:5px 0 0 14px;font-size:12.5px;line-height:1.8;color:var(--ink3)}
.ph2{margin:24px 0 10px 14px;padding-left:14px;border-left:3px solid var(--primary);
  font-size:16px;font-weight:650;line-height:1.5;color:var(--ink);
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ph2n{font-size:11.5px;font-weight:400;color:var(--ink3);letter-spacing:.2px}
.ph3{margin:0 0 8px 42px;font-size:13.5px;color:var(--ink2);font-weight:600}
.statwrap{overflow-x:auto;margin:0 0 16px;border-radius:12px}
.pstat{min-width:430px;margin:0;font-size:12.5px}
.pstat th,.pstat td{padding:7px 10px}
.pbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.pbar .search{flex:0 0 250px}
.pbar .hint{font-size:11.5px;color:var(--ink3)}

/* 填空：空位默认遮住 */
.flist{display:flex;flex-direction:column;gap:10px}
.fcard{background:var(--card);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow-sm);padding:15px 18px 12px;transition:.16s}
.fcard.done{border-color:var(--green-line);background:var(--green-soft)}
.frow{display:flex;align-items:flex-start;gap:12px}
.fno{flex:0 0 28px;height:26px;border-radius:8px;background:var(--primary-soft);color:var(--primary);
  font-size:12px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.fcard.done .fno{background:var(--green-soft);color:var(--green)}
.fstem{flex:1;min-width:0;font-size:15px;line-height:2.15;color:var(--ink);
  text-align:justify;overflow-wrap:anywhere;word-break:break-word}
.fb{display:inline-block;min-width:3.2em;max-width:100%;margin:0 2px;padding:0 8px;
  border:0;border-bottom:1.6px dashed var(--primary);border-radius:4px 4px 0 0;
  background:var(--primary-soft);color:var(--primary);font:inherit;font-size:13.5px;
  line-height:1.7;white-space:normal;vertical-align:baseline;cursor:pointer;text-align:center}
.fb:hover{background:var(--primary);color:#fff}
html[data-theme="dark"] .fb:hover{color:#0F1419}
.fb.on{border-bottom-style:solid;border-bottom-color:var(--green);background:var(--green-soft);
  color:var(--green);font-weight:650;cursor:default}
.ffoot{display:flex;align-items:center;gap:12px;margin-top:12px;padding-top:10px;
  border-top:1px dashed var(--line)}
.ffoot .hint{font-size:11.5px;color:var(--ink3)}
.ffoot .chk{margin-left:auto}

/* 简答 / 名词解释：题干与答案分离 */
.plist{display:flex;flex-direction:column;gap:11px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow-sm);overflow:hidden;transition:.18s}
.pcard.open{border-color:var(--primary);box-shadow:var(--shadow)}
.pcard.done{border-color:var(--green-line)}
.pcard-h{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;user-select:none}
.pno{flex:0 0 26px;height:26px;border-radius:8px;background:var(--primary-soft);color:var(--primary);
  font-size:12px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.pcard.done .pno{background:var(--green-soft);color:var(--green)}
.ptitle{flex:1;min-width:0}
.ptitle b{display:block;font-size:14.5px;font-weight:600;line-height:1.55;color:var(--ink)}
.ptitle em{display:block;font-style:normal;font-size:11.5px;color:var(--ink3);margin-top:2px}
.pbody{display:none;padding:2px 20px 18px;border-top:1px solid var(--line2)}
.pcard.open .pbody{display:block;animation:fade .2s ease}
.ptabs{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 4px}
.ptabs button{border:1px solid var(--line);background:var(--card);color:var(--ink2);font:inherit;
  font-size:12px;padding:5px 12px;border-radius:8px;cursor:pointer;transition:.15s}
.ptabs button:hover{border-color:var(--primary);color:var(--primary)}
.ptabs button.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);font-weight:650}
.pane{margin-top:10px}
.pane p{margin:0 0 9px;font-size:14px;line-height:1.95;color:var(--ink2);text-align:justify}
.pane p b{color:var(--ink)}
.pane .hint{font-size:12.5px;color:var(--ink3);margin:0}
.pane.recite{margin-top:12px}
.pcard.masked .pane{filter:blur(6px);cursor:pointer}
.pcard .tactions{margin-top:14px;padding-top:12px}

/* ---------- 移动端 ---------- */
.mobar{display:none}
.scrim{display:none}
@media(max-width:980px){
  .shell{display:block}
  .side{position:fixed;left:0;top:0;bottom:0;height:100vh;transform:translateX(-100%);
    transition:transform .25s ease;box-shadow:0 0 40px rgba(0,0,0,.25);width:282px;flex:none;z-index:45}
  .side.open{transform:none}
  .scrim{display:block;position:fixed;inset:0;background:rgba(12,18,24,.45);z-index:38;
    opacity:0;pointer-events:none;transition:.25s}
  .scrim.on{opacity:1;pointer-events:auto}
  .main{padding:66px 16px 60px;max-width:none}
  .mobar{display:flex;align-items:center;gap:12px;position:fixed;left:0;right:0;top:0;height:54px;
    z-index:30;padding:0 14px;background:var(--card);border-bottom:1px solid var(--line)}
  .mobar b{font-size:14px;letter-spacing:.2px}
  .mobar button{border:1px solid var(--line);background:var(--card);color:var(--ink2);
    width:34px;height:34px;border-radius:9px;font-size:15px;cursor:pointer}
  .qcard{padding:20px 16px 16px;min-height:0}
  .stem{font-size:16px}
  .opts{grid-template-columns:1fr}
  .qno{font-size:25px;min-width:auto}
  .doc,.bq,.bans{padding-left:18px;padding-right:18px}
  .btitle{font-size:20px}
  .thead{flex-wrap:wrap;gap:8px;padding:13px 14px}
  .tbody{padding:2px 14px 16px}
  .search{flex:1 0 100%}
  .doc-h h2{font-size:18px}
  .bans-sum{display:none}
  .qbar .kbd{display:none}
  .side-scroll{padding-bottom:18px}
  .pbar .search{flex:1 0 100%}
  .ph1{font-size:18px}
  .ph2{margin-left:0;padding-left:10px;font-size:15px}
  .ph3{margin-left:26px}
  .fcard{padding:13px 13px 11px}
  .fstem{font-size:14.5px}
  .fb{font-size:12.5px;padding:0 5px}
  .pcard-h{padding:12px 13px;gap:8px;flex-wrap:wrap}
  .pbody{padding:2px 13px 15px}
  .pstat{min-width:400px}
}
@media print{.side,.mobar,.qbar,.thinkbar,.pbar,.banswer,.bpager,.tactions,.ffoot,.ptabs{display:none}.main{padding:0}}
</style>
</head>
<body>

<div class="shell">
  <aside class="side" id="side">
    <div class="brand">
      <div class="logo">冲</div>
      <div>
        <b>冲压工艺与模具设计</b>
        <span>期末冲刺 · 2026</span>
      </div>
    </div>

    <div class="side-scroll">
      <nav class="nav1" id="nav1">
        <button data-tab="quiz" class="on"><i>01</i><span>必考选择</span><em>25</em></button>
        <button data-tab="think"><i>02</i><span>思考题</span><em>39</em></button>
        <button data-tab="know"><i>03</i><span>章节知识点</span><em>7</em></button>
        <button data-tab="big"><i>04</i><span>拉深大题</span><em>4</em></button>
        <button data-tab="fill"><i>05</i><span>填空预测</span><em>42</em></button>
        <button data-tab="short"><i>06</i><span>简答预测</span><em>23</em></button>
        <button data-tab="term"><i>07</i><span>名词解释</span><em>15</em></button>
      </nav>

      <div class="nav2" id="nav2"></div>
    </div>

    <div class="sidefoot">
      <button class="btn" id="themeBtn">◐　深色模式</button>
    </div>
  </aside>

  <div class="scrim" id="scrim"></div>

  <main class="main">
    <div class="mobar">
      <button id="menuBtn">☰</button>
      <b>冲压 · 期末冲刺</b>
    </div>

    <!-- ============ 刷题 ============ -->
    <section class="view on" id="v-quiz">
      <div class="qbar">
        <b>必考选择题</b>
        <span id="qbarText">第 1 / 25 题</span>
        <span class="sp"></span>
        <span class="kbd">键盘 A / B / C / D 作答，← → 翻题</span>
      </div>
      <div class="qcard" id="qcard"></div>
    </section>

    <!-- ============ 思考题 ============ -->
    <section class="view" id="v-think">
      <div class="thinkbar">
        <div class="search"><span>⌕</span><input id="search" placeholder="搜索题干或答案关键词"></div>
        <div class="sp" style="flex:1"></div>
        <button class="btn" id="selfBtn">自测（遮答案）</button>
        <button class="btn" id="expandAll">全部展开</button>
        <button class="btn" id="collapseAll">全部收起</button>
      </div>
      <div class="tlist" id="tlist"></div>
    </section>

    <!-- ============ 知识点 ============ -->
    <section class="view" id="v-know">
      <div class="doc" id="knowBody"></div>
    </section>

    <!-- ============ 大题 ============ -->
    <section class="view" id="v-big">
      <div class="bigwrap" id="bigBody"></div>
    </section>

    <!-- ============ 填空题预测 ============ -->
    <section class="view" id="v-fill">
      <div class="phead">
        <h1 class="ph1">填空题预测 · 42 题</h1>
        <p class="ph-lead">答案已挖空：先自己在纸上填，再点单个空位或「显示答案」核对。按高频必背 / 按考频 / 网络预测三组排列。</p>
      </div>
      <div class="statwrap"><table class="tbl pstat" id="fillStat"></table></div>
      <div class="pbar">
        <div class="search"><span>⌕</span><input id="fillSearch" placeholder="搜索题干或答案关键词"></div>
        <div style="flex:1"></div>
        <button class="btn" id="fillShowAll">显示全部答案</button>
        <button class="btn" id="fillHideAll">全部隐藏</button>
      </div>
      <div class="flist" id="fillList"></div>
    </section>

    <!-- ============ 简答题预测 ============ -->
    <section class="view" id="v-short">
      <div class="phead">
        <h1 class="ph1">简答题预测 · 23 题</h1>
        <p class="ph-lead">默认只给题干；展开后「详细答案」与「背诵版」分开查看，按节筛选、搜索、标记已掌握。</p>
      </div>
      <div class="statwrap"><table class="tbl pstat" id="shortStat"></table></div>
      <div class="pbar">
        <div class="search"><span>⌕</span><input id="shortSearch" placeholder="搜索题干或答案关键词"></div>
        <div style="flex:1"></div>
        <button class="btn" id="shortSelf">自测（遮答案）</button>
        <button class="btn" id="shortExpandAll">全部展开</button>
        <button class="btn" id="shortCollapseAll">全部收起</button>
      </div>
      <div class="plist" id="shortList"></div>
    </section>

    <!-- ============ 名词解释预测 ============ -->
    <section class="view" id="v-term">
      <div class="phead">
        <h1 class="ph1">名词解释预测 · 15 条</h1>
        <p class="ph-lead">默认只给词条；展开后「详细答案」与「背诵版」分开查看，先背后者，考场再展开成完整句。</p>
      </div>
      <div class="statwrap"><table class="tbl pstat" id="termStat"></table></div>
      <div class="pbar">
        <div class="search"><span>⌕</span><input id="termSearch" placeholder="搜索词条或答案关键词"></div>
        <div style="flex:1"></div>
        <button class="btn" id="termSelf">自测（遮答案）</button>
        <button class="btn" id="termExpandAll">全部展开</button>
        <button class="btn" id="termCollapseAll">全部收起</button>
      </div>
      <div class="plist" id="termList"></div>
    </section>
  </main>
</div>

<script>const DATA = {"mcq":[{"id":"1-1","group":1,"no":1,"stem":"冲床的滑块作用是（　　）。","options":[{"k":"A","t":"固定床身"},{"k":"B","t":"冷却模具"},{"k":"C","t":"传递冲压力"},{"k":"D","t":"润滑冲床"}],"answer":"C","analysis":{"kaodian":"曲柄压力机的组成与各部分功能。","yiju":"压力机由床身、传动系统、曲轴连杆机构、滑块、离合器与制动器等组成；电动机经减速带动曲轴旋转，连杆把旋转运动变成滑块的上下往复直线运动，<b>滑块再把这个压力传给模具<\/b>，所以滑块的功能是“传递冲压力”。","paichu":"A 固定床身是床身与工作台的功用；B 冷却、D 润滑分别由冷却与润滑系统完成，与滑块无关。"}},{"id":"1-2","group":1,"no":2,"stem":"冲裁件的形状设计应尽量避免以下哪种结构？（　　）","options":[{"k":"A","t":"圆角结构"},{"k":"B","t":"尖角结构"},{"k":"C","t":"简单结构"},{"k":"D","t":"对称结构"}],"answer":"B","analysis":{"kaodian":"冲裁件的结构工艺性。","yiju":"课件 3.3.1 明确：冲裁件外形与内孔<b>应避免尖锐的清角，宜有适当的圆角<\/b>，同时应避免窄长悬臂与凹槽（宽度 B≥1.5t）。尖角处应力集中、模具刃口易崩裂、凸模易折断，模具寿命显著下降。","paichu":"A 圆角、C 简单、D 对称都是工艺性所“提倡”的，正好是本题的反面。"}},{"id":"1-3","group":1,"no":3,"stem":"冲制工件，冲裁力为 F，采用刚性卸料和下出件方式，则总压力为（　　）。","options":[{"k":"A","t":"冲裁力+顶料力"},{"k":"B","t":"冲裁力+卸料力+推料力"},{"k":"C","t":"冲裁力+推料力"},{"k":"D","t":"冲裁力+卸料力"}],"answer":"C","analysis":{"kaodian":"冲裁工艺力的组成与压力机公称压力的确定。","yiju":"总压力要按“压力机真正要承担的力”相加。刚性卸料（固定卸料板）的卸料力由卸料板本身承受，<b>不计入压力机载荷<\/b>；下出件时工件卡在凹模洞内，必须用推件力把它顺冲裁方向推出，所以要加推件力。故 F总=F+F推。","paichu":"A 顶件力只在上出件（逆冲裁方向顶出）时才需要；B、D 都把刚性卸料的卸料力算进去了 —— 这是本题最常见的错项。"}},{"id":"1-4","group":1,"no":4,"stem":"当弯曲中小型不对称零件时，克服弯曲偏移现象的有效措施是（　　）。","options":[{"k":"A","t":"采取拉弯工艺"},{"k":"B","t":"采用压料装置"},{"k":"C","t":"成对弯曲"},{"k":"D","t":"选择合适的材料"}],"answer":"C","analysis":{"kaodian":"弯曲件偏移的原因与控制措施。","yiju":"课件 4.2 给出三条控制偏移的措施：① 选择可靠的定位和压料方式；② <b>对于小型不对称的弯曲件采用成对弯曲再剖切的工艺<\/b>；③ 使模具结构左右对称。成对弯曲让左右两件的偏移方向相反、互相抵消，是“根除”偏移的办法，故为“有效措施”。","paichu":"B 压料装置能减小偏移，但属于“改善定位”，对不对称件不能根除，是次优项（易被误选）；A 拉弯是减小回弹、提高成形精度的工艺；D 材料与偏移无直接关系。"}},{"id":"1-5","group":1,"no":5,"stem":"冲裁时裂纹先从（　　）模一侧产生。","options":[{"k":"A","t":"凸凹模"},{"k":"B","t":"同时产生"},{"k":"C","t":"凹模"},{"k":"D","t":"凸模"}],"answer":"C","analysis":{"kaodian":"冲裁变形机理中的裂纹起源。","yiju":"课件 3.1：主要变形区是以上下刃口连线为中心的纺锤形区域；<b>裂纹的起点在刃口侧面距刃尖很近的板料处，裂纹先从凹模一侧开始，然后才在凸模刃口侧面产生<\/b>。原因是凹模刃口附近的材料受压缩程度更大、应力集中更早达到极限。","paichu":"D 凸模一侧的裂纹“后产生”，这正是间隙合理时上下裂纹能重合的前提。"}},{"id":"1-6","group":1,"no":6,"stem":"冲压模具中，可以控制进距的模具零件是（　　）。","options":[{"k":"A","t":"导料板"},{"k":"B","t":"导柱"},{"k":"C","t":"导板"},{"k":"D","t":"挡料销"}],"answer":"D","analysis":{"kaodian":"定位零件的两大类作用。","yiju":"条料在模具中的定位有两个内容：与送料方向垂直的方向上定位（送进导向，用<b>导料板<\/b>）；沿送料方向控制一次送进的距离即步距（送料定距，用<b>挡料销<\/b>、侧刃、导正销）。本题问“控制进距”，对应的就是挡料销。","paichu":"A 导料板管方向不管距离；B 导柱是上下模的导向装置；C 导板兼作卸料板与导向，也不控制进距。"}},{"id":"1-7","group":1,"no":7,"stem":"冲裁件的尺寸是测量的（　　）的尺寸。","options":[{"k":"A","t":"圆角带"},{"k":"B","t":"光亮带"},{"k":"C","t":"断裂带"},{"k":"D","t":"毛刺"}],"answer":"B","analysis":{"kaodian":"冲裁断面四个特征区的功能。","yiju":"课件给出重要结论：<b>光亮带是测量和使用部位<\/b>；且落料件的光亮带处于大端（尺寸等于凹模尺寸），冲孔件的光亮带处于小端（尺寸等于凸模尺寸）。光亮带由模具挤压、切入使材料塑性变形而成，是整个断面上质量最好的部分。","paichu":"A 圆角带是刃口附近材料被牵连拉入形成的塌角，C 断裂带粗糙且有锥度，D 毛刺是撕裂毛边，三者都不能作为测量基准。"}},{"id":"1-8","group":1,"no":8,"stem":"落料拉深复合模的工作顺序是（　　）。","options":[{"k":"A","t":"落料拉深同时"},{"k":"B","t":"先落料后拉深"},{"k":"C","t":"不确定"},{"k":"D","t":"先拉深后落料"}],"answer":"A","analysis":{"kaodian":"复合模的定义与凸凹模的双重功能。","yiju":"复合模是“压力机一次行程中、在模具的<b>一个工位<\/b>上同时完成两道以上工序”的模具。落料拉深复合模中，凸凹模的外缘作落料凸模、内孔作拉深凹模，落料与拉深在<b>同一次行程的同一工位<\/b>内同时完成，故为“同时”。","paichu":"B、D 描述的是“先后”关系，那是级进模（不同工位依次完成）的特征；C 无意义。"}},{"id":"1-9","group":1,"no":9,"stem":"关于应力状态对金属塑性的影响，下列说法正确的是（　　）。","options":[{"k":"A","t":"拉应力越多，材料塑性越好"},{"k":"B","t":"压应力数目越多，变形抗力越大"},{"k":"C","t":"应力状态对塑性无影响"},{"k":"D","t":"压应力数目越多，材料塑性越好"}],"answer":"D","analysis":{"kaodian":"影响金属塑性的因素之“应力状态”。","yiju":"课件 2.1：拉应力状态易产生应力集中，促使裂纹产生和扩展而造成破坏，所以<b>拉应力数目越多塑性越差；压应力数目越多，塑性越好、变形抗力越低<\/b>（三向受压的大理石能承受很大变形就是这个道理）。","paichu":"A 与结论相反；B 压应力数目多时变形抗力是“降低”而非增大；C 显然错误，应力状态是最重要的影响因素之一。"}},{"id":"1-10","group":1,"no":10,"stem":"模具凸模长度计算为（　　）。","options":[{"k":"A","t":"凸模长度包含凸模固定板厚度、导料板厚度、卸料板厚度、附加长度和修磨量"},{"k":"B","t":"修磨量不需要计入凸模长度"},{"k":"C","t":"凸模长度由固定板厚度和导料板厚度相加得到"},{"k":"D","t":"附加长度是从凹模厚度里扣除"}],"answer":"A","analysis":{"kaodian":"凸模长度的组成。","yiju":"课件 3.5.4：凸模长度 L=固定板厚度+卸料板厚度+导料板厚度+附加长度；附加长度又包括①行程终了时凸模进入凹模的深度、②闭合状态下卸料板与固定板间的安全距离、③<b>总修磨量<\/b>。原则是在满足使用要求的前提下越短越好。","paichu":"B 修磨量必须计入，否则模具修磨几次后凸模就不够长了；C 漏了卸料板厚度与附加长度；D 附加长度是“加”而不是“扣”。"}},{"id":"1-11","group":1,"no":11,"stem":"一个冲裁件的长、宽度为 50 mm，零件与零件之间的搭边为 5 mm，则步距为（　　）。","options":[{"k":"A","t":"60 mm"},{"k":"B","t":"45 mm"},{"k":"C","t":"50 mm"},{"k":"D","t":"55 mm"}],"answer":"D","analysis":{"kaodian":"步距的定义与计算。","yiju":"步距（进距）是条料每次送进的距离，等于<b>零件在送进方向上的尺寸加上件与件之间的搭边<\/b>：A=50+5=55 mm。","paichu":"A 60 mm 是把侧搭边也重复算了一次；B 45 mm 把搭边当成了“重叠”；C 是漏加搭边。"}},{"id":"1-12","group":1,"no":12,"stem":"下料件的形状和内部形状对位置精度要求较高，应采用（　　）。","options":[{"k":"A","t":"单工序模具"},{"k":"B","t":"导板模具"},{"k":"C","t":"级进模"},{"k":"D","t":"复合模具"}],"answer":"D","analysis":{"kaodian":"模具类型的选择依据。","yiju":"零件内外形之间的<b>位置精度<\/b>要求高时，必须让内外形在同一次行程、同一工位内冲出，位置误差只取决于模具本身的制造精度 —— 这正是复合模的特点（凸凹模保证内外形同轴）。级进模在不同工位依次成形，存在定位累积误差。","paichu":"A 单工序模要两次装夹，位置精度最差；B 导板模只是导向方式，与内外形位置精度无关；C 级进模有累积误差，是本题的主要干扰项。"}},{"id":"1-13","group":1,"no":13,"stem":"冷冲模上模座通过（　　）安装在压力机的滑块上。","options":[{"k":"A","t":"导柱"},{"k":"B","t":"垫板"},{"k":"C","t":"凸模固定板"},{"k":"D","t":"模柄"}],"answer":"D","analysis":{"kaodian":"模柄的作用。","yiju":"课件 3.5.4：<b>上模通过模柄联接到冲床的滑块上<\/b>，用于 1000 kN 以下冲床的模具安装。模柄有旋入式、压入式、凸缘式、浮动式四种。","paichu":"A 导柱导套是上下模之间的导向；B 垫板承受凸模压力、防止压陷模座；C 凸模固定板用于安装固定凸模。"}},{"id":"1-14","group":1,"no":14,"stem":"普通冲裁模最常用的凹模结构形式是（　　）。","options":[{"k":"A","t":"镶拼式"},{"k":"B","t":"镶块式"},{"k":"C","t":"组合式"},{"k":"D","t":"整体式"}],"answer":"D","analysis":{"kaodian":"凹模的三种结构形式及适用范围。","yiju":"<b>整体式<\/b>凹模结构简单、强度好、制造精度高，适用于中小型及精度要求高的制件，是普通冲裁模最常用的形式；组合式只有工作部分用模具钢，成本低、维修方便，用于大中型件；镶拼式用于窄壁、形状复杂或大型件。","paichu":"A、C 都是“分块”思路，结构复杂、精度略低，只在特定场合用；B 不是独立的结构类别。"}},{"id":"1-15","group":1,"no":15,"stem":"带底孔的拉深件，当底孔要求较高时，一般应（　　）。","options":[{"k":"A","t":"先冲孔再落料"},{"k":"B","t":"先冲孔后拉深"},{"k":"C","t":"先拉深后冲孔"},{"k":"D","t":"冲孔与拉深同时"}],"answer":"C","analysis":{"kaodian":"拉深件冲孔工序的顺序安排。","yiju":"课件 5.3.2 明确：底孔<b>要求不高<\/b>时，可先冲孔后拉深，或采用落料—拉深复合加工；底孔<b>要求较高<\/b>时，一般应<b>先拉深、后冲孔<\/b> —— 因为拉深过程中孔会被拉伸变形、孔径与孔位都会变，先冲的孔无法保证精度。","paichu":"A、B 都是“先冲孔”，孔会在拉深中变形；D 复合时孔径同样受拉深影响。"}},{"id":"2-1","group":2,"no":1,"stem":"关于冲裁间隙对断面质量的影响，说法正确的是（　　）。","options":[{"k":"A","t":"间隙越小，断面质量一定越好"},{"k":"B","t":"合理间隙下，光亮带较大、毛刺小，断面质量好"},{"k":"C","t":"间隙越大，光亮带越宽"},{"k":"D","t":"间隙对毛刺大小没有影响"}],"answer":"B","analysis":{"kaodian":"间隙对断面质量的影响规律。","yiju":"断面质量取决于上下裂纹是否重合。间隙<b>合适<\/b>时上下裂纹重合，断面斜度很小、平直光滑、毛刺小、无裂纹分层 —— 这是最佳状态。间隙<b>过小<\/b>时上下裂纹向外错开，出现“双光亮带”，中间夹一段断裂带；间隙<b>过大<\/b>时裂纹向里错开、不重合，出现“双锥度”并被二次拉裂，毛刺增大。","paichu":"A 间隙过小同样使断面质量变差（双光亮带）；C 间隙越大光亮带反而变窄；D 间隙是毛刺高度的主要影响因素。"}},{"id":"2-2","group":2,"no":2,"stem":"下列措施中，不能减小弯曲回弹的是（　　）。","options":[{"k":"A","t":"用补偿法"},{"k":"B","t":"改进弯曲件局部结构"},{"k":"C","t":"增大冲裁间隙"},{"k":"D","t":"在工艺上采取措施"}],"answer":"C","analysis":{"kaodian":"减小弯曲回弹的措施。","yiju":"课件 4.2 列出五条：① 改进弯曲件局部结构（在弯曲区压加强筋，增加刚度与塑性变形程度）；② 选用弹性模量大、屈服极限低的材料；③ 工艺上采取措施（用校正弯曲代替自由弯曲、弯曲前退火）；④ <b>补偿法<\/b>（按回弹趋势修正凸、凹模工作部分形状尺寸）；⑤ 改变变形区应力状态（凸模局部凸起、纵向加压弯曲）。","paichu":"C “冲裁间隙”是冲裁工序的参数，与弯曲回弹毫无关系 —— 本题就是用“张冠李戴”的方式设错。"}},{"id":"2-3","group":2,"no":3,"stem":"冲压模具设计步骤中最先开展的工作是（　　）。","options":[{"k":"A","t":"冲压件工艺性分析，确定冲压工艺方案"},{"k":"B","t":"绘制模具装配图"},{"k":"C","t":"选用标准模架"},{"k":"D","t":"计算冲裁力"}],"answer":"A","analysis":{"kaodian":"冲模设计的一般步骤。","yiju":"课件 3.5.4 给出七个步骤：一、冲压件工艺性分析；二、确定冲压工艺方案；三、必要的工艺计算（排样、冲压力与压力中心、间隙、刃口尺寸）；四、选择模具结构类型；五、确定主要零部件结构与尺寸；六、设备选用与校核；七、绘制总装图与零件图。所以最先做的是<b>工艺性分析与工艺方案<\/b>。","paichu":"B、C、D 都在第三步之后，B 是最后一步。"}},{"id":"2-4","group":2,"no":4,"stem":"关于塑性变形全量理论，正确说法是（　　）。","options":[{"k":"A","t":"在简单加载条件下，塑性总应变与应力偏量成正比"},{"k":"B","t":"适用于任意加载路径"},{"k":"C","t":"适合弹性变形阶段"},{"k":"D","t":"塑性应变增量与应力偏量成正比"}],"answer":"A","analysis":{"kaodian":"增量理论与全量理论的区别。","yiju":"<b>全量理论<\/b>研究的是从加载开始到某一时刻的<b>全量<\/b>关系，前提是“<b>简单加载<\/b>”（各应力分量按同一比例增加），结论是塑性总应变（全应变）与应力偏量成正比。<b>增量理论<\/b>取加载过程中某一微量时间间隔，建立<b>应变增量<\/b>与应力偏量的关系，不要求简单加载。","paichu":"B 全量理论只在近似满足简单加载时才允许使用，不能用于任意加载路径；C 它是塑性理论，弹性阶段用广义虎克定律；D 是增量理论的表述，被故意混淆。"}},{"id":"2-5","group":2,"no":5,"stem":"冲压工序分类，下面描述正确的是（　　）。","options":[{"k":"A","t":"翻边属于分离工序"},{"k":"B","t":"弯曲件不会出现偏移缺陷"},{"k":"C","t":"冲裁依靠材料拉伸实现变形"},{"k":"D","t":"胀形、弯曲、翻边都属于塑性变形成形工序"}],"answer":"D","analysis":{"kaodian":"冲压工序的两大类划分。","yiju":"冲压工序按变形性质分两类：<b>分离工序<\/b>（切断、落料、冲孔、切口、切边、剖切）与<b>成形工序<\/b>（弯曲、拉深、胀形、起伏成形、翻边、缩口、整形、校平），后者靠塑性变形而不破坏材料。","paichu":"A 翻边是把孔边或外缘翻成竖立直边，属成形工序；B 弯曲件偏移是常见缺陷（坯料不对称、定位不稳、模具不对称都会引起）；C 冲裁是<b>剪切分离<\/b>，不是拉伸成形。"}},{"id":"2-6","group":2,"no":6,"stem":"冲裁压力中心计算的目的是（　　）。","options":[{"k":"A","t":"用来确定搭边大小"},{"k":"B","t":"使冲裁合力作用点与压力机滑块中心重合"},{"k":"C","t":"用于校核凹模厚度"},{"k":"D","t":"方便计算冲裁力大小"}],"answer":"B","analysis":{"kaodian":"压力中心的定义与意义。","yiju":"冲模的压力中心就是冲压合力的作用点。设计时必须让<b>压力中心与压力机滑块的中心线重合<\/b>，否则模具会承受偏心力矩，产生偏斜、间隙不均、导向件单边磨损，甚至损坏模具与设备。","paichu":"A 搭边由经验查表确定；C 凹模厚度用经验公式 H=kb；D 压力中心与冲裁力大小无关，只是“力的位置”。"}},{"id":"2-7","group":2,"no":7,"stem":"板料的抗破裂性是指（　　）。","options":[{"k":"A","t":"材料抵抗磨损的能力"},{"k":"B","t":"材料抵抗回弹的能力"},{"k":"C","t":"板料产生开裂的难易程度"},{"k":"D","t":"材料抵抗起皱的能力"}],"answer":"C","analysis":{"kaodian":"板料冲压成形性能的三方面。","yiju":"板料冲压性能包括<b>抗破裂性<\/b>（冲压过程中产生开裂的难易程度）、<b>贴模性<\/b>（取得与模具形状一致性的能力，起皱、塌陷会降低贴模性）、<b>定形性<\/b>（脱模后保持既得形状的能力，主要受回弹影响）。因开裂后零件严重破坏且难以修复，生产中<b>主要用抗破裂性<\/b>作为评定指标。","paichu":"D 起皱对应贴模性；B 回弹对应定形性；A 耐磨性是模具材料的性能要求。"}},{"id":"2-8","group":2,"no":8,"stem":"落料件采用凸凹模配作加工法，下列描述正确的是（　　）。","options":[{"k":"A","t":"配作加工不需要保证冲裁间隙"},{"k":"B","t":"凸模、凹模各自独立按公差加工，互不参考"},{"k":"C","t":"落料以凸模为基准件，凹模按凸模配作"},{"k":"D","t":"落料以凹模为基准件，凸模按凹模实际尺寸配作，保证冲裁间隙"}],"answer":"D","analysis":{"kaodian":"刃口尺寸计算的“基准件”原则与配作法。","yiju":"计算原则有两条：① 保证冲出合格零件 —— <b>落料以凹模为基准件<\/b>（先算凹模 D<sub>d<\/sub>），<b>冲孔以凸模为基准件<\/b>（先算凸模 d<sub>p<\/sub>）；② 保证模具寿命 —— 落料凹模取接近零件最小极限尺寸，冲孔凸模取接近孔的最大极限尺寸。配作法只需把基准件按公差加工好，另一件按基准件<b>实际尺寸<\/b>配作，图上仅注“保证最小双面间隙 Z<sub>min<\/sub>”。","paichu":"A 配作的目的恰恰是保证间隙；B 那是“分别加工法”的做法；C 方向反了。"}},{"id":"2-9","group":2,"no":9,"stem":"普通拉深的工艺特点是（　　）。","options":[{"k":"A","t":"只能对预制孔进行加工"},{"k":"B","t":"在板厚基本不变条件下，将平板毛坯压成开口空心件"},{"k":"C","t":"坯料厚度明显变薄"},{"k":"D","t":"主要用于材料分离"}],"answer":"B","analysis":{"kaodian":"拉深的定义与两类拉深。","yiju":"拉深是用拉深模把平板毛坯压成<b>开口空心件<\/b>，或把空心件再改变形状尺寸的加工方法。它分<b>不变薄拉深（普通拉深）<\/b>与<b>变薄拉深<\/b>：前者的筒壁与筒底厚度基本一致，不产生较大变薄；后者以空心有底件为毛坯，靠<b>减小壁厚<\/b>成形。","paichu":"A 预制孔加工是翻孔/翻边；C 明显变薄是变薄拉深的特点；D 材料分离是冲裁。"}},{"id":"2-10","group":2,"no":10,"stem":"冲压是指（　　）。","options":[{"k":"A","t":"有切屑"},{"k":"B","t":"加工成本高"},{"k":"C","t":"在压力作用下，使材料分离或变形而获得零件的一种加工方法"},{"k":"D","t":"刀具切除材料的切削加工"}],"answer":"C","analysis":{"kaodian":"冲压的定义。","yiju":"课件 1.1：冲压是<b>利用冲模在冲床上对金属（或非金属）板料施加压力，使其分离或变形而获得零件<\/b>的一种加工方法；属于压力加工，因主要加工 0.5～3 mm 板料而称板料冲压，因常温进行而称冷冲压。","paichu":"A、D 是切削加工的特征，冲压属<b>无屑加工<\/b>；B 冲压在大批量生产条件下成本很低，正是其主要优点之一。"}}],"big":{"intro":[{"t":"l","x":"这道题是整份材料里唯一的“确定必考计算题”。原题不会照搬，但题型、给表方式、评分点几乎不变，所以下面按“原题 → 通用五步 → 课件同类例题 → 变式训练 → 易错点”的顺序讲，务必把五步流程背成肌肉记忆。"}],"tables":[{"t":"h3","x":"表 1　无凸缘拉深件的修边余量 Δh（mm）"},{"t":"table","head":["拉深高度 h","相对高度 ＞0.5～0.8","＞0.8～1.6","＞1.6～2.5","＞2.5～4"],"rows":[["≤10","1.0","1.2","1.5","2.0"],["＞10～20","1.2","1.6","2.0","2.5"],["＞20～50","2.0","2.5","3.3","4.0"],["＞50～100","3.0","3.8","5.0","6.0"],["＞100～150","4.0","5.0","6.5","8.0"],["＞150～200","5.0","6.3","8.0","10.0"],["＞200～250","6.0","7.5","9.0","11.0"],["＞250","7.0","8.5","10.0","12.0"]],"rel":null},{"t":"h3","x":"表 2　无凸缘圆筒形件带压边圈时的极限拉深系数"},{"t":"table","head":["拉深系数","t/D＞0.08～0.15","＞0.15～0.3","＞0.3～0.6","＞0.6～1.0","＞1.0～1.5","＞1.5"],"rows":[["m<sub>1<\/sub>","0.63","0.60","0.58","0.54","0.53","0.50"],["m<sub>2<\/sub>","0.82","0.80","0.79","0.77","0.76","0.75"],["m<sub>3<\/sub>","0.84","0.82","0.81","0.80","0.79","0.78"],["m<sub>4<\/sub>","0.86","0.85","0.83","0.82","0.81","0.80"],["m<sub>5<\/sub>","0.88","0.87","0.86","0.85","0.84","0.82"]],"rel":null},{"t":"l","x":"注：表中 t/D 的单位是“%”，即相对厚度乘以 100 后的数值。查表时先用 t/D 定列、用 m 定行，别把 1.8% 当成 0.018% 去查第一列。"}],"items":[{"id":"b1","badge":"必考原题","title":"拉深件工艺计算","sub":"10 钢 · t = 2 mm · φ36 × 80 · R4","short":"φ36 × 80","stem":[{"t":"p","x":"下图所示拉深件，材料为 10 钢，t=2 mm，工件高度为 80 mm，工件外径为 φ36 mm，圆角半径 R4。试计算拉深件的<b>坯料尺寸、拉深次数、拉深系数及各次拉深工序的直径<\/b>（最后一道工序直径约等于工件直径），所有尺寸用中线，计算结果保留两位小数。坯料直径计算公式为："},{"t":"m","x":"D = <span class=\"rt\"><span class=\"rt-sign\">√<\/span><span class=\"rt-body\">d² + 4d(h + Δh) − 1.72dr − 0.56r²<\/span><\/span>"},{"t":"p","x":"零件图形如下所示，无凸缘拉深件的修边余量 Δh 及无凸缘圆筒形件带压边圈时的极限拉深系数见下表。"},{"t":"table","head":["已知量","数值","说明"],"rows":[["材料","10 钢","只影响能不能拉、不影响本例算式的选取"],["料厚 t","2 mm","＞1 mm，必须按中线尺寸计算"],["工件高度 H","80 mm","标注尺寸，需换成中线高度 h"],["工件外径 d","φ36 mm","标注尺寸，需换成中线直径 d"],["圆角半径 R","4 mm","标注内圆角，需换成中线半径 r"]],"rel":null},{"t":"box","title":"第一步就该做的事：中线换算","body":["题面“所有尺寸用中线”是明示提示。t≥1 mm 时一律按板厚中线计算：<code class=\"fx\">d = D外 − t<\/code>、<code class=\"fx\">r = R + t/2<\/code>、<code class=\"fx\">h = H − t/2<\/code>。这一步错，后面 D、m、d<sub>1<\/sub>～d<sub>3<\/sub> 全部连带错，而它是<b>独立给分点<\/b>，白送的分不能丢。"]}],"answer":[{"t":"p","x":"料厚 <span class=\"eq\">t=2 mm&gt;1 mm<\/span>，故按中线尺寸计算："},{"t":"m","x":"d = 36 − 2 = 34.00 <span class=\"unit\">mm<\/span>"},{"t":"m","x":"r = 4 + 2/2 = 5.00 <span class=\"unit\">mm<\/span>"},{"t":"m","x":"h = 80 − 2/2 = 79.00 <span class=\"unit\">mm<\/span>"},{"t":"h3","x":"第 2 步　确定修边余量 Δh"},{"t":"p","x":"相对高度 <span class=\"eq\">h/d=79.00/34.00=2.32<\/span>。查表 1：高度落在“＞50～100”这一行，相对高度落在“＞1.6～2.5”这一列，交点得："},{"t":"m","x":"Δh = 5.0 <span class=\"unit\">mm<\/span>"},{"t":"h3","x":"第 3 步　计算毛坯直径 D"},{"t":"p","x":"代入公式（注意 <span class=\"eq\">h+Δh<\/span> 先相加，<span class=\"eq\">r<sup>2<\/sup><\/span> 是半径的平方，不要写成 <span class=\"eq\">2r<\/span>）："},{"t":"m","x":"D = <span class=\"rt\"><span class=\"rt-sign\">√<\/span><span class=\"rt-body\">34² + 4×34×(79 + 5) − 1.72×34×5 − 0.56×5²<\/span><\/span>"},{"t":"m","x":"= <span class=\"rt\"><span class=\"rt-sign\">√<\/span><span class=\"rt-body\">1156 + 11424 − 292.4 − 14<\/span><\/span> = <span class=\"rt\"><span class=\"rt-sign\">√<\/span><span class=\"rt-body\">12273.6<\/span><\/span> = 110.79 <span class=\"unit\">mm<\/span>"},{"t":"l","x":"四个分项依次为：<span class=\"eq\">d<sup>2<\/sup>=1156<\/span>；<span class=\"eq\">4d(h+Δh)=4×34×84=11424<\/span>；<span class=\"eq\">1.72dr=1.72×34×5=292.4<\/span>；<span class=\"eq\">0.56r<sup>2<\/sup>=0.56×25=14<\/span>。写清这四项，即使最后开方算错也能拿到过程分。"},{"t":"h3","x":"第 4 步　判断能否一次拉出，并计算拉深次数"},{"t":"p","x":"① 毛坯相对厚度：<span class=\"eq\">t/D×100%=2/110.79×100%=1.8%<\/span>，查表 2 落在“＞1.5”这一列，得各次极限拉深系数 <span class=\"eq\">m<sub>1<\/sub>=0.50<\/span>、<span class=\"eq\">m<sub>2<\/sub>=0.75<\/span>、<span class=\"eq\">m<sub>3<\/sub>=0.78<\/span>、<span class=\"eq\">m<sub>4<\/sub>=0.80<\/span>、<span class=\"eq\">m<sub>5<\/sub>=0.82<\/span>。"},{"t":"p","x":"② 零件总拉深系数："},{"t":"m","x":"m = d/D = 34/110.79 = 0.31"},{"t":"p","x":"③ 判定：因为总拉深系数 <span class=\"eq\">m=0.31&lt;m<sub>1<\/sub>=0.50<\/span>，<b>一次拉不出来<\/b>，必须多次拉深。于是按各次极限系数依次试算（推算法）："},{"t":"m","x":"d<sub>1<\/sub> = m<sub>1<\/sub>·D = 0.50×110.79 = 55.40 <span class=\"unit\">mm<\/span>"},{"t":"m","x":"d<sub>2<\/sub> = m<sub>2<\/sub>·d<sub>1<\/sub> = 0.75×55.40 = 41.55 <span class=\"unit\">mm<\/span>"},{"t":"m","x":"d<sub>3<\/sub> = m<sub>3<\/sub>·d<sub>2<\/sub> = 0.78×41.55 = 32.41 <span class=\"unit\">mm<\/span> ＜ 34 <span class=\"unit\">mm<\/span>"},{"t":"p","x":"④ 结论：算到 <span class=\"eq\">d<sub>3<\/sub>=32.41 mm<\/span> 已小于工件直径 34 mm，说明 3 次即可拉到尺寸，故<b>拉深次数 <span class=\"eq\">n=3<\/span><\/b>。"},{"t":"h3","x":"第 5 步　调整拉深系数，确定各次工序直径"},{"t":"p","x":"按极限系数试算时 <span class=\"eq\">d<sub>3<\/sub>=32.41 mm&lt;34 mm<\/span>，说明“拉过头了”，按原则应把各次系数<b>适当放大<\/b>（由首件到末件逐次放大，且仍不小于对应极限值），使调整后的乘积等于总拉深系数："},{"t":"m","x":"m<sub>1<\/sub>′·m<sub>2<\/sub>′·m<sub>3<\/sub>′ = 0.31"},{"t":"p","x":"试取 <span class=\"eq\">m<sub>1<\/sub>'=0.51<\/span>、<span class=\"eq\">m<sub>2<\/sub>'=0.76<\/span>、<span class=\"eq\">m<sub>3<\/sub>'=0.79<\/span>（逐次放大，且不小于对应极限值 0.50、0.75、0.78）："},{"t":"m","x":"0.51 × 0.76 × 0.79 = 0.306 ≈ 0.31"},{"t":"p","x":"校验通过：乘积与总拉深系数 m 一致，且各次系数均大于对应极限值。"},{"t":"p","x":"重算各次工序件直径："},{"t":"m","x":"d<sub>1<\/sub>′ = m<sub>1<\/sub>′·D = 0.51×110.79 = 56.51 <span class=\"unit\">mm<\/span>"},{"t":"m","x":"d<sub>2<\/sub>′ = m<sub>2<\/sub>′·d<sub>1<\/sub>′ = 0.76×56.51 = 42.95 <span class=\"unit\">mm<\/span>"},{"t":"m","x":"d<sub>3<\/sub>′ = m<sub>3<\/sub>′·d<sub>2<\/sub>′ = 0.79×42.95 = 33.93 ≈ 34.00 <span class=\"unit\">mm<\/span> √"},{"t":"box","title":"最终答案","body":["坯料直径 <span class=\"eq\">D=110.79<\/span> mm；修边余量 <span class=\"eq\">Δh=5<\/span> mm；拉深次数 <span class=\"eq\">n=3<\/span>；各次拉深系数 <span class=\"eq\">m<sub>1<\/sub>'=0.51<\/span>、<span class=\"eq\">m<sub>2<\/sub>'=0.76<\/span>、<span class=\"eq\">m<sub>3<\/sub>'=0.79<\/span>；各次工序直径 <span class=\"eq\">d<sub>1<\/sub>=56.51<\/span> mm、<span class=\"eq\">d<sub>2<\/sub>=42.95<\/span> mm、<span class=\"eq\">d<sub>3<\/sub>=34.00<\/span> mm。"]},{"t":"l","x":"说明：原参考答案在 d<sub>2<\/sub>′、d<sub>3<\/sub>′ 两处有抄写笔误（把 42.95 写成 43.95、又用 43.05 去乘），按其思路重算即为上表数值，末次 33.93≈34，结论完全一致。考场上只要乘积校验通过、末次直径回到 34，就不会被判错。"}],"summary":"D = 110.79 mm　Δh = 5 mm　n = 3　d₁/d₂/d₃ = 56.51 / 42.95 / 34.00","minutes":15},{"id":"b2","badge":"课件同类题","title":"筒形件坯料尺寸与拉深次数","sub":"08 钢 · t = 2 mm · φ30 × 76 · r3","short":"φ30 × 76","stem":[{"t":"p","x":"课件 5.5 节例 1 与本题结构完全一致，只是数字不同——这就是老师说的“相似题在课件里也有”。把两题对照做一遍，套路就固化了。"},{"t":"p","x":"求筒形件的坯料尺寸及拉深次数。材料 08 钢，板料厚度 t=2 mm；零件为无凸缘筒形件，外径 φ30 mm、高度 76 mm、圆角半径 r=3 mm。"}],"answer":[{"t":"p","x":"① 中线换算（t=2＞1，按中线计算）：d=30−2=28 mm；r=3+1=4 mm；h=76−1=75 mm。"},{"t":"p","x":"② 修边余量：h/d=75/28=2.68，查表 1 得 Δh=6 mm（行“＞50～100”、列“＞2.5～4”）。"},{"t":"p","x":"③ 毛坯直径："},{"t":"m","x":"D = <span class=\"rt\"><span class=\"rt-sign\">√<\/span><span class=\"rt-body\">28² + 4×28×(75+6) − 1.72×28×4 − 0.56×4²<\/span><\/span>"},{"t":"m","x":"= <span class=\"rt\"><span class=\"rt-sign\">√<\/span><span class=\"rt-body\">784 + 9072 − 192.64 − 8.96<\/span><\/span> = <span class=\"rt\"><span class=\"rt-sign\">√<\/span><span class=\"rt-body\">9654.4<\/span><\/span> = 98.26 ≈ 98.2 <span class=\"unit\">mm<\/span>"},{"t":"p","x":"④ 判定：t/D=2/98.2=2.04%，查表 2 落在“＞1.5”列，m<sub>1<\/sub>=0.50、m<sub>2<\/sub>=0.75、m<sub>3<\/sub>=0.78、m<sub>4<\/sub>=0.80。m=28/98.2=0.285＜0.50，需多次拉深。试算："},{"t":"m","x":"d<sub>1<\/sub> = 0.50×98.2 = 49.10 <span class=\"unit\">mm<\/span>"},{"t":"m","x":"d<sub>2<\/sub> = 0.75×49.10 = 36.83 <span class=\"unit\">mm<\/span>"},{"t":"m","x":"d<sub>3<\/sub> = 0.78×36.83 = 28.73 <span class=\"unit\">mm<\/span> ＞ 28 <span class=\"unit\">mm<\/span>"},{"t":"m","x":"d<sub>4<\/sub> = 0.80×28.73 = 22.98 <span class=\"unit\">mm<\/span> ＜ 28 <span class=\"unit\">mm<\/span>"},{"t":"p","x":"算到 d<sub>4<\/sub> 才小于 28 mm，故 <b>n=4<\/b>。"},{"t":"p","x":"⑤ 调整系数：取 m<sub>1<\/sub>′=0.53、m<sub>2<\/sub>′=0.79、m<sub>3<\/sub>′=0.82、m<sub>4<\/sub>′=0.83，乘积 0.53×0.79×0.82×0.83=0.285 ≈ m √"},{"t":"m","x":"d<sub>1<\/sub>′ = 0.53×98.2 = 52.0 <span class=\"unit\">mm<\/span>"},{"t":"m","x":"d<sub>2<\/sub>′ = 0.79×52.0 = 41.1 <span class=\"unit\">mm<\/span>"},{"t":"m","x":"d<sub>3<\/sub>′ = 0.82×41.1 = 33.7 <span class=\"unit\">mm<\/span>"},{"t":"m","x":"d<sub>4<\/sub>′ = 0.83×33.7 = 28.0 <span class=\"unit\">mm<\/span>"},{"t":"l","x":"注意这一例的数字特征：试算时 d<sub>3<\/sub>=28.73 略大于 28、d<sub>4<\/sub> 才落下来，所以是 4 次；而必考原题是 d<sub>3<\/sub>=32.41＜34，所以是 3 次。<b>判次数只看“第一次小于工件直径的下标”<\/b>，不要凭感觉写 3 或 4。"}],"summary":"D ≈ 98.2 mm　Δh = 6 mm　n = 4　d₁′～d₄′ = 52.0 / 41.1 / 33.7 / 28.0","minutes":12},{"id":"b3","badge":"变式 1","title":"换数字练习","sub":"10 钢 · t = 2 mm · φ50 × 60 · R5","short":"φ50 × 60","stem":[{"t":"p","x":"变式 1：材料 10 钢，t=2 mm，外径 φ50 mm，高度 60 mm，圆角半径 R5。求坯料直径 D、拉深次数 n 及各次工序直径。"}],"answer":[{"t":"p","x":"<b>① 判断是否用中线尺寸<\/b>：t=2 mm＞1 mm，按中线计算。"},{"t":"m","x":"d = 50 − 2 = 48.00 <span class=\"unit\">mm<\/span>"},{"t":"m","x":"r = 5 + 2/2 = 6.00 <span class=\"unit\">mm<\/span>"},{"t":"m","x":"h = 60 − 2/2 = 59.00 <span class=\"unit\">mm<\/span>"},{"t":"p","x":"<b>② 查修边余量<\/b>：相对高度"},{"t":"m","x":"h/d = 59.00/48.00 = 1.23"},{"t":"p","x":"查表 1：高度 59 mm 落在“＞50～100”行，相对高度 1.23 落在“＞0.8～1.6”列，交点得 Δh=3.8 mm。"},{"t":"p","x":"<b>③ 计算毛坯直径<\/b>（四个分项分开写）："},{"t":"m","x":"D = <span class=\"rt\"><span class=\"rt-sign\">√<\/span><span class=\"rt-body\">48² + 4×48×(59 + 3.8) − 1.72×48×6 − 0.56×6²<\/span><\/span>"},{"t":"m","x":"= <span class=\"rt\"><span class=\"rt-sign\">√<\/span><span class=\"rt-body\">2304 + 12057.6 − 495.36 − 20.16<\/span><\/span>"},{"t":"m","x":"= <span class=\"rt\"><span clas = 50 − 1.5/2 = 49.25 <span class=\"unit\">mm<\/span>"},{"t":"p","x":"<b>② 修边余量<\/b>：相对高度"},{"t":"m","x":"h/d = 49.25/40.50 = 1.22"},{"t":"p","x":"查表 1：高度 49.25 mm 落在“＞20～50”行，相对高度落在“＞0.8～1.6”列，得 Δh=2.5 mm。"},{"t":"p","x":"<b>③ 毛坯直径<\/b>："},{"t":"m","x":"D = <span class=\"rt\"><span class=\"rt-sign\">√<\/span><span class=\"rt-body\">40.5² + 4×40.5×(49.25 + 2.5) − 1.72×40.5×3.75 − 0.56×3.75²<\/span><\/span>"},{"t":"m","x":"= <span class=\"rt\"><span class=\"rt-sign\">√<\/span><span class=\"rt-body\">1640.25 + 8383.5 − 261.23 − 7.88<\/span><\/span>"},{"t":"m","x":"= <span class=\"rt\"><span class=\"rt-sign\">√<\/span><span class=\"rt-body\">9754.64<\/span><\/span> = 98.77 <span class=\"unit\">mm<\/span>"},{"t":"l","x":"四个分项：d²=1640.25；4d(h+Δh)=4×40.5×51.75=8383.5；1.72dr=1.72×40.5×3.75=261.23；0.56r²=0.56×14.06=7.88。"},{"t":"p","x":"<b>④ 查系数、算总系数<\/b>："},{"t":"m","x":"t/D×100% = 1.5/98.77×100% = 1.52%"},{"t":"p","x":"落在表 2“＞1.5”列：m<sub>1<\/sub>=0.50、m<sub>2<\/sub>=0.75、m<sub>3<\/sub>=0.78。"},{"t":"m","x":"m = d/D = 40.5/98.77 = 0.410 ＜ 0.50"},{"t":"p","x":"故需多次拉深。"},{"t":"p","x":"<b>⑤ 试算次数<\/b>："},{"t":"m","x":"d<sub>1<\/sub> = m<sub>1<\/sub>·D = 0.50×98.77 = 49.39 <span class=\"unit\">mm<\/span> ＞ 40.5 <span class=\"unit\">mm<\/span>"},{"t":"m","x":"d<sub>2<\/sub> = m<sub>2<\/sub>·d<sub>1<\/sub> = 0.75×49.39 = 37.04 <span class=\"unit\">mm<\/span> ＜ 40.5 <span class=\"unit\">mm<\/span>"},{"t":"p","x":"第 2 次已小于工件直径，<b>故 n=2<\/b>。"},{"t":"p","x":"<b>⑥ 调整并定各次直径<\/b>：要求 m<sub>1<\/sub>′·m<sub>2<\/sub>′=0.410，m<sub>1<\/sub>′≥0.50、m<sub>2<\/sub>′≥0.75。"},{"t":"p","x":"取 m<sub>1<\/sub>′=0.54、m<sub>2<\/sub>′=0.759，校验乘积："},{"t":"m","x":"0.54 × 0.759 = 0.410 = m"},{"t":"m","x":"d<sub>1<\/sub>′ = 0.54×98.77 = 53.33 <span class=\"unit\">mm<\/span>"},{"t":"m","x":"d<sub>2<\/sub>′ = 0.759×53.33 = 40.48 ≈ 40.50 <span class=\"unit\">mm<\/span>"}],"summary":"D = 98.77 mm　Δh = 2.5 mm　n = 2　d₁/d₂ = 53.33 / 40.50","minutes":10}],"notes":[{"t":"box","title":"两个变式的答案对照","body":["变式 1：D=117.67 mm，Δh=3.8 mm，n=2，m<sub>1<\/sub>′=0.54、m<sub>2<\/sub>′=0.755，d<sub>1<\/sub>=63.54 mm、d<sub>2<\/sub>=48.00 mm。","变式 2：D=98.77 mm，Δh=2.5 mm，n=2，m<sub>1<\/sub>′=0.54、m<sub>2<\/sub>′=0.759，d<sub>1<\/sub>=53.33 mm、d<sub>2<\/sub>=40.50 mm。"]},{"t":"l","x":"对照必有原题（D=110.79、n=3）与课件例 1（D=98.2、n=4）看：次数不是“感觉深就多”，而是<b>极限系数连乘能不能压到工件直径以内<\/b>。D 大、工件直径小 → 次数多；本例工件直径相对毛坯不算小，两次就够。"},{"t":"h2","x":"五、解题模板与六个易错点"},{"t":"box","title":"五步模板（贴在草稿纸上照抄）","body":["① 中线换算：d=D外−t，r=R+t/2，h=H−t/2。","② 查 Δh：算 h/d → 先定“高度行” → 再定“相对高度列”。","③ 算 D：D=<span class=\"rt\"><span class=\"rt-sign\">√<\/span><span class=\"rt-body\">d²+4d(h+Δh)−1.72dr−0.56r²<\/span><\/span>，四个分项分开写。","④ 定次数：t/D×100% 定列查 m<sub>1<\/sub>…mn；m=d/D；若 m≥m<sub>1<\/sub> 则一次拉成；否则 d<sub>1<\/sub>=m<sub>1<\/sub>D、d<sub>2<\/sub>=m<sub>2<\/sub>d<sub>1<\/sub>… 算到第一次小于 d，其下标即 n。","⑤ 调整并定尺寸：让 m<sub>1<\/sub>′·m<sub>2<\/sub>′…mn′=m，逐次放大且不小于极限值；重算 d<sub>1<\/sub>′…dn′，末次应回到工件直径。"]},{"t":"h3","x":"易错点（每一条都对应一个失分点）"},{"t":"ul","items":["<b>忘了中线换算<\/b>：t≥1 mm 必须换，t＜1 mm 才直接用标注尺寸。本题 t=2，换了。"]},{"t":"ul","items":["<b>r 取成 R<\/b>：公式里的 r 是中线半径，r=R+t/2，本例 4+1=5，不是 4。"]},{"t":"ul","items":["<b>h 用 80 而不是 79<\/b>：h=H−t/2。差 1 mm，D 就差 0.53 mm 左右。"]},{"t":"ul","items":["<b>查表查错列<\/b>：t/D=1.8% 要查“＞1.5”列，不是“1.0～1.5”列；两列的 m<sub>1<\/sub> 都是 0.50 但 m<sub>3<\/sub>、m<sub>4<\/sub> 不同，会连带后面全错。"]},{"t":"ul","items":["<b>次数判错<\/b>：判据是“第一次出现 dn＜d 的那个 n”，本例 d<sub>3<\/sub>=32.41＜34 所以 n=3，不要因为“看起来很深”就写 4。"]},{"t":"ul","items":["<b>不做系数调整<\/b>：调整后乘积必须约等于 m、末次回到 34，且每个 m′ 不小于对应极限值。只写“取 0.51、0.76、0.79”而不做乘积校验，通常扣 1～2 分。"]},{"t":"h2","x":"六、如果题目再加问“各次工序件高度”"},{"t":"p","x":"课件 5.5 给出了半成品高度的计算公式，属于同一道题的高配版问法，记下来即可："},{"t":"m","x":"h = 0.25( D²/d − d ) + 0.43·(r/d)·(d + 0.32r )"},{"t":"m","x":"h_n = 0.25( D²/d_n − d_n ) + 0.43·(r_pn/d_n)·(d_n + 0.32 r_pn )"},{"t":"l","x":"式中 h_n、d_n、r_pn 分别为第 n 次拉深后工件的高度、直径和第 n 次拉深时凸模的圆角半径。注意 D 始终用毛坯直径，不换成上一次的直径。"},{"t":"h2","x":"七、顺带可能考的配套计算（公式备查）"},{"t":"table","head":["项目","公式","关键说明"],"rows":[["压边力","Q = A·q，q = σ<sub>b<\/sub>/150","A 为压边圈下坯料投影面积；首次拉深也可取 Q≈F/4"],["拉深力（首次）","F<sub>1<\/sub> = π·d<sub>1<\/sub>·t·σ<sub>b<\/sub>·k<sub>1<\/sub>","k<sub>1<\/sub> 查表 4-9，m<sub>1<\/sub> 越小 k<sub>1<\/sub> 越大"],["拉深力（以后各次）","F<sub>n<\/sub> = π·dn·t·σ<sub>b<\/sub>·k<sub>2<\/sub>","k<sub>2<\/sub> 亦查表，随 m 增大而减小"],["压力机总压力","ΣF = F + Q","浅拉深 ΣF≤(0.7～0.8)F0；深拉深 ΣF≤(0.5～0.6)F0"],["拉深模间隙","无压边 Z/2=(1～1.1)t<sub>max<\/sub>；有压边 Z/2=t<sub>max<\/sub>+ct","c 为增大间隙系数，t 为公称厚度"]],"rel":null}]},"thinkChapters":[{"title":"第 2 章 冲压成形的基本理论（7 题）","short":"基本理论","count":7,"items":[{"id":"t0-0","title":"1．什么是塑性条件？","detail":[{"t":"p","x":"塑性条件又称<b>屈服准则（屈服条件）<\/b>，是描述不同应力状态下变形体内质点<b>开始产生塑性变形并使塑性变形继续进行所必须遵循的条件<\/b>。单向应力状态时，只要应力达到材料的屈服极限 σ<sub>s<\/sub> 该点即进入塑性状态；复杂应力状态不能只用一个应力分量判断，必须各应力分量之间满足一定关系，这个关系就是塑性条件。目前公认的有两种：<b>屈雷斯卡（Tresca）最大剪应力准则<\/b>（σ<sub>1<\/sub>−σ<sub>3<\/sub>=σ<sub>s<\/sub>，忽略中间主应力，形式简单、精度足够）与<b>密塞斯（von Mises）等效应力准则<\/b>（σ<sub>e<\/sub>=σ<sub>s<\/sub>，考虑了中间主应力，更接近实验数据）。"}],"recite":"材料从弹性跨进塑性必须满足的应力关系，也叫屈服准则。单向拉伸就是应力到 σ<sub>s<\/sub>；复杂应力有两个判据：Tresca 最大剪应力理论 σ<sub>1<\/sub>−σ<sub>3<\/sub>=σ<sub>s<\/sub>（不管中间应力），Mises 等效应力理论 σ<sub>e<\/sub>=σ<sub>s<\/sub>（把中间应力算进去，更接近试验）。","chapter":"第 2 章 冲压成形的基本理论"},{"id":"t0-1","title":"2．简述增量理论、全量理论的含义。","detail":[{"t":"p","x":"<b>增量理论<\/b>：撇开整个变形过程，取加载过程中某一微量时间间隔来研究，建立该瞬间<b>应力与应变增量<\/b>之间的关系，认为应变增量与应力偏量成正比。它不要求简单加载，适用于任意加载路径，但需沿加载路径积分，计算量大。"},{"t":"p","x":"<b>全量理论<\/b>：研究从加载开始到某一时刻的<b>全量（总应变）<\/b>关系，前提是<b>简单加载<\/b>（各应力分量按同一比例增加），结论是塑性总应变与应力偏量成正比。其三个前提为小变形、泊松比等于 0.5 且材料不可压缩、载荷按比率增长。工程上只要近似满足简单加载即可使用，可大大简化分析计算。"}],"recite":"增量理论盯住加载中某一瞬间，讲应变增量与应力偏量成正比，不管加载路径，所以适用面广但要积分；全量理论盯住从头到某一刻的全应变，讲总应变与应力偏量成正比，前提是简单加载（各应力按同一比例增加、小变形、不可压缩）。工程上只要近似比例加载，就用全量理论图省事。","chapter":"第 2 章 冲压成形的基本理论"},{"id":"t0-2","title":"3．当 σ<sub>1<\/sub>＞σ<sub>2<\/sub>＞σ<sub>3<\/sub> 时，用全量理论和体积不变定律分析：","detail":[{"t":"p","x":"<b>① σ<sub>1<\/sub> 是拉应力时，ε<sub>1<\/sub> 是否为拉应变？<\/b> 是。因为 σ<sub>1<\/sub>＞σ<sub>2<\/sub>＞σ<sub>3<\/sub>，必有 σ<sub>1<\/sub>＞σ<sub>m<\/sub>（平均应力 σ<sub>m<\/sub>=(σ<sub>1<\/sub>+σ<sub>2<\/sub>+σ<sub>3<\/sub>)/3），而全量理论指出应力大于平均应力时该方向一定产生拉应变，故 ε<sub>1<\/sub> 为拉应变。"},{"t":"p","x":"<b>② σ<sub>1<\/sub> 是压应力时，ε<sub>1<\/sub> 是否为压应变？<\/b> 不是，仍是<b>拉应变<\/b>。三向受压时 σ<sub>1<\/sub> 是绝对值最小的压应力，但它仍大于平均应力，故 ε<sub>1<\/sub>＞0。这说明“压应力方向一定产生压应变”是错的，三向受压时最小压应力方向反而被拉长。"},{"t":"p","x":"<b>③ 每个主应力方向与所对应的主应变方向是否一定一致？<\/b> 不一定。应力分量与应变分量的性质不一定一致（拉应力可对应压应变），但大小次序相对应（σ<sub>1<\/sub>＞σ<sub>2<\/sub>＞σ<sub>3<\/sub> 则 ε<sub>1<\/sub>＞ε<sub>2<\/sub>＞ε<sub>3<\/sub>），且满足 ε<sub>1<\/sub>+ε<sub>2<\/sub>+ε<sub>3<\/sub>=0（体积不变）。判断应变性质必须把该方向应力与<b>平均应力<\/b>比较，不能只看该应力是拉还是压。"}],"recite":"关键是把 σ<sub>1<\/sub> 和平均应力 σ<sub>m<\/sub> 比。因为 σ<sub>1<\/sub> 最大，恒有 σ<sub>1<\/sub>＞σ<sub>m<\/sub>，所以不管 σ<sub>1<\/sub> 是拉还是压，ε<sub>1<\/sub> 一律是拉应变——三向受压时“压力最小的那个方向”反而被拉长。应力方向和应变方向因此不一定同号，但大小次序一致（σ<sub>1<\/sub>＞σ<sub>2<\/sub>＞σ<sub>3<\/sub> 对应 ε<sub>1<\/sub>＞ε<sub>2<\/sub>＞ε<sub>3<\/sub>），且三者之和为零。","chapter":"第 2 章 冲压成形的基本理论"},{"id":"t0-3","title":"4．什么是伸长类变形？什么是压缩类变形？如何划分？","detail":[{"t":"p","x":"<b>伸长类变形<\/b>：变形区的<b>拉应力绝对值最大<\/b>，主要变形为沿该方向的<b>伸长<\/b>变形，如胀形、翻孔、起伏成形。<b>压缩类变形<\/b>：变形区的<b>压应力绝对值最大<\/b>，主要变形为沿该方向的<b>压缩<\/b>变形，如拉深、缩口。"},{"t":"p","x":"<b>划分依据<\/b>：看变形区三个主应力中<b>绝对值最大者<\/b>是拉还是压，其主要变形方向就随之为伸长或压缩。生产中把板料成形的受力与变形状况概括为这两大类，便于分析各自的成形极限与主要缺陷（伸长类易拉裂，压缩类易起皱）。"}],"recite":"看变形区里绝对值最大的那个主应力：是拉应力就叫伸长类（胀形、翻孔），主要变形是沿该方向伸长；是压应力就叫压缩类（拉深、缩口），主要变形是沿该方向压缩。一句话：谁绝对值最大，就按谁命名。","chapter":"第 2 章 冲压成形的基本理论"},{"id":"t0-4","title":"5．区分真实应力与名义应力、真实应变与名义应变；两条曲线有何差别？","detail":[{"t":"p","x":"<b>名义应力<\/b>按变形前的<b>原始截面积<\/b>计算，<b>真实应力<\/b>按变形当时的<b>瞬时截面积<\/b>计算；<b>名义应变<\/b>只考虑变形前后两个状态的尺寸，<b>真实应变<\/b>按变形<b>逐步累积<\/b>计算（考虑变形全过程）。"},{"t":"p","x":"差别：名义应力-应变曲线在缩颈后下降，掩盖了材料仍在硬化的实质；<b>真实应力-应变曲线在失稳点后仍持续上升<\/b>，说明材料抵抗塑性变形的能力随应变增加而不断提高，即不断发生硬化 —— 这条曲线才称为<b>硬化曲线<\/b>，才能真实反映硬化规律。生产中为简化，常用指数曲线 σ=C·ε<sup>n<\/sup> 作近似硬化曲线。"}],"recite":"名义应力拿原始截面积去除，真实应力拿当时瞬时截面积去除；名义应变只比首末两个尺寸，真实应变是把变形一点点累积起来。名义曲线缩颈后往下掉，看着像软化；真实曲线一直往上走，才说明材料在持续硬化，所以硬化规律要用真实曲线。","chapter":"第 2 章 冲压成形的基本理论"},{"id":"t0-5","title":"6．对冲压工艺有重大影响的机械性能指标有哪些？应提出什么要求？","detail":[{"t":"p","x":"共有<b>七项<\/b>，要求与理由如下："},{"t":"ul","items":["<b>屈服极限 σ<sub>s<\/sub> —— 小好<\/b>：易屈服、变形抗力小；压缩变形时不易起皱，弯曲回弹小，贴模性与定形性好。"]},{"t":"ul","items":["<b>屈强比 σ<sub>s<\/sub>/σ<sub>b<\/sub> —— 小好<\/b>：从屈服到拉裂有较大的塑性变形区间，变形区易变形不易起皱、传力区强度高不易拉裂，对拉深特别有利。"]},{"t":"ul","items":["<b>均匀延伸率 δ<sub>u<\/sub> —— 大好<\/b>：表示均匀稳定塑性变形的能力，直接决定伸长类变形的成形性能，是翻孔、扩孔性能的最主要参数。"]},{"t":"ul","items":["<b>弹性模量 E —— 大好<\/b>：弹性变形小、回弹小，定形性好。"]},{"t":"ul","items":["<b>硬化指数 n —— 对伸长类变形大好<\/b>：变形均匀、不易局部集中变形与破坏，提高成形极限；但硬化显著对后续工序不利。"]},{"t":"ul","items":["<b>厚向异性系数 r —— 大好<\/b>：板平面方向比厚度方向易变形，不易变薄或增厚，减小起皱、受拉处不易开裂，利于拉深。"]},{"t":"ul","items":["<b>板平面各向异性系数 Δ<sub>r<\/sub> —— 小好<\/b>：Δ<sub>r<\/sub> 大则各向异性严重，变形不均匀、易产生凸耳，影响零件质量。"]}],"recite":"七项，记“两小、四大、一小”：σ<sub>s<\/sub> 小、屈强比小；均匀延伸率大、弹性模量大、硬化指数 n 大、厚向异性系数 r 大；板平面各向异性 Δ<sub>r<\/sub> 小。总目的就一句：好变形、不易裂、不起皱、回弹小。","chapter":"第 2 章 冲压成形的基本理论"},{"id":"t0-6","title":"7．板料的冲压成形性能包括哪些方面？","detail":[{"t":"p","x":"包括三方面：<b>抗破裂性<\/b>（冲压过程中产生开裂的难易程度）、<b>贴模性<\/b>（取得与模具形状一致性的能力，起皱、塌陷会降低贴模性）、<b>定形性<\/b>（脱模后保持模具内既得形状的能力，主要受回弹影响）。"},{"t":"p","x":"其中贴模性与定形性决定零件的形状与尺寸精度；但抗破裂性差会导致零件严重破坏且难以修复，故生产中<b>主要用抗破裂性<\/b>作为评定板料冲压成形性能的指标。与之相关的是<b>成形极限<\/b>（失稳前可达到的最大变形程度），分总体成形极限（极限拉深系数、极限胀形高度、极限翻孔系数）与局部成形极限。"}],"recite":"三方面：抗破裂性（开不开裂）、贴模性（贴不贴模、起皱塌陷就差）、定形性（脱模后能不能保住形状，看回弹）。三者里主要考核抗破裂性，因为裂了没法修，其它两项还能补救。","chapter":"第 2 章 冲压成形的基本理论"}]},{"title":"第 3 章 冲裁工艺与模具设计（8 题）","short":"冲裁工艺","count":8,"items":[{"id":"t1-0","title":"1．冲裁变形过程包括哪几个阶段？","detail":[{"t":"p","x":"三个阶段，在瞬间完成："},{"t":"ul","items":["<b>弹性变形阶段<\/b>：板料产生弹性压缩、弯曲与拉伸，刃口附近出现初始（塌角）圆角，板料翘曲，变形可恢复。"]},{"t":"ul","items":["<b>塑性变形阶段<\/b>：应力达屈服极限，产生塑性变形，塌角增大，刃口出现微裂纹，变形区出现塑性剪切面，变形不可恢复。"]},{"t":"ul","items":["<b>断裂分离阶段<\/b>：裂纹扩展、上下裂纹重合，形成粗糙而有锥度的断裂带，并产生毛刺，板料被一分为二。"]}],"recite":"弹性变形—塑性变形—断裂分离，三步在瞬间完成。弹性段材料被压弯、刃口出现小塌角；塑性段刃口产生微裂纹、出现光亮剪切面；断裂段裂纹扩展贯通，留下断裂带和毛刺。","chapter":"第 3 章 冲裁工艺与模具设计"},{"id":"t1-1","title":"2．冲裁断面的特征区有哪几种？","detail":[{"t":"p","x":"四个特征区（按从塌角到毛刺的顺序）：<b>圆角带（塌角）<\/b>——刃口附近材料被牵连拉入产生弯曲与伸长变形而成；<b>光亮带<\/b>——模具挤压切入使材料塑性变形而成，是断面质量最好的部分，也是测量与使用部位；<b>断裂带<\/b>——刃口微裂纹在拉应力下扩展断裂而成，表面粗糙且带锥度；<b>毛刺<\/b>——断裂带周边的不规则撕裂毛边。四区比例随材料性能、料厚、刃口锋利程度、模具结构与间隙而变；高质量断面光亮带约占 1/3。"}],"recite":"塌角（圆角带）、光亮带、断裂带、毛刺，四段。光亮带最平整，是测量和使用的地方；落料件的光亮带在大端（等于凹模尺寸），冲孔件在小端（等于凸模尺寸）。","chapter":"第 3 章 冲裁工艺与模具设计"},{"id":"t1-2","title":"3．试分析影响冲裁件质量的因素。","detail":[{"t":"p","x":"冲裁件质量含断面质量、尺寸精度、形状误差三项，影响因素可归为四类："},{"t":"ul","items":["<b>材料性能<\/b>：塑性好则裂纹出现迟、光亮带宽、毛刺与穹弯大、断裂带窄；塑性差则相反。"]},{"t":"ul","items":["<b>间隙大小及分布均匀性<\/b>：<b>最主要因素<\/b>，决定上下裂纹是否重合；间隙不均处会出现大毛刺。"]},{"t":"ul","items":["<b>模具刃口锋利程度<\/b>：刃口磨钝后接触面积增大、应力集中减轻、裂纹推迟，圆角与光亮带增大但毛刺增高；凹模磨钝在冲孔件下端出毛刺，凸模磨钝在落料件上端出毛刺。"]},{"t":"ul","items":["<b>模具制造精度<\/b>（影响间隙均匀性）、<b>材料性质与轧制方向、料厚<\/b>（影响弹性变形量）：塑性越好、料越厚、平行轧制方向，冲裁后误差越小。"]},{"t":"p","x":"形状误差方面：<b>扭曲<\/b>由间隙不均、刃口形状误差、板料各向异性引起；<b>翘曲<\/b>是残余弯曲变形（穹弯），间隙过大、弯矩增大时加重；采用压料装置与反向压力可有效减小。"}],"recite":"四个：材料性能（塑性好则光亮带宽、毛刺大）、间隙大小与均匀性（最主要，决定上下裂纹合不合）、刃口锋利程度（磨钝后裂纹推迟、毛刺变高）、模具制造精度。另外板料厚度、轧制方向也影响回弹造成的尺寸偏差。","chapter":"第 3 章 冲裁工艺与模具设计"},{"id":"t1-3","title":"4．分析冲裁间隙的大小与冲裁件尺寸之间的关系。","detail":[{"t":"p","x":"规律由变形区应力状态决定：<b>间隙大于合理间隙<\/b>时，径向拉应力较大，冲裁时伸长弹性变形大、冲裁后回缩，故<b>冲孔件尺寸＞凸模尺寸、落料件尺寸＜凹模尺寸<\/b>；<b>间隙小于合理间隙<\/b>时，径向压应力较大，压缩弹性变形大、冲裁后回弹，故<b>冲孔件尺寸＜凸模尺寸、落料件尺寸＞凹模尺寸<\/b>。此外材料塑性越好、料越厚、平行于轧制方向，弹性变形量越小，冲裁后误差越小。"}],"recite":"间隙大，材料受径向拉，冲完回缩：冲孔件偏大、落料件偏小。间隙小，材料受径向压，冲完回弹：冲孔件偏小、落料件偏大。记“大拉缩、小压胀”。","chapter":"第 3 章 冲裁工艺与模具设计"},{"id":"t1-4","title":"5．冲裁间隙的大小对冲裁断面质量有何影响？","detail":[{"t":"p","x":"断面质量取决于<b>上下裂纹是否重合<\/b>："},{"t":"ul","items":["<b>间隙合适<\/b>：上下裂纹重合，断面斜度很小、平直光滑、毛刺小、无裂纹分层，质量最好。"]},{"t":"ul","items":["<b>间隙过小<\/b>：凸模侧裂纹向外错开，上下裂纹各自进入压应力区而停止扩展，中间材料被二次剪切，出现<b>双光亮带<\/b>，两光亮带之间夹一段断裂带。"]},{"t":"ul","items":["<b>间隙过大<\/b>：凸模侧裂纹向里错开、不重合，裂纹间材料被二次拉裂，断面出现<b>双锥度<\/b>，毛刺明显增大、塌角大。"]},{"t":"p","x":"另外间隙不均匀时，不合理处会出现较大毛刺、断面质量差，故必须保证间隙分布均匀。"}],"recite":"间隙合适，上下裂纹正好接上，断面平直、光亮带占大头、毛刺小；间隙过小，上下裂纹向外错开，出双光亮带，中间夹断裂带；间隙过大，裂纹向里错开，材料被二次拉裂，出双锥度、毛刺明显变大。","chapter":"第 3 章 冲裁工艺与模具设计"},{"id":"t1-5","title":"6．如何确定冲裁模的间隙？","detail":[{"t":"p","x":"三种方法："},{"t":"ul","items":["<b>理论确定法<\/b>：以“上下裂纹重合连成一线”为判据，由几何关系得 Z 与料厚 t、凸模相对压入深度 h/t、裂纹方向角 β 有关。h/t 越小，合理间隙越大；h/t 越大，合理间隙越小。"]},{"t":"ul","items":["<b>经验查表法<\/b>：按使用要求、材料性质与料厚查表得一个范围值，只要间隙在范围内即可冲出合格件。断面与尺寸要求高取小值；精度要求不高取大间隙以降低冲裁力、提高模具寿命。"]},{"t":"ul","items":["<b>经验公式法<\/b>：Z=(7～10)%t，即 Z<sub>min<\/sub>=0.07t、Z<sub>max<\/sub>=0.10t。"]},{"t":"p","x":"设计制造新模具时应取<b>最小合理间隙 Z<sub>min<\/sub><\/b>，因为使用中磨损会使间隙逐渐增大，直至 Z<sub>max<\/sub>。"}],"recite":"三条路：理论法按“上下裂纹重合”推；经验公式按 Z=(7～10)%t 估；实际生产查表，按材料、料厚和使用要求定一个范围。新模具取最小合理间隙，因为用着用着间隙会磨大。","chapter":"第 3 章 冲裁工艺与模具设计"},{"id":"t1-6","title":"7．简述冲裁模刃口尺寸的计算原则和方法。","detail":[{"t":"p","x":"<b>三条原则<\/b>：① 保证冲出合格零件——<b>冲孔以凸模为基准件<\/b>（先算 d<sub>p<\/sub>，间隙取在凹模方向）；<b>落料以凹模为基准件<\/b>（先算 D<sub>d<\/sub>，间隙取在凸模方向）；② 保证模具寿命——新模取 Z<sub>min<\/sub>，落料凹模取接近零件最小极限尺寸、冲孔凸模取接近孔的最大极限尺寸，以留出磨损量；③ 合理确定模具精度——模具精度比零件高 2～4 级，公差取工件公差的 1/3～1/4。"},{"t":"p","x":"<b>两种方法<\/b>：① <b>分别加工法<\/b>（适用圆形或简单规则形状）：冲孔 d<sub>p<\/sub>=(d+xΔ)<sub>−δ<sub>p<\/sub><\/sub>、d<sub>d<\/sub>=(d<sub>p<\/sub>+Z<sub>min<\/sub>)<sub>+δ<sub>d<\/sub><\/sub>；落料 D<sub>d<\/sub>=(D−xΔ)<sub>+δ<sub>d<\/sub><\/sub>、D<sub>p<\/sub>=(D<sub>d<\/sub>−Z<sub>min<\/sub>)<sub>−δ<sub>p<\/sub><\/sub>；须满足 δ<sub>p<\/sub>+δ<sub>d<\/sub>≤Z<sub>max<\/sub>−Z<sub>min<\/sub>。② <b>配作加工法<\/b>（适用形状复杂件）：先按设计尺寸制造基准件，另一件按基准件实际尺寸配作，保证 Z<sub>min<\/sub>；计算前先把各尺寸按磨损后“变大（A 类）、变小（B 类）、不变（C 类）”分类，分别用不同公式计算。"}],"recite":"原则三条：冲孔以凸模为基准、落料以凹模为基准；凹模取接近工件最小极限尺寸、凸模取接近孔的最大极限尺寸（留磨损量）；模具精度比工件高 2～4 级。方法两种：形状简单用分别加工（要满足 δ<sub>p<\/sub>+δ<sub>d<\/sub>≤Z<sub>max<\/sub>−Z<sub>min<\/sub>），形状复杂用配作，先做基准件，另一件按实际尺寸配，图上只注“保证 Z<sub>min<\/sub>”。","chapter":"第 3 章 冲裁工艺与模具设计"},{"id":"t1-7","title":"8．简述降低冲裁力的措施。","detail":[{"t":"p","x":"目的是用小吨位压力机冲裁或使冲裁过程平稳，常用三种："},{"t":"ul","items":["<b>阶梯冲裁<\/b>：多凸模做成不同长度、工作端面阶梯布置，使各凸模最大冲裁力不同时出现，从而降低总冲裁力；高度差 H 应大于光亮带高度，各层对称布置使合力过模具中心，冲裁力只按最大那层计算。"]},{"t":"ul","items":["<b>斜刃冲裁<\/b>：刃口做成斜刃，使刃口逐步切入板料，冲裁力显著降低且平稳；斜刃须对称布置；落料模凸模平刃、凹模斜刃，冲孔模凹模平刃、凸模斜刃；缺点是模具制造修磨困难、刃口易磨损、零件不够平整，用于大型件与厚板。"]},{"t":"ul","items":["<b>加热冲裁<\/b>：板料加热后抗剪强度明显下降，从而降低冲裁力，一般只适用于厚板件。"]}],"recite":"三招：阶梯冲裁（凸模做成长短不一，别同时吃力）、斜刃冲裁（刃口逐渐切入，落料斜凹模、冲孔斜凸模）、加热冲裁（把料烧软，只适合厚板）。","chapter":"第 3 章 冲裁工艺与模具设计"}]},{"title":"第 3 章（续）冲裁模结构及设计（9 题）","short":"冲裁模","count":9,"items":[{"id":"t2-0","title":"1．冲裁模由哪几部分构成？各部分有何作用？","detail":[{"t":"p","x":"五个部分："},{"t":"ul","items":["<b>工作部分<\/b>（凸模、凹模、凸凹模）：完成材料的分离或成形，零件质量与精度主要靠它保证。"]},{"t":"ul","items":["<b>定位及挡料部分<\/b>（导料板、导料销、挡料销、导正销、侧刃、定位板）：确定条料、毛坯及半成品在模具中的正确位置，分送进导向与送料定距。"]},{"t":"ul","items":["<b>卸料及推件装置<\/b>（卸料板、打杆、推块、推杆、推件器、顶件块、弹簧、橡胶）：把箍在凸模外的料卸下、卡在凹模内的件推出，保证冲压连续进行。"]},{"t":"ul","items":["<b>导向装置<\/b>（导柱、导套）：保证上下模正常运行、不产生位置偏移。"]},{"t":"ul","items":["<b>连接固定部分<\/b>（模柄、上下模座、固定板、垫板、螺钉销钉）：连接紧固各零件，使之成为完整整体。"]},{"t":"p","x":"按功用可分为<b>工艺结构零件<\/b>（前三个）与<b>辅助结构零件<\/b>（后两个）。"}],"recite":"五部分：工作部分（凸模、凹模、凸凹模，管成形和分离）、定位挡料部分（管条料方向和步距）、卸料推件部分（把料卸下来、把件推出去）、导向部分（导柱导套，保证上下模对中）、连接固定部分（模柄模座固定板垫板螺钉销钉，把一切连成整体）。","chapter":"第 3 章（续）冲裁模结构及设计"},{"id":"t2-1","title":"2．对冲裁模的要求有哪些？","detail":[{"t":"p","x":"① 能稳定冲出合格零件——刃口尺寸正确、间隙合理且均匀；② 有足够的强度与刚度，受力时不致变形失效；③ 导向可靠、精度稳定；④ 卸料与推件顺畅，操作安全方便；⑤ 结构工艺性好，尽量采用标准件与标准模架，制造与维修成本低；⑥ 刃口耐磨，模具有足够使用寿命；⑦ 安装、调整、刃磨方便。"}],"recite":"能稳定冲出合格件（刃口尺寸对、间隙合理均匀）、有足够强度和刚度、导向可靠、卸料推件顺畅安全、结构工艺性好并尽量用标准件、刃口耐磨寿命够。","chapter":"第 3 章（续）冲裁模结构及设计"},{"id":"t2-2","title":"3．什么是连续模？连续模冲压有何特点？","detail":[{"t":"p","x":"<b>连续模（级进模、跳步模）<\/b>：在压力机一次行程中，按一定顺序<b>在同一模具的不同工位上<\/b>完成两道以上冲压工序的模具，各工序沿条料送进方向分布，属多工序模。"},{"t":"p","x":"特点：① 生产效率高，适用于大批量生产；② 可减少模具与设备数量，便于实现自动化与安全生产；③ 结构复杂、制造困难、成本高；④ 各工序在不同工位完成，<b>存在定位累积误差，影响工件精度<\/b>。"}],"recite":"一次行程里，在送料方向上排开的几个工位各干一道工序，就是连续模。优点是效率高、省模具省设备、好自动化；缺点是结构复杂成本高，而且各工位分开做，定位有累积误差，精度不如复合模。","chapter":"第 3 章（续）冲裁模结构及设计"},{"id":"t2-3","title":"4．设计连续模时应注意哪些问题？","detail":[{"t":"p","x":"① <b>合理排样<\/b>：确定搭边、步距、条料宽度与工位数，先冲孔后落料，最后把工件与条料分离；② <b>定距方式要可靠<\/b>：用侧刃、导正销、挡料销组合控制进距，减少累积误差；③ 保证各工位凸、凹模的<b>强度与刚度<\/b>（工位间距足够、避免窄壁）；④ 卸料装置要能同时把多个工位上的料卸下（多用固定卸料板或弹性卸料板）；⑤ 条料送进顺畅、有足够的导料长度与始用挡料；⑥ 模具闭合高度与压力机行程、台面尺寸相匹配。"}],"recite":"排样要合理（步距、搭边、条宽）；定距要可靠，常用侧刃、导正销、挡料销组合；工序顺序先冲孔后落料；各工位凸凹模要有足够强度；卸料和送料要顺畅；最后校核闭合高度和压力机。","chapter":"第 3 章（续）冲裁模结构及设计"},{"id":"t2-4","title":"5．什么是复合模？复合模冲压有何特点？","detail":[{"t":"p","x":"<b>复合模<\/b>：在压力机一次行程中，在模具的<b>一个工位<\/b>上<b>同时<\/b>完成两道以上不同冲压工序的模具，其工作部分除凸、凹模外还有<b>凸凹模<\/b>（内缘作冲孔凹模、外缘作落料凸模）。"},{"t":"p","x":"特点：① 内外形<b>同工位一次冲出，位置精度高<\/b>，不受送料误差影响；② 生产率高，适宜大批量；③ 结构紧凑但对凸凹模<b>最小壁厚<\/b>有要求，不能冲内外尺寸差过小的零件；④ 模具制造复杂、成本高；⑤ 倒装式废料向下排出、操作方便但孔内积料可能涨裂；正装式不积料但废料落在工作面上不易清除。"}],"recite":"一次行程、一个工位上同时完成两道以上工序，靠的就是那个既能当凸模又能当凹模的“凸凹模”。内外形同工位冲出，位置精度高、效率高；但受凸凹模最小壁厚限制，模具制造也复杂。","chapter":"第 3 章（续）冲裁模结构及设计"},{"id":"t2-5","title":"6．设计复合模时应注意哪些问题？","detail":[{"t":"p","x":"① 校核<b>凸凹模最小壁厚<\/b>（不积料时冲硬材料 c≥1.5t、冲软材料 c≥t；积料时加大），不满足则不能用复合模；② 合理选择<b>正装或倒装<\/b>：倒装式废料向下排出、结构简单操作方便，但孔内积料易涨裂；正装式不积料但清废不便；③ 正确设计<b>推件与卸料<\/b>装置（刚性推件装于上模、弹性推件装于下模），保证工件与废料顺利排出；④ 保证凸凹模的固定可靠与刃磨方便；⑤ 注意模具闭合高度与最小壁厚对结构尺寸的限制。"}],"recite":"先校核凸凹模最小壁厚（冲硬料 ≥1.5t，冲软料 ≥t，积料还要加大），不够就不能用复合模；再选正装还是倒装——倒装废料往下排、好操作但孔内容易积料涨裂，正装不积料但清废麻烦；推件卸料装置要可靠。","chapter":"第 3 章（续）冲裁模结构及设计"},{"id":"t2-6","title":"7．模具定位零件有何作用？常用定位零件有哪几种？","detail":[{"t":"p","x":"作用是<b>确定条料、毛坯或半成品在模具中的正确位置<\/b>，保证冲出的零件位置准确、批次一致。条料定位有两方面内容："},{"t":"ul","items":["<b>送进导向<\/b>（垂直于送料方向定位，保证条料沿正确方向送进）：导料板、导料销。"]},{"t":"ul","items":["<b>送料定距<\/b>（沿送料方向控制一次送进距离即步距）：挡料销（固定式、活动式）、侧刃、导正销。"]},{"t":"p","x":"另外还有定位板、定位钉、定位销（用于单件毛坯或半成品定位）以及自动送料装置。"}],"recite":"作用是让条料或毛坯在模具里待在该待的位置。分两类：管方向的（导料板、导料销）和管步距的（挡料销、侧刃、导正销）；单件毛坯另有定位板、定位钉、定位销。","chapter":"第 3 章（续）冲裁模结构及设计"},{"id":"t2-7","title":"8．什么是冲裁模压力中心？为什么要使其与冲床滑块中心重合？如何计算？","detail":[{"t":"p","x":"<b>压力中心<\/b>是冲压合力的作用点，即凸模对工件施加力的合力作用点。若与滑块中心线不重合，模具将承受<b>偏心力矩<\/b>，产生偏斜、间隙不均、导柱导套单边磨损，严重时损坏模具与压力机，并影响零件质量。"},{"t":"p","x":"计算方法（解析法，求平行力系合力作用点）：① 按比例画出冲裁轮廓；② 建立直角坐标系；③ 把轮廓分解为直线段与圆弧段，求各段长度 l<sub>i<\/sub> 及其形心坐标；④ 因冲裁力与轮廓长度成正比，可用长度代替力，按力矩平衡计算 x<sub>c<\/sub>=Σ(l<sub>i<\/sub>·x<sub>i<\/sub>)/Σl<sub>i<\/sub>、y<sub>c<\/sub>=Σ(l<sub>i<\/sub>·y<sub>i<\/sub>)/Σl<sub>i<\/sub>。特殊情形可简化：双对称图形在几何中心，单对称图形在对称轴上，直线段在中点；多凸模冲裁时 l<sub>i<\/sub> 换成各凸模周长、(x<sub>i<\/sub>,y<sub>i<\/sub>) 换成各凸模压力中心坐标。"}],"recite":"压力中心就是冲裁合力的作用点。不重合就会产生偏心力矩，模具歪、间隙不匀、导柱单边磨损。算法是按力矩平衡加权：把轮廓切成线段，用各段长度 l<sub>i<\/sub> 和形心坐标 x<sub>i<\/sub>、y<sub>i<\/sub> 求 x<sub>c<\/sub>=Σl<sub>i<\/sub>x<sub>i<\/sub>/Σl<sub>i<\/sub>、y<sub>c<\/sub>=Σl<sub>i<\/sub>y<sub>i<\/sub>/Σl<sub>i<\/sub>；对称件直接取几何中心。","chapter":"第 3 章（续）冲裁模结构及设计"},{"id":"t2-8","title":"9．什么是冲裁模闭合高度？如何确定？","detail":[{"t":"p","x":"<b>闭合高度<\/b>：模具在最低工作位置时，<b>上模板上平面与下模板下平面之间的距离<\/b>。<b>装模高度<\/b>：滑块在下止点时，滑块下表面至工作台垫板上表面的距离。"},{"t":"p","x":"确定方法：模具闭合高度必须介于压力机最大与最小装模高度之间，通常按 <b>H<sub>min<\/sub>+10 ≤ H<sub>m<\/sub> ≤ H<sub>max<\/sub>−5<\/b> 确定，且 H<sub>m<\/sub> 尽可能取大值（最好接近 H<sub>max<\/sub>−5），以免连杆调节过长损坏连接螺纹。若 H<sub>m<\/sub>＜H<sub>min<\/sub> 则模具无法安装，相差不大时可另加厚垫板满足要求。"}],"recite":"模具合到最低时，上模座上平面到下模座下平面的距离。它得卡在压力机装模高度区间里：H<sub>min<\/sub>+10 ≤ H<sub>m<\/sub> ≤ H<sub>max<\/sub>−5，且尽量取大，免得连杆调太长；不够就加垫板。","chapter":"第 3 章（续）冲裁模结构及设计"}]},{"title":"第 4 章 弯曲工艺与模具设计（7 题）","short":"弯曲","count":7,"items":[{"id":"t3-0","title":"1．弯曲时变形主要是在什么部位？其有何特点？","detail":[{"t":"p","x":"变形主要在<b>弯曲件的圆角部分<\/b>，远离圆角的直边基本不变形（靠近圆角处有少许变化）。特点五条：① 圆角区网格由矩形变<b>扇形<\/b>；② 变形不均匀，外层纤维受拉伸长、内层受压缩短，中间存在长度不变的<b>应变中性层<\/b>；③ 应力不均匀，外层切向受拉、内层切向受压，中间存在切向应力为零的<b>应力中性层<\/b>；④ r/t 小时板料<b>变薄<\/b>；⑤ 相对宽度 b/t 决定断面是否畸变（宽板断面不变，窄板变扇形且内宽外窄）。"}],"recite":"主要在圆角部分，直边基本不动。五个特点：圆角网格变扇形；外层拉长内层压短，中间有不伸缩的应变中性层；应力也是外层拉内层压，有应力中性层；r/t 小会变薄；宽板断面不变、窄板变扇形。","chapter":"第 4 章 弯曲工艺与模具设计"},{"id":"t3-1","title":"2．宽板、窄板弯曲时的应力应变状态有何不同？","detail":[{"t":"p","x":"<b>宽板（b/t＞3）<\/b>：宽度方向变形阻力很大，材料不能自由变形，<b>宽度应变 ε<sub>2<\/sub>≈0，属平面应变状态；同时宽度方向存在应力，属立体应力状态<\/b>（内区宽度伸长受阻，σ<sub>2<\/sub> 为压；外区收缩受阻，σ<sub>2<\/sub> 为拉）。横断面几乎不变、仍为矩形，厚度方向变薄。"},{"t":"p","x":"<b>窄板（b/t＜3）<\/b>：宽度方向可自由变形，<b>宽度应力 σ<sub>2<\/sub>≈0，属平面应力状态；但宽度应变为立体状态<\/b>，外层宽度收缩、内层宽度增大，横断面由矩形变成<b>扇形且内宽外窄<\/b>。"},{"t":"p","x":"两者的共同点是：切向应力与切向应变沿板厚线性分布，都存在中性层，外层受拉、内层受压。"}],"recite":"看 b/t。宽板（＞3）宽度上动不了，应变≈0 但应力不为零，属“平面应变+立体应力”，断面还是矩形；窄板（≤3）宽度上能自由伸缩，应力≈0 但应变不为零，属“立体应变+平面应力”，断面变成扇形、内宽外窄。","chapter":"第 4 章 弯曲工艺与模具设计"},{"id":"t3-2","title":"3．弯曲件毛坯尺寸的计算步骤。","detail":[{"t":"p","x":"依据是<b>应变中性层长度在弯曲前后不变<\/b>，故按中性层展开求和：① 由弯曲件图分割出变形区（圆角部分）与直边；② 确定各直边段长度 l；③ 由 r/t 查中性层系数 x，确定中性层曲率半径 ρ=r+xt；④ 计算各圆角段中性层展开长度（πα/180·ρ）；⑤ 相加得毛坯总长度 L=Σl+Σ(πα/180)(r+xt)。对 r＜0.5t 的无圆角弯曲需按体积相等用修正公式；复杂多角件还需试弯修正。"}],"recite":"按中性层展开：先把零件分成直边和圆角，量出各直边长度；由 r/t 查中性层系数 x，得 ρ=r+xt；各圆角段展开长按 πα/180·ρ 算；最后全部相加。","chapter":"第 4 章 弯曲工艺与模具设计"},{"id":"t3-3","title":"4．什么是弯曲系数？其代表什么含义？","detail":[{"t":"p","x":"<b>弯曲系数（相对弯曲半径）K=r/t<\/b>，即弯曲件内圆角半径与料厚之比。它代表<b>弯曲变形程度<\/b>：K 越小，外表面切向应变越大，变形程度越大；K 越大则变形程度越小、回弹越大。不产生拉裂破坏时的最小 K 值称最小弯曲系数，对应<b>最小弯曲半径 r<sub>min<\/sub><\/b>。"}],"recite":"弯曲系数就是相对弯曲半径 K=r/t。它表示弯曲的变形程度：K 越小，外层拉得越狠，变形越大；不拉裂的最小 K 对应最小弯曲半径。","chapter":"第 4 章 弯曲工艺与模具设计"},{"id":"t3-4","title":"5．简述影响弯曲系数的因素。","detail":[{"t":"p","x":"① <b>材料机械性能<\/b>：塑性越好，允许的弯曲系数越小；可用退火、正火提高塑性。② <b>板料纤维方向<\/b>：弯曲线<b>垂直于纤维方向<\/b>时塑性最好、弯曲系数最小；弯曲半径小时必须使折弯线垂直于纤维方向。③ <b>弯曲角<\/b>：弯曲角小，直边参与变形对变形区外层的受拉状态起缓解作用，弯曲系数可更小。④ <b>表面与侧边质量<\/b>：有划伤、裂纹、毛刺时易开裂，需取较大值。⑤ <b>板料厚度<\/b>：薄料应变梯度大、邻近纤维能补充表层变形，故薄料可用更小的弯曲系数。"}],"recite":"材料塑性（好则能弯更小的半径）、纤维方向（弯曲线垂直纤维最好）、弯曲角（角度小则直边帮忙分担）、表面与侧边质量（有毛刺裂纹就得放大）、料厚（薄料能弯得更小）。","chapter":"第 4 章 弯曲工艺与模具设计"},{"id":"t3-5","title":"6．什么是弯曲回弹现象？产生回弹的根本原因是什么？","detail":[{"t":"p","x":"<b>回弹<\/b>：弯曲变形由塑性变形与弹性变形两部分组成，外力去除后塑性变形保留、弹性变形完全恢复，使弯曲件从模具取出后其<b>弯曲角与弯曲半径与模具不一致<\/b>的现象，表现为弯曲角增大（正回弹）或减小（负回弹）、曲率变化。"},{"t":"p","x":"<b>根本原因<\/b>：弯曲变形后变形区断面上切向应力分布不均匀，卸载时材料内部产生<b>弹性恢复应力<\/b>（残余应力释放），使零件产生反向弹性变形。只要有残存的弹性变形，回弹就不可避免；弯曲的回弹值比其他塑性加工方法大，是不易解决的特殊问题。"}],"recite":"弯曲完把件取出来，角度和半径跟模具对不上，就是回弹。根子在卸载：变形区里应力分布不均匀，弹性变形要恢复，残余应力一释放，件就弹回去。只要还有弹性变形，回弹就躲不掉。","chapter":"第 4 章 弯曲工艺与模具设计"},{"id":"t3-6","title":"7．简述减小弯曲件回弹的常用措施。","detail":[{"t":"p","x":"① <b>改进弯曲件局部结构<\/b>：在弯曲区压制加强筋，增加刚度与塑性变形程度；② <b>选用合适材料<\/b>：弹性模量大、屈服极限低的材料；③ <b>工艺措施<\/b>：用<b>校正弯曲代替自由弯曲<\/b>（最常用最有效），硬材料或加工硬化材料弯曲前退火；④ <b>补偿法<\/b>：按回弹趋势修正凸、凹模工作部分的形状与尺寸，使回弹得到补偿；⑤ <b>改变变形区应力状态<\/b>：凸模局部凸起使校正力集中作用于变形区、采用纵向加压弯曲，使内外层切向应力同号、回弹趋势相反而互相抵消。"}],"recite":"五个办法：弯曲区压加强筋；选弹性模量大、屈服极限低的材料；用校正弯曲代替自由弯曲（硬料先退火）；照回弹规律修凸凹模（补偿法）；改变变形区应力状态，让内外层回弹互相抵消（凸模局部凸起、纵向加压）。","chapter":"第 4 章 弯曲工艺与模具设计"}]},{"title":"第 5 章 拉深工艺与模具设计（8 题）","short":"拉深","count":8,"items":[{"id":"t4-0","title":"1．拉深中按应力应变状态可把毛坯分成哪几个区域？为什么把与凸模圆角相接触的部分称为“危险断面”？","detail":[{"t":"p","x":"可分为四个区域：① <b>凸缘区（变形区）<\/b>——受切向压应力与径向拉应力，切向压缩、径向伸长、厚度增厚；② <b>凹模圆角区（过渡区）<\/b>——材料流过圆角，受弯曲与摩擦作用；③ <b>筒壁区（传力区）<\/b>——把凸模的力传给凸缘，受单向或两向拉应力，厚度略有减薄；④ <b>筒底区（不变形区）<\/b>——与凸模底部接触，几乎不参与变形，只承受双向拉应力。"},{"t":"p","x":"<b>危险断面<\/b>：筒壁与底部转角稍上部位厚度最小（比原始厚度减少近 10%），且越靠近底部变形程度越小、加工硬化程度越低、强度最低，而它又要承担把凸缘材料拉入凹模的全部拉力，所以筒壁拉应力一旦超过材料抗拉强度，就在这里破裂，故称“危险断面”。"}],"recite":"四区：凸缘变形区、凹模圆角过渡区、筒壁传力区、筒底不变形区。危险断面在筒壁与底部转角稍上，那里变薄最厉害（近 10%）、硬化最轻、强度最低，却要扛住把整个凸缘拉进来的力，所以先裂在这儿。","chapter":"第 5 章 拉深工艺与模具设计"},{"id":"t4-1","title":"2．什么是起皱现象？为什么会产生起皱？生产中防止起皱的有效措施是什么？","detail":[{"t":"p","x":"<b>起皱<\/b>：拉深时凸缘部分（特别是外边缘）在<b>切向压应力<\/b>作用下<b>失稳<\/b>，沿切向产生高低不平的皱折（拱起）的现象，类似压杆失稳。"},{"t":"p","x":"原因：① 凸缘部分<b>相对厚度 t/D 小<\/b>，板料抗纵向弯曲能力小；② <b>切向压应力大<\/b>（变形程度大、需转移的剩余材料多）；③ 凹模工作部分几何形状不利（平端面凹模比锥形凹模更易起皱）。"},{"t":"p","x":"危害：增厚后难以通过凸凹模间隙，易把毛坯拉断；加剧模具磨损；皱纹留在侧壁影响外观。"},{"t":"p","x":"有效措施：<b>采用压边圈<\/b>，使板料被强迫在压边圈与凹模平面间的间隙中流动，提高稳定性；压边力应在保证凸缘不起皱的前提下尽可能小。压边装置分弹性（弹簧、橡皮，用于中小件）与刚性（用于双动压力机拉大型件）；此外采用锥形凹模、增大相对厚度也有助于防皱。"}],"recite":"凸缘在切向压应力下被压得拱起来，就是起皱。原因三条：凸缘相对厚度 t/D 小、切向压应力大（变形程度大）、凹模形状不利。最有效的办法是加压边圈，把料压住不让它拱；压边力够用就行，太大会拉裂。","chapter":"第 5 章 拉深工艺与模具设计"},{"id":"t4-2","title":"3．凸缘变形区的应力分布有何特点？","detail":[{"t":"p","x":"① 处于<b>径向受拉、切向受压<\/b>的“一拉一压”应力状态，同时厚度方向受压（压边圈与凹模作用），故为三向应力状态、平均应力为压应力，有利于提高塑性、防止起皱。"},{"t":"p","x":"② 沿径向分布不均：<b>切向压应力的绝对值在凸缘外缘最大<\/b>，向凹模入口方向逐渐减小；<b>径向拉应力在凹模入口处最大<\/b>，向外缘逐渐减小至零。"},{"t":"p","x":"③ 绝对值最大的是切向压应力，故凸缘主要发生切向压缩、径向伸长、厚度增厚，且<b>越靠口部增厚越多<\/b>（可达 30%）。"},{"t":"p","x":"④ 随拉深行程进行，σ<sub>r<\/sub> 的最大值先增大后减小（在行程中途达到峰值），而切向压应力随凸缘缩小逐渐减小。"}],"recite":"一句话“一拉一压加厚向压”：径向受拉、切向受压，压边圈和凹模再给它一个厚向压力。分布上，切向压应力在外缘最大、往里变小；径向拉应力在凹模入口最大、往外缘降到零。所以外缘最容易起皱，凹模入口附近最容易传力拉裂。","chapter":"第 5 章 拉深工艺与模具设计"},{"id":"t4-3","title":"4．什么是拉深系数？其代表什么含义？","detail":[{"t":"p","x":"<b>拉深系数 m<\/b>：拉深后工件直径与拉深前毛坯（半成品）直径之比，m=d/D；多次拉深时 m<sub>1<\/sub>=d<sub>1<\/sub>/D、m<sub>2<\/sub>=d<sub>2<\/sub>/d<sub>1<\/sub>……总拉深系数 m=d/D=m<sub>1<\/sub>·m<sub>2<\/sub>…mn。它也等于拉深后工件周长与拉深前毛坯周长之比。"},{"t":"p","x":"含义：<b>m 反映拉深变形程度<\/b>，m 越小表示拉深前后直径变化越大、变形程度越大；m 是拉深工艺最重要的工艺参数，是工艺计算的基础。材料既能拉深成形又不
