被拉裂时的最小 m 值称<b>极限拉深系数<\/b>，是判断能否一次拉成的依据。"}],"recite":"拉深系数 m=d/D，拉深后直径比拉深前直径。它衡量变形程度：m 越小，缩得越狠，变形越大。m 是整个拉深工艺计算的基础，不拉裂的最小 m 叫极限拉深系数。","chapter":"第 5 章 拉深工艺与模具设计"},{"id":"t4-4","title":"5．影响极限拉深系数的因素有哪些？","detail":[{"t":"p","x":"四个方面："},{"t":"ul","items":["<b>材料性能<\/b>：塑性好、屈强比小、厚向异性系数 r 大、硬化指数 n 大 → 极限拉深系数小（易拉深）。"]},{"t":"ul","items":["<b>模具方面<\/b>：间隙小、凹模圆角半径小、凸模圆角半径过小都会增大拉深力使 m 增大；锥形凹模可减小包角与摩擦，使 m 减小。"]},{"t":"ul","items":["<b>拉深条件<\/b>：有压边圈时 m 可比无压边圈时小（但压边力过大会拉裂）；无中间退火时随拉深次数增加 m 应逐渐增大；润滑好则 m 可小些。"]},{"t":"ul","items":["<b>工件方面<\/b>：相对厚度 t/D 大（重要因素）→ 抗起皱能力高、压边力小、m 可减小；工件形状越简单，m 越小。"]}],"recite":"四方面：材料（塑性好、屈强比小、r 大、n 大 → 能拉得更狠）；模具（间隙别太小、圆角半径别太小、锥形凹模更好）；条件（有压边、润滑好、多道次时系数逐次放大）；工件（t/D 大、形状简单更有利）。","chapter":"第 5 章 拉深工艺与模具设计"},{"id":"t4-5","title":"6．如何确定拉深次数及每次的拉深系数？","detail":[{"t":"p","x":"两种方法：<b>推算法<\/b>与<b>查表法<\/b>（按相对高度 h/d 直接查表）。"},{"t":"p","x":"推算法步骤：① 计算毛坯相对厚度 t/D×100%，查表得各次极限拉深系数 m<sub>1<\/sub>、m<sub>2<\/sub>…；② 计算总拉深系数 m=d/D；③ 若 m≥m<sub>1<\/sub> 可一次拉成；否则依次计算 d<sub>1<\/sub>=m<sub>1<\/sub>D、d<sub>2<\/sub>=m<sub>2<\/sub>d<sub>1<\/sub>、d<sub>3<\/sub>=m<sub>3<\/sub>d<sub>2<\/sub>……<b>直到第一次出现 dn≤d，此时的 n 即拉深次数<\/b>；④ <b>调整系数<\/b>：试算得到的末次直径往往小于工件直径，需把各次系数适当放大（且不小于对应极限值、由首件到末件逐次增大），使 m<sub>1<\/sub>′·m<sub>2<\/sub>′…mn′=m，再重算各次工序直径，末次应回到工件直径；⑤ 由公式计算各次工序件高度。"}],"recite":"查表得各次极限系数，算 m总=d/D；从 m总 比 m<sub>1<\/sub> 判断能不能一次拉成。不能就逐次乘：d<sub>1<\/sub>=m<sub>1<\/sub>D、d<sub>2<\/sub>=m<sub>2<\/sub>d<sub>1<\/sub>……算到第一次 dn≤d，这个 n 就是次数——注意一到就停，别多算一级。然后把系数适当放大，使连乘等于 m总，重算各次直径，末次应正好回到工件直径。","chapter":"第 5 章 拉深工艺与模具设计"},{"id":"t4-6","title":"7．拉深时凸、凹模间隙过大或过小时各造成什么后果？","detail":[{"t":"p","x":"<b>间隙过小<\/b>：变形阻力增加，板料与模具表面接触压力加大、摩擦磨损增大，拉深力增大、零件变薄严重、模具寿命降低；但得到的零件侧壁平直光滑、质量较好、精度较高。"},{"t":"p","x":"<b>间隙过大<\/b>：对毛坯的校直与挤压作用变小，拉深力降低、模具寿命提高；但零件质量变差，侧壁不直、形成弯曲形状，尺寸精度不易保证。"},{"t":"p","x":"确定原则：既考虑板料本身的尺寸公差，又考虑拉深过程中的增厚现象，故间隙一般比毛坯厚度略大。无压边圈 Z/2=(1～1.1)t<sub>max<\/sub>；有压边圈 Z/2=t<sub>max<\/sub>+ct。精度要求高的零件可采用负间隙拉深，但拉深力要增大 20%，需加大拉深系数。"}],"recite":"间隙过大：拉深力小、模具省，但侧壁不直、精度差、形状走样；间隙过小：阻力大、件被拉薄、模具磨得快、容易裂，不过侧壁光直、精度高。所以间隙一般比料厚略大，兼顾质量和寿命。","chapter":"第 5 章 拉深工艺与模具设计"},{"id":"t4-7","title":"8．拉深时为什么要加润滑？如何正确润滑？","detail":[{"t":"p","x":"目的：减小板料与凹模、压边圈之间的摩擦，降低拉深阻力与拉深力，减少模具磨损，防止工件划伤与局部过度变薄，从而提高极限变形程度、改善零件质量、延长模具寿命。"},{"t":"p","x":"正确做法：在<b>凹模圆角、凹模平面、压边圈表面以及与之接触的毛坯表面<\/b>，每隔一定周期均匀涂抹一层润滑剂；而<b>凸模表面及与凸模接触的毛坯表面禁止涂润滑剂<\/b> —— 否则材料易相对凸模滑动，危险断面处材料得不到足够的摩擦阻滞，反而更容易拉裂。"}],"recite":"润滑是为了减小摩擦和拉深力、防划伤、把变形程度提上去。涂的位置有讲究：凹模圆角、凹模平面、压边圈和与之接触的毛坯面要涂；凸模表面和贴着凸模的那面不能涂，涂了料容易打滑，危险断面反而更容易裂。","chapter":"第 5 章 拉深工艺与模具设计"}]}],"think":[{"id":"t0-0","title":"1．什么是塑性条件？","detail":[{"t":"p","x":"塑性条件又称<b>屈服准则（屈服条件）<\/b>，是描述不同应力状态下变形体内质点<b>开始产生塑性变形并使塑性变形继续进行所必须遵循的条件<\/b>。单向应力状态时，只要应力达到材料的屈服极限 σ<sub>s<\/sub> 该点即进入塑性状态；复杂应力状态不能只用一个应力分量判断，必须各应力分量之间满足一定关系，这个关系就是塑性条件。目前公认的有两种：<b>屈雷斯卡（Tresca）最大剪应力准则<\/b>（σ<sub>1<\/sub>−σ<sub>3<\/sub>=σ<sub>s<\/sub>，忽略中间主应力，形式简单、精度足够）与<b>密塞斯（von Mises）等效应力准则<\/b>（σ<sub>e<\/sub>=σ<sub>s<\/sub>，考虑了中间主应力，更接近实验数据）。"}],"recite":"材料从弹性跨进塑性必须满足的应力关系，也叫屈服准则。单向拉伸就是应力到 σ<sub>s<\/sub>；复杂应力有两个判据：Tresca 最大剪应力理论 σ<sub>1<\/sub>−σ<sub>3<\/sub>=σ<sub>s<\/sub>（不管中间应力），Mises 等效应力理论 σ<sub>e<\/sub>=σ<sub>s<\/sub>（把中间应力算进去，更接近试验）。","chapter":"第 2 章 冲压成形的基本理论"},{"id":"t0-1","title":"2．简述增量理论、全量理论的含义。","detail":[{"t":"p","x":"<b>增量理论<\/b>：撇开整个变形过程，取加载过程中某一微量时间间隔来研究，建立该瞬间<b>应力与应变增量<\/b>之间的关系，认为应变增量与应力偏量成正比。它不要求简单加载，适用于任意加载路径，但需沿加载路径积分，计算量大。"},{"t":"p","x":"<b>全量理论<\/b>：研究从加载开始到某一时刻的<b>全量（总应变）<\/b>关系，前提是<b>简单加载<\/b>（各应力分量按同一比例增加），结论是塑性总应变与应力偏量成正比。其三个前提为小变形、泊松比等于 0.5 且材料不可压缩、载荷按比率增长。工程上只要近似满足简单加载即可使用，可大大简化分析计算。"}],"recite":"增量理论盯住加载中某一瞬间，讲应变增量与应力偏量成正比，不管加载路径，所以适用面广但要积分；全量理论盯住从头到某一刻的全应变，讲总应变与应力偏量成正比，前提是简单加载（各应力按同一比例增加、小变形、不可压缩）。工程上只要近似比例加载，就用全量理论图省事。","chapter":"第 2 章 冲压成形的基本理论"},{"id":"t0-2","title":"3．当 σ<sub>1<\/sub>＞σ<sub>2<\/sub>＞σ<sub>3<\/sub> 时，用全量理论和体积不变定律分析：","detail":[{"t":"p","x":"<b>① σ<sub>1<\/sub> 是拉应力时，ε<sub>1<\/sub> 是否为拉应变？<\/b> 是。因为 σ<sub>1<\/sub>＞σ<sub>2<\/sub>＞σ<sub>3<\/sub>，必有 σ<sub>1<\/sub>＞σ<sub>m<\/sub>（平均应力 σ<sub>m<\/sub>=(σ<sub>1<\/sub>+σ<sub>2<\/sub>+σ<sub>3<\/sub>)/3），而全量理论指出应力大于平均应力时该方向一定产生拉应变，故 ε<sub>1<\/sub> 为拉应变。"},{"t":"p","x":"<b>② σ<sub>1<\/sub> 是压应力时，ε<sub>1<\/sub> 是否为压应变？<\/b> 不是，仍是<b>拉应变<\/b>。三向受压时 σ<sub>1<\/sub> 是绝对值最小的压应力，但它仍大于平均应力，故 ε<sub>1<\/sub>＞0。这说明“压应力方向一定产生压应变”是错的，三向受压时最小压应力方向反而被拉长。"},{"t":"p","x":"<b>③ 每个主应力方向与所对应的主应变方向是否一定一致？<\/b> 不一定。应力分量与应变分量的性质不一定一致（拉应力可对应压应变），但大小次序相对应（σ<sub>1<\/sub>＞σ<sub>2<\/sub>＞σ<sub>3<\/sub> 则 ε<sub>1<\/sub>＞ε<sub>2<\/sub>＞ε<sub>3<\/sub>），且满足 ε<sub>1<\/sub>+ε<sub>2<\/sub>+ε<sub>3<\/sub>=0（体积不变）。判断应变性质必须把该方向应力与<b>平均应力<\/b>比较，不能只看该应力是拉还是压。"}],"recite":"关键是把 σ<sub>1<\/sub> 和平均应力 σ<sub>m<\/sub> 比。因为 σ<sub>1<\/sub> 最大，恒有 σ<sub>1<\/sub>＞σ<sub>m<\/sub>，所以不管 σ<sub>1<\/sub> 是拉还是压，ε<sub>1<\/sub> 一律是拉应变——三向受压时“压力最小的那个方向”反而被拉长。应力方向和应变方向因此不一定同号，但大小次序一致（σ<sub>1<\/sub>＞σ<sub>2<\/sub>＞σ<sub>3<\/sub> 对应 ε<sub>1<\/sub>＞ε<sub>2<\/sub>＞ε<sub>3<\/sub>），且三者之和为零。","chapter":"第 2 章 冲压成形的基本理论"},{"id":"t0-3","title":"4．什么是伸长类变形？什么是压缩类变形？如何划分？","detail":[{"t":"p","x":"<b>伸长类变形<\/b>：变形区的<b>拉应力绝对值最大<\/b>，主要变形为沿该方向的<b>伸长<\/b>变形，如胀形、翻孔、起伏成形。<b>压缩类变形<\/b>：变形区的<b>压应力绝对值最大<\/b>，主要变形为沿该方向的<b>压缩<\/b>变形，如拉深、缩口。"},{"t":"p","x":"<b>划分依据<\/b>：看变形区三个主应力中<b>绝对值最大者<\/b>是拉还是压，其主要变形方向就随之为伸长或压缩。生产中把板料成形的受力与变形状况概括为这两大类，便于分析各自的成形极限与主要缺陷（伸长类易拉裂，压缩类易起皱）。"}],"recite":"看变形区里绝对值最大的那个主应力：是拉应力就叫伸长类（胀形、翻孔），主要变形是沿该方向伸长；是压应力就叫压缩类（拉深、缩口），主要变形是沿该方向压缩。一句话：谁绝对值最大，就按谁命名。","chapter":"第 2 章 冲压成形的基本理论"},{"id":"t0-4","title":"5．区分真实应力与名义应力、真实应变与名义应变；两条曲线有何差别？","detail":[{"t":"p","x":"<b>名义应力<\/b>按变形前的<b>原始截面积<\/b>计算，<b>真实应力<\/b>按变形当时的<b>瞬时截面积<\/b>计算；<b>名义应变<\/b>只考虑变形前后两个状态的尺寸，<b>真实应变<\/b>按变形<b>逐步累积<\/b>计算（考虑变形全过程）。"},{"t":"p","x":"差别：名义应力-应变曲线在缩颈后下降，掩盖了材料仍在硬化的实质；<b>真实应力-应变曲线在失稳点后仍持续上升<\/b>，说明材料抵抗塑性变形的能力随应变增加而不断提高，即不断发生硬化 —— 这条曲线才称为<b>硬化曲线<\/b>，才能真实反映硬化规律。生产中为简化，常用指数曲线 σ=C·ε<sup>n<\/sup> 作近似硬化曲线。"}],"recite":"名义应力拿原始截面积去除，真实应力拿当时瞬时截面积去除；名义应变只比首末两个尺寸，真实应变是把变形一点点累积起来。名义曲线缩颈后往下掉，看着像软化；真实曲线一直往上走，才说明材料在持续硬化，所以硬化规律要用真实曲线。","chapter":"第 2 章 冲压成形的基本理论"},{"id":"t0-5","title":"6．对冲压工艺有重大影响的机械性能指标有哪些？应提出什么要求？","detail":[{"t":"p","x":"共有<b>七项<\/b>，要求与理由如下："},{"t":"ul","items":["<b>屈服极限 σ<sub>s<\/sub> —— 小好<\/b>：易屈服、变形抗力小；压缩变形时不易起皱，弯曲回弹小，贴模性与定形性好。"]},{"t":"ul","items":["<b>屈强比 σ<sub>s<\/sub>/σ<sub>b<\/sub> —— 小好<\/b>：从屈服到拉裂有较大的塑性变形区间，变形区易变形不易起皱、传力区强度高不易拉裂，对拉深特别有利。"]},{"t":"ul","items":["<b>均匀延伸率 δ<sub>u<\/sub> —— 大好<\/b>：表示均匀稳定塑性变形的能力，直接决定伸长类变形的成形性能，是翻孔、扩孔性能的最主要参数。"]},{"t":"ul","items":["<b>弹性模量 E —— 大好<\/b>：弹性变形小、回弹小，定形性好。"]},{"t":"ul","items":["<b>硬化指数 n —— 对伸长类变形大好<\/b>：变形均匀、不易局部集中变形与破坏，提高成形极限；但硬化显著对后续工序不利。"]},{"t":"ul","items":["<b>厚向异性系数 r —— 大好<\/b>：板平面方向比厚度方向易变形，不易变薄或增厚，减小起皱、受拉处不易开裂，利于拉深。"]},{"t":"ul","items":["<b>板平面各向异性系数 Δ<sub>r<\/sub> —— 小好<\/b>：Δ<sub>r<\/sub> 大则各向异性严重，变形不均匀、易产生凸耳，影响零件质量。"]}],"recite":"七项，记“两小、四大、一小”：σ<sub>s<\/sub> 小、屈强比小；均匀延伸率大、弹性模量大、硬化指数 n 大、厚向异性系数 r 大；板平面各向异性 Δ<sub>r<\/sub> 小。总目的就一句：好变形、不易裂、不起皱、回弹小。","chapter":"第 2 章 冲压成形的基本理论"},{"id":"t0-6","title":"7．板料的冲压成形性能包括哪些方面？","detail":[{"t":"p","x":"包括三方面：<b>抗破裂性<\/b>（冲压过程中产生开裂的难易程度）、<b>贴模性<\/b>（取得与模具形状一致性的能力，起皱、塌陷会降低贴模性）、<b>定形性<\/b>（脱模后保持模具内既得形状的能力，主要受回弹影响）。"},{"t":"p","x":"其中贴模性与定形性决定零件的形状与尺寸精度；但抗破裂性差会导致零件严重破坏且难以修复，故生产中<b>主要用抗破裂性<\/b>作为评定板料冲压成形性能的指标。与之相关的是<b>成形极限<\/b>（失稳前可达到的最大变形程度），分总体成形极限（极限拉深系数、极限胀形高度、极限翻孔系数）与局部成形极限。"}],"recite":"三方面：抗破裂性（开不开裂）、贴模性（贴不贴模、起皱塌陷就差）、定形性（脱模后能不能保住形状，看回弹）。三者里主要考核抗破裂性，因为裂了没法修，其它两项还能补救。","chapter":"第 2 章 冲压成形的基本理论"},{"id":"t1-0","title":"1．冲裁变形过程包括哪几个阶段？","detail":[{"t":"p","x":"三个阶段，在瞬间完成："},{"t":"ul","items":["<b>弹性变形阶段<\/b>：板料产生弹性压缩、弯曲与拉伸，刃口附近出现初始（塌角）圆角，板料翘曲，变形可恢复。"]},{"t":"ul","items":["<b>塑性变形阶段<\/b>：应力达屈服极限，产生塑性变形，塌角增大，刃口出现微裂纹，变形区出现塑性剪切面，变形不可恢复。"]},{"t":"ul","items":["<b>断裂分离阶段<\/b>：裂纹扩展、上下裂纹重合，形成粗糙而有锥度的断裂带，并产生毛刺，板料被一分为二。"]}],"recite":"弹性变形—塑性变形—断裂分离，三步在瞬间完成。弹性段材料被压弯、刃口出现小塌角；塑性段刃口产生微裂纹、出现光亮剪切面；断裂段裂纹扩展贯通，留下断裂带和毛刺。","chapter":"第 3 章 冲裁工艺与模具设计"},{"id":"t1-1","title":"2．冲裁断面的特征区有哪几种？","detail":[{"t":"p","x":"四个特征区（按从塌角到毛刺的顺序）：<b>圆角带（塌角）<\/b>——刃口附近材料被牵连拉入产生弯曲与伸长变形而成；<b>光亮带<\/b>——模具挤压切入使材料塑性变形而成，是断面质量最好的部分，也是测量与使用部位；<b>断裂带<\/b>——刃口微裂纹在拉应力下扩展断裂而成，表面粗糙且带锥度；<b>毛刺<\/b>——断裂带周边的不规则撕裂毛边。四区比例随材料性能、料厚、刃口锋利程度、模具结构与间隙而变；高质量断面光亮带约占 1/3。"}],"recite":"塌角（圆角带）、光亮带、断裂带、毛刺，四段。光亮带最平整，是测量和使用的地方；落料件的光亮带在大端（等于凹模尺寸），冲孔件在小端（等于凸模尺寸）。","chapter":"第 3 章 冲裁工艺与模具设计"},{"id":"t1-2","title":"3．试分析影响冲裁件质量的因素。","detail":[{"t":"p","x":"冲裁件质量含断面质量、尺寸精度、形状误差三项，影响因素可归为四类："},{"t":"ul","items":["<b>材料性能<\/b>：塑性好则裂纹出现迟、光亮带宽、毛刺与穹弯大、断裂带窄；塑性差则相反。"]},{"t":"ul","items":["<b>间隙大小及分布均匀性<\/b>：<b>最主要因素<\/b>，决定上下裂纹是否重合；间隙不均处会出现大毛刺。"]},{"t":"ul","items":["<b>模具刃口锋利程度<\/b>：刃口磨钝后接触面积增大、应力集中减轻、裂纹推迟，圆角与光亮带增大但毛刺增高；凹模磨钝在冲孔件下端出毛刺，凸模磨钝在落料件上端出毛刺。"]},{"t":"ul","items":["<b>模具制造精度<\/b>（影响间隙均匀性）、<b>材料性质与轧制方向、料厚<\/b>（影响弹性变形量）：塑性越好、料越厚、平行轧制方向，冲裁后误差越小。"]},{"t":"p","x":"形状误差方面：<b>扭曲<\/b>由间隙不均、刃口形状误差、板料各向异性引起；<b>翘曲<\/b>是残余弯曲变形（穹弯），间隙过大、弯矩增大时加重；采用压料装置与反向压力可有效减小。"}],"recite":"四个：材料性能（塑性好则光亮带宽、毛刺大）、间隙大小与均匀性（最主要，决定上下裂纹合不合）、刃口锋利程度（磨钝后裂纹推迟、毛刺变高）、模具制造精度。另外板料厚度、轧制方向也影响回弹造成的尺寸偏差。","chapter":"第 3 章 冲裁工艺与模具设计"},{"id":"t1-3","title":"4．分析冲裁间隙的大小与冲裁件尺寸之间的关系。","detail":[{"t":"p","x":"规律由变形区应力状态决定：<b>间隙大于合理间隙<\/b>时，径向拉应力较大，冲裁时伸长弹性变形大、冲裁后回缩，故<b>冲孔件尺寸＞凸模尺寸、落料件尺寸＜凹模尺寸<\/b>；<b>间隙小于合理间隙<\/b>时，径向压应力较大，压缩弹性变形大、冲裁后回弹，故<b>冲孔件尺寸＜凸模尺寸、落料件尺寸＞凹模尺寸<\/b>。此外材料塑性越好、料越厚、平行于轧制方向，弹性变形量越小，冲裁后误差越小。"}],"recite":"间隙大，材料受径向拉，冲完回缩：冲孔件偏大、落料件偏小。间隙小，材料受径向压，冲完回弹：冲孔件偏小、落料件偏大。记“大拉缩、小压胀”。","chapter":"第 3 章 冲裁工艺与模具设计"},{"id":"t1-4","title":"5．冲裁间隙的大小对冲裁断面质量有何影响？","detail":[{"t":"p","x":"断面质量取决于<b>上下裂纹是否重合<\/b>："},{"t":"ul","items":["<b>间隙合适<\/b>：上下裂纹重合，断面斜度很小、平直光滑、毛刺小、无裂纹分层，质量最好。"]},{"t":"ul","items":["<b>间隙过小<\/b>：凸模侧裂纹向外错开，上下裂纹各自进入压应力区而停止扩展，中间材料被二次剪切，出现<b>双光亮带<\/b>，两光亮带之间夹一段断裂带。"]},{"t":"ul","items":["<b>间隙过大<\/b>：凸模侧裂纹向里错开、不重合，裂纹间材料被二次拉裂，断面出现<b>双锥度<\/b>，毛刺明显增大、塌角大。"]},{"t":"p","x":"另外间隙不均匀时，不合理处会出现较大毛刺、断面质量差，故必须保证间隙分布均匀。"}],"recite":"间隙合适，上下裂纹正好接上，断面平直、光亮带占大头、毛刺小；间隙过小，上下裂纹向外错开，出双光亮带，中间夹断裂带；间隙过大，裂纹向里错开，材料被二次拉裂，出双锥度、毛刺明显变大。","chapter":"第 3 章 冲裁工艺与模具设计"},{"id":"t1-5","title":"6．如何确定冲裁模的间隙？","detail":[{"t":"p","x":"三种方法："},{"t":"ul","items":["<b>理论确定法<\/b>：以“上下裂纹重合连成一线”为判据，由几何关系得 Z 与料厚 t、凸模相对压入深度 h/t、裂纹方向角 β 有关。h/t 越小，合理间隙越大；h/t 越大，合理间隙越小。"]},{"t":"ul","items":["<b>经验查表法<\/b>：按使用要求、材料性质与料厚查表得一个范围值，只要间隙在范围内即可冲出合格件。断面与尺寸要求高取小值；精度要求不高取大间隙以降低冲裁力、提高模具寿命。"]},{"t":"ul","items":["<b>经验公式法<\/b>：Z=(7～10)%t，即 Z<sub>min<\/sub>=0.07t、Z<sub>max<\/sub>=0.10t。"]},{"t":"p","x":"设计制造新模具时应取<b>最小合理间隙 Z<sub>min<\/sub><\/b>，因为使用中磨损会使间隙逐渐增大，直至 Z<sub>max<\/sub>。"}],"recite":"三条路：理论法按“上下裂纹重合”推；经验公式按 Z=(7～10)%t 估；实际生产查表，按材料、料厚和使用要求定一个范围。新模具取最小合理间隙，因为用着用着间隙会磨大。","chapter":"第 3 章 冲裁工艺与模具设计"},{"id":"t1-6","title":"7．简述冲裁模刃口尺寸的计算原则和方法。","detail":[{"t":"p","x":"<b>三条原则<\/b>：① 保证冲出合格零件——<b>冲孔以凸模为基准件<\/b>（先算 d<sub>p<\/sub>，间隙取在凹模方向）；<b>落料以凹模为基准件<\/b>（先算 D<sub>d<\/sub>，间隙取在凸模方向）；② 保证模具寿命——新模取 Z<sub>min<\/sub>，落料凹模取接近零件最小极限尺寸、冲孔凸模取接近孔的最大极限尺寸，以留出磨损量；③ 合理确定模具精度——模具精度比零件高 2～4 级，公差取工件公差的 1/3～1/4。"},{"t":"p","x":"<b>两种方法<\/b>：① <b>分别加工法<\/b>（适用圆形或简单规则形状）：冲孔 d<sub>p<\/sub>=(d+xΔ)<sub>−δ<sub>p<\/sub><\/sub>、d<sub>d<\/sub>=(d<sub>p<\/sub>+Z<sub>min<\/sub>)<sub>+δ<sub>d<\/sub><\/sub>；落料 D<sub>d<\/sub>=(D−xΔ)<sub>+δ<sub>d<\/sub><\/sub>、D<sub>p<\/sub>=(D<sub>d<\/sub>−Z<sub>min<\/sub>)<sub>−δ<sub>p<\/sub><\/sub>；须满足 δ<sub>p<\/sub>+δ<sub>d<\/sub>≤Z<sub>max<\/sub>−Z<sub>min<\/sub>。② <b>配作加工法<\/b>（适用形状复杂件）：先按设计尺寸制造基准件，另一件按基准件实际尺寸配作，保证 Z<sub>min<\/sub>；计算前先把各尺寸按磨损后“变大（A 类）、变小（B 类）、不变（C 类）”分类，分别用不同公式计算。"}],"recite":"原则三条：冲孔以凸模为基准、落料以凹模为基准；凹模取接近工件最小极限尺寸、凸模取接近孔的最大极限尺寸（留磨损量）；模具精度比工件高 2～4 级。方法两种：形状简单用分别加工（要满足 δ<sub>p<\/sub>+δ<sub>d<\/sub>≤Z<sub>max<\/sub>−Z<sub>min<\/sub>），形状复杂用配作，先做基准件，另一件按实际尺寸配，图上只注“保证 Z<sub>min<\/sub>”。","chapter":"第 3 章 冲裁工艺与模具设计"},{"id":"t1-7","title":"8．简述降低冲裁力的措施。","detail":[{"t":"p","x":"目的是用小吨位压力机冲裁或使冲裁过程平稳，常用三种："},{"t":"ul","items":["<b>阶梯冲裁<\/b>：多凸模做成不同长度、工作端面阶梯布置，使各凸模最大冲裁力不同时出现，从而降低总冲裁力；高度差 H 应大于光亮带高度，各层对称布置使合力过模具中心，冲裁力只按最大那层计算。"]},{"t":"ul","items":["<b>斜刃冲裁<\/b>：刃口做成斜刃，使刃口逐步切入板料，冲裁力显著降低且平稳；斜刃须对称布置；落料模凸模平刃、凹模斜刃，冲孔模凹模平刃、凸模斜刃；缺点是模具制造修磨困难、刃口易磨损、零件不够平整，用于大型件与厚板。"]},{"t":"ul","items":["<b>加热冲裁<\/b>：板料加热后抗剪强度明显下降，从而降低冲裁力，一般只适用于厚板件。"]}],"recite":"三招：阶梯冲裁（凸模做成长短不一，别同时吃力）、斜刃冲裁（刃口逐渐切入，落料斜凹模、冲孔斜凸模）、加热冲裁（把料烧软，只适合厚板）。","chapter":"第 3 章 冲裁工艺与模具设计"},{"id":"t2-0","title":"1．冲裁模由哪几部分构成？各部分有何作用？","detail":[{"t":"p","x":"五个部分："},{"t":"ul","items":["<b>工作部分<\/b>（凸模、凹模、凸凹模）：完成材料的分离或成形，零件质量与精度主要靠它保证。"]},{"t":"ul","items":["<b>定位及挡料部分<\/b>（导料板、导料销、挡料销、导正销、侧刃、定位板）：确定条料、毛坯及半成品在模具中的正确位置，分送进导向与送料定距。"]},{"t":"ul","items":["<b>卸料及推件装置<\/b>（卸料板、打杆、推块、推杆、推件器、顶件块、弹簧、橡胶）：把箍在凸模外的料卸下、卡在凹模内的件推出，保证冲压连续进行。"]},{"t":"ul","items":["<b>导向装置<\/b>（导柱、导套）：保证上下模正常运行、不产生位置偏移。"]},{"t":"ul","items":["<b>连接固定部分<\/b>（模柄、上下模座、固定板、垫板、螺钉销钉）：连接紧固各零件，使之成为完整整体。"]},{"t":"p","x":"按功用可分为<b>工艺结构零件<\/b>（前三个）与<b>辅助结构零件<\/b>（后两个）。"}],"recite":"五部分：工作部分（凸模、凹模、凸凹模，管成形和分离）、定位挡料部分（管条料方向和步距）、卸料推件部分（把料卸下来、把件推出去）、导向部分（导柱导套，保证上下模对中）、连接固定部分（模柄模座固定板垫板螺钉销钉，把一切连成整体）。","chapter":"第 3 章（续）冲裁模结构及设计"},{"id":"t2-1","title":"2．对冲裁模的要求有哪些？","detail":[{"t":"p","x":"① 能稳定冲出合格零件——刃口尺寸正确、间隙合理且均匀；② 有足够的强度与刚度，受力时不致变形失效；③ 导向可靠、精度稳定；④ 卸料与推件顺畅，操作安全方便；⑤ 结构工艺性好，尽量采用标准件与标准模架，制造与维修成本低；⑥ 刃口耐磨，模具有足够使用寿命；⑦ 安装、调整、刃磨方便。"}],"recite":"能稳定冲出合格件（刃口尺寸对、间隙合理均匀）、有足够强度和刚度、导向可靠、卸料推件顺畅安全、结构工艺性好并尽量用标准件、刃口耐磨寿命够。","chapter":"第 3 章（续）冲裁模结构及设计"},{"id":"t2-2","title":"3．什么是连续模？连续模冲压有何特点？","detail":[{"t":"p","x":"<b>连续模（级进模、跳步模）<\/b>：在压力机一次行程中，按一定顺序<b>在同一模具的不同工位上<\/b>完成两道以上冲压工序的模具，各工序沿条料送进方向分布，属多工序模。"},{"t":"p","x":"特点：① 生产效率高，适用于大批量生产；② 可减少模具与设备数量，便于实现自动化与安全生产；③ 结构复杂、制造困难、成本高；④ 各工序在不同工位完成，<b>存在定位累积误差，影响工件精度<\/b>。"}],"recite":"一次行程里，在送料方向上排开的几个工位各干一道工序，就是连续模。优点是效率高、省模具省设备、好自动化；缺点是结构复杂成本高，而且各工位分开做，定位有累积误差，精度不如复合模。","chapter":"第 3 章（续）冲裁模结构及设计"},{"id":"t2-3","title":"4．设计连续模时应注意哪些问题？","detail":[{"t":"p","x":"① <b>合理排样<\/b>：确定搭边、步距、条料宽度与工位数，先冲孔后落料，最后把工件与条料分离；② <b>定距方式要可靠<\/b>：用侧刃、导正销、挡料销组合控制进距，减少累积误差；③ 保证各工位凸、凹模的<b>强度与刚度<\/b>（工位间距足够、避免窄壁）；④ 卸料装置要能同时把多个工位上的料卸下（多用固定卸料板或弹性卸料板）；⑤ 条料送进顺畅、有足够的导料长度与始用挡料；⑥ 模具闭合高度与压力机行程、台面尺寸相匹配。"}],"recite":"排样要合理（步距、搭边、条宽）；定距要可靠，常用侧刃、导正销、挡料销组合；工序顺序先冲孔后落料；各工位凸凹模要有足够强度；卸料和送料要顺畅；最后校核闭合高度和压力机。","chapter":"第 3 章（续）冲裁模结构及设计"},{"id":"t2-4","title":"5．什么是复合模？复合模冲压有何特点？","detail":[{"t":"p","x":"<b>复合模<\/b>：在压力机一次行程中，在模具的<b>一个工位<\/b>上<b>同时<\/b>完成两道以上不同冲压工序的模具，其工作部分除凸、凹模外还有<b>凸凹模<\/b>（内缘作冲孔凹模、外缘作落料凸模）。"},{"t":"p","x":"特点：① 内外形<b>同工位一次冲出，位置精度高<\/b>，不受送料误差影响；② 生产率高，适宜大批量；③ 结构紧凑但对凸凹模<b>最小壁厚<\/b>有要求，不能冲内外尺寸差过小的零件；④ 模具制造复杂、成本高；⑤ 倒装式废料向下排出、操作方便但孔内积料可能涨裂；正装式不积料但废料落在工作面上不易清除。"}],"recite":"一次行程、一个工位上同时完成两道以上工序，靠的就是那个既能当凸模又能当凹模的“凸凹模”。内外形同工位冲出，位置精度高、效率高；但受凸凹模最小壁厚限制，模具制造也复杂。","chapter":"第 3 章（续）冲裁模结构及设计"},{"id":"t2-5","title":"6．设计复合模时应注意哪些问题？","detail":[{"t":"p","x":"① 校核<b>凸凹模最小壁厚<\/b>（不积料时冲硬材料 c≥1.5t、冲软材料 c≥t；积料时加大），不满足则不能用复合模；② 合理选择<b>正装或倒装<\/b>：倒装式废料向下排出、结构简单操作方便，但孔内积料易涨裂；正装式不积料但清废不便；③ 正确设计<b>推件与卸料<\/b>装置（刚性推件装于上模、弹性推件装于下模），保证工件与废料顺利排出；④ 保证凸凹模的固定可靠与刃磨方便；⑤ 注意模具闭合高度与最小壁厚对结构尺寸的限制。"}],"recite":"先校核凸凹模最小壁厚（冲硬料 ≥1.5t，冲软料 ≥t，积料还要加大），不够就不能用复合模；再选正装还是倒装——倒装废料往下排、好操作但孔内容易积料涨裂，正装不积料但清废麻烦；推件卸料装置要可靠。","chapter":"第 3 章（续）冲裁模结构及设计"},{"id":"t2-6","title":"7．模具定位零件有何作用？常用定位零件有哪几种？","detail":[{"t":"p","x":"作用是<b>确定条料、毛坯或半成品在模具中的正确位置<\/b>，保证冲出的零件位置准确、批次一致。条料定位有两方面内容："},{"t":"ul","items":["<b>送进导向<\/b>（垂直于送料方向定位，保证条料沿正确方向送进）：导料板、导料销。"]},{"t":"ul","items":["<b>送料定距<\/b>（沿送料方向控制一次送进距离即步距）：挡料销（固定式、活动式）、侧刃、导正销。"]},{"t":"p","x":"另外还有定位板、定位钉、定位销（用于单件毛坯或半成品定位）以及自动送料装置。"}],"recite":"作用是让条料或毛坯在模具里待在该待的位置。分两类：管方向的（导料板、导料销）和管步距的（挡料销、侧刃、导正销）；单件毛坯另有定位板、定位钉、定位销。","chapter":"第 3 章（续）冲裁模结构及设计"},{"id":"t2-7","title":"8．什么是冲裁模压力中心？为什么要使其与冲床滑块中心重合？如何计算？","detail":[{"t":"p","x":"<b>压力中心<\/b>是冲压合力的作用点，即凸模对工件施加力的合力作用点。若与滑块中心线不重合，模具将承受<b>偏心力矩<\/b>，产生偏斜、间隙不均、导柱导套单边磨损，严重时损坏模具与压力机，并影响零件质量。"},{"t":"p","x":"计算方法（解析法，求平行力系合力作用点）：① 按比例画出冲裁轮廓；② 建立直角坐标系；③ 把轮廓分解为直线段与圆弧段，求各段长度 l<sub>i<\/sub> 及其形心坐标；④ 因冲裁力与轮廓长度成正比，可用长度代替力，按力矩平衡计算 x<sub>c<\/sub>=Σ(l<sub>i<\/sub>·x<sub>i<\/sub>)/Σl<sub>i<\/sub>、y<sub>c<\/sub>=Σ(l<sub>i<\/sub>·y<sub>i<\/sub>)/Σl<sub>i<\/sub>。特殊情形可简化：双对称图形在几何中心，单对称图形在对称轴上，直线段在中点；多凸模冲裁时 l<sub>i<\/sub> 换成各凸模周长、(x<sub>i<\/sub>,y<sub>i<\/sub>) 换成各凸模压力中心坐标。"}],"recite":"压力中心就是冲裁合力的作用点。不重合就会产生偏心力矩，模具歪、间隙不匀、导柱单边磨损。算法是按力矩平衡加权：把轮廓切成线段，用各段长度 l<sub>i<\/sub> 和形心坐标 x<sub>i<\/sub>、y<sub>i<\/sub> 求 x<sub>c<\/sub>=Σl<sub>i<\/sub>x<sub>i<\/sub>/Σl<sub>i<\/sub>、y<sub>c<\/sub>=Σl<sub>i<\/sub>y<sub>i<\/sub>/Σl<sub>i<\/sub>；对称件直接取几何中心。","chapter":"第 3 章（续）冲裁模结构及设计"},{"id":"t2-8","title":"9．什么是冲裁模闭合高度？如何确定？","detail":[{"t":"p","x":"<b>闭合高度<\/b>：模具在最低工作位置时，<b>上模板上平面与下模板下平面之间的距离<\/b>。<b>装模高度<\/b>：滑块在下止点时，滑块下表面至工作台垫板上表面的距离。"},{"t":"p","x":"确定方法：模具闭合高度必须介于压力机最大与最小装模高度之间，通常按 <b>H<sub>min<\/sub>+10 ≤ H<sub>m<\/sub> ≤ H<sub>max<\/sub>−5<\/b> 确定，且 H<sub>m<\/sub> 尽可能取大值（最好接近 H<sub>max<\/sub>−5），以免连杆调节过长损坏连接螺纹。若 H<sub>m<\/sub>＜H<sub>min<\/sub> 则模具无法安装，相差不大时可另加厚垫板满足要求。"}],"recite":"模具合到最低时，上模座上平面到下模座下平面的距离。它得卡在压力机装模高度区间里：H<sub>min<\/sub>+10 ≤ H<sub>m<\/sub> ≤ H<sub>max<\/sub>−5，且尽量取大，免得连杆调太长；不够就加垫板。","chapter":"第 3 章（续）冲裁模结构及设计"},{"id":"t3-0","title":"1．弯曲时变形主要是在什么部位？其有何特点？","detail":[{"t":"p","x":"变形主要在<b>弯曲件的圆角部分<\/b>，远离圆角的直边基本不变形（靠近圆角处有少许变化）。特点五条：① 圆角区网格由矩形变<b>扇形<\/b>；② 变形不均匀，外层纤维受拉伸长、内层受压缩短，中间存在长度不变的<b>应变中性层<\/b>；③ 应力不均匀，外层切向受拉、内层切向受压，中间存在切向应力为零的<b>应力中性层<\/b>；④ r/t 小时板料<b>变薄<\/b>；⑤ 相对宽度 b/t 决定断面是否畸变（宽板断面不变，窄板变扇形且内宽外窄）。"}],"recite":"主要在圆角部分，直边基本不动。五个特点：圆角网格变扇形；外层拉长内层压短，中间有不伸缩的应变中性层；应力也是外层拉内层压，有应力中性层；r/t 小会变薄；宽板断面不变、窄板变扇形。","chapter":"第 4 章 弯曲工艺与模具设计"},{"id":"t3-1","title":"2．宽板、窄板弯曲时的应力应变状态有何不同？","detail":[{"t":"p","x":"<b>宽板（b/t＞3）<\/b>：宽度方向变形阻力很大，材料不能自由变形，<b>宽度应变 ε<sub>2<\/sub>≈0，属平面应变状态；同时宽度方向存在应力，属立体应力状态<\/b>（内区宽度伸长受阻，σ<sub>2<\/sub> 为压；外区收缩受阻，σ<sub>2<\/sub> 为拉）。横断面几乎不变、仍为矩形，厚度方向变薄。"},{"t":"p","x":"<b>窄板（b/t＜3）<\/b>：宽度方向可自由变形，<b>宽度应力 σ<sub>2<\/sub>≈0，属平面应力状态；但宽度应变为立体状态<\/b>，外层宽度收缩、内层宽度增大，横断面由矩形变成<b>扇形且内宽外窄<\/b>。"},{"t":"p","x":"两者的共同点是：切向应力与切向应变沿板厚线性分布，都存在中性层，外层受拉、内层受压。"}],"recite":"看 b/t。宽板（＞3）宽度上动不了，应变≈0 但应力不为零，属“平面应变+立体应力”，断面还是矩形；窄板（≤3）宽度上能自由伸缩，应力≈0 但应变不为零，属“立体应变+平面应力”，断面变成扇形、内宽外窄。","chapter":"第 4 章 弯曲工艺与模具设计"},{"id":"t3-2","title":"3．弯曲件毛坯尺寸的计算步骤。","detail":[{"t":"p","x":"依据是<b>应变中性层长度在弯曲前后不变<\/b>，故按中性层展开求和：① 由弯曲件图分割出变形区（圆角部分）与直边；② 确定各直边段长度 l；③ 由 r/t 查中性层系数 x，确定中性层曲率半径 ρ=r+xt；④ 计算各圆角段中性层展开长度（πα/180·ρ）；⑤ 相加得毛坯总长度 L=Σl+Σ(πα/180)(r+xt)。对 r＜0.5t 的无圆角弯曲需按体积相等用修正公式；复杂多角件还需试弯修正。"}],"recite":"按中性层展开：先把零件分成直边和圆角，量出各直边长度；由 r/t 查中性层系数 x，得 ρ=r+xt；各圆角段展开长按 πα/180·ρ 算；最后全部相加。","chapter":"第 4 章 弯曲工艺与模具设计"},{"id":"t3-3","title":"4．什么是弯曲系数？其代表什么含义？","detail":[{"t":"p","x":"<b>弯曲系数（相对弯曲半径）K=r/t<\/b>，即弯曲件内圆角半径与料厚之比。它代表<b>弯曲变形程度<\/b>：K 越小，外表面切向应变越大，变形程度越大；K 越大则变形程度越小、回弹越大。不产生拉裂破坏时的最小 K 值称最小弯曲系数，对应<b>最小弯曲半径 r<sub>min<\/sub><\/b>。"}],"recite":"弯曲系数就是相对弯曲半径 K=r/t。它表示弯曲的变形程度：K 越小，外层拉得越狠，变形越大；不拉裂的最小 K 对应最小弯曲半径。","chapter":"第 4 章 弯曲工艺与模具设计"},{"id":"t3-4","title":"5．简述影响弯曲系数的因素。","detail":[{"t":"p","x":"① <b>材料机械性能<\/b>：塑性越好，允许的弯曲系数越小；可用退火、正火提高塑性。② <b>板料纤维方向<\/b>：弯曲线<b>垂直于纤维方向<\/b>时塑性最好、弯曲系数最小；弯曲半径小时必须使折弯线垂直于纤维方向。③ <b>弯曲角<\/b>：弯曲角小，直边参与变形对变形区外层的受拉状态起缓解作用，弯曲系数可更小。④ <b>表面与侧边质量<\/b>：有划伤、裂纹、毛刺时易开裂，需取较大值。⑤ <b>板料厚度<\/b>：薄料应变梯度大、邻近纤维能补充表层变形，故薄料可用更小的弯曲系数。"}],"recite":"材料塑性（好则能弯更小的半径）、纤维方向（弯曲线垂直纤维最好）、弯曲角（角度小则直边帮忙分担）、表面与侧边质量（有毛刺裂纹就得放大）、料厚（薄料能弯得更小）。","chapter":"第 4 章 弯曲工艺与模具设计"},{"id":"t3-5","title":"6．什么是弯曲回弹现象？产生回弹的根本原因是什么？","detail":[{"t":"p","x":"<b>回弹<\/b>：弯曲变形由塑性变形与弹性变形两部分组成，外力去除后塑性变形保留、弹性变形完全恢复，使弯曲件从模具取出后其<b>弯曲角与弯曲半径与模具不一致<\/b>的现象，表现为弯曲角增大（正回弹）或减小（负回弹）、曲率变化。"},{"t":"p","x":"<b>根本原因<\/b>：弯曲变形后变形区断面上切向应力分布不均匀，卸载时材料内部产生<b>弹性恢复应力<\/b>（残余应力释放），使零件产生反向弹性变形。只要有残存的弹性变形，回弹就不可避免；弯曲的回弹值比其他塑性加工方法大，是不易解决的特殊问题。"}],"recite":"弯曲完把件取出来，角度和半径跟模具对不上，就是回弹。根子在卸载：变形区里应力分布不均匀，弹性变形要恢复，残余应力一释放，件就弹回去。只要还有弹性变形，回弹就躲不掉。","chapter":"第 4 章 弯曲工艺与模具设计"},{"id":"t3-6","title":"7．简述减小弯曲件回弹的常用措施。","detail":[{"t":"p","x":"① <b>改进弯曲件局部结构<\/b>：在弯曲区压制加强筋，增加刚度与塑性变形程度；② <b>选用合适材料<\/b>：弹性模量大、屈服极限低的材料；③ <b>工艺措施<\/b>：用<b>校正弯曲代替自由弯曲<\/b>（最常用最有效），硬材料或加工硬化材料弯曲前退火；④ <b>补偿法<\/b>：按回弹趋势修正凸、凹模工作部分的形状与尺寸，使回弹得到补偿；⑤ <b>改变变形区应力状态<\/b>：凸模局部凸起使校正力集中作用于变形区、采用纵向加压弯曲，使内外层切向应力同号、回弹趋势相反而互相抵消。"}],"recite":"五个办法：弯曲区压加强筋；选弹性模量大、屈服极限低的材料；用校正弯曲代替自由弯曲（硬料先退火）；照回弹规律修凸凹模（补偿法）；改变变形区应力状态，让内外层回弹互相抵消（凸模局部凸起、纵向加压）。","chapter":"第 4 章 弯曲工艺与模具设计"},{"id":"t4-0","title":"1．拉深中按应力应变状态可把毛坯分成哪几个区域？为什么把与凸模圆角相接触的部分称为“危险断面”？","detail":[{"t":"p","x":"可分为四个区域：① <b>凸缘区（变形区）<\/b>——受切向压应力与径向拉应力，切向压缩、径向伸长、厚度增厚；② <b>凹模圆角区（过渡区）<\/b>——材料流过圆角，受弯曲与摩擦作用；③ <b>筒壁区（传力区）<\/b>——把凸模的力传给凸缘，受单向或两向拉应力，厚度略有减薄；④ <b>筒底区（不变形区）<\/b>——与凸模底部接触，几乎不参与变形，只承受双向拉应力。"},{"t":"p","x":"<b>危险断面<\/b>：筒壁与底部转角稍上部位厚度最小（比原始厚度减少近 10%），且越靠近底部变形程度越小、加工硬化程度越低、强度最低，而它又要承担把凸缘材料拉入凹模的全部拉力，所以筒壁拉应力一旦超过材料抗拉强度，就在这里破裂，故称“危险断面”。"}],"recite":"四区：凸缘变形区、凹模圆角过渡区、筒壁传力区、筒底不变形区。危险断面在筒壁与底部转角稍上，那里变薄最厉害（近 10%）、硬化最轻、强度最低，却要扛住把整个凸缘拉进来的力，所以先裂在这儿。","chapter":"第 5 章 拉深工艺与模具设计"},{"id":"t4-1","title":"2．什么是起皱现象？为什么会产生起皱？生产中防止起皱的有效措施是什么？","detail":[{"t":"p","x":"<b>起皱<\/b>：拉深时凸缘部分（特别是外边缘）在<b>切向压应力<\/b>作用下<b>失稳<\/b>，沿切向产生高低不平的皱折（拱起）的现象，类似压杆失稳。"},{"t":"p","x":"原因：① 凸缘部分<b>相对厚度 t/D 小<\/b>，板料抗纵向弯曲能力小；② <b>切向压应力大<\/b>（变形程度大、需转移的剩余材料多）；③ 凹模工作部分几何形状不利（平端面凹模比锥形凹模更易起皱）。"},{"t":"p","x":"危害：增厚后难以通过凸凹模间隙，易把毛坯拉断；加剧模具磨损；皱纹留在侧壁影响外观。"},{"t":"p","x":"有效措施：<b>采用压边圈<\/b>，使板料被强迫在压边圈与凹模平面间的间隙中流动，提高稳定性；压边力应在保证凸缘不起皱的前提下尽可能小。压边装置分弹性（弹簧、橡皮，用于中小件）与刚性（用于双动压力机拉大型件）；此外采用锥形凹模、增大相对厚度也有助于防皱。"}],"recite":"凸缘在切向压应力下被压得拱起来，就是起皱。原因三条：凸缘相对厚度 t/D 小、切向压应力大（变形程度大）、凹模形状不利。最有效的办法是加压边圈，把料压住不让它拱；压边力够用就行，太大会拉裂。","chapter":"第 5 章 拉深工艺与模具设计"},{"id":"t4-2","title":"3．凸缘变形区的应力分布有何特点？","detail":[{"t":"p","x":"① 处于<b>径向受拉、切向受压<\/b>的“一拉一压”应力状态，同时厚度方向受压（压边圈与凹模作用），故为三向应力状态、平均应力为压应力，有利于提高塑性、防止起皱。"},{"t":"p","x":"② 沿径向分布不均：<b>切向压应力的绝对值在凸缘外缘最大<\/b>，向凹模入口方向逐渐减小；<b>径向拉应力在凹模入口处最大<\/b>，向外缘逐渐减小至零。"},{"t":"p","x":"③ 绝对值最大的是切向压应力，故凸缘主要发生切向压缩、径向伸长、厚度增厚，且<b>越靠口部增厚越多<\/b>（可达 30%）。"},{"t":"p","x":"④ 随拉深行程进行，σ<sub>r<\/sub> 的最大值先增大后减小（在行程中途达到峰值），而切向压应力随凸缘缩小逐渐减小。"}],"recite":"一句话“一拉一压加厚向压”：径向受拉、切向受压，压边圈和凹模再给它一个厚向压力。分布上，切向压应力在外缘最大、往里变小；径向拉应力在凹模入口最大、往外缘降到零。所以外缘最容易起皱，凹模入口附近最容易传力拉裂。","chapter":"第 5 章 拉深工艺与模具设计"},{"id":"t4-3","title":"4．什么是拉深系数？其代表什么含义？","detail":[{"t":"p","x":"<b>拉深系数 m<\/b>：拉深后工件直径与拉深前毛坯（半成品）直径之比，m=d/D；多次拉深时 m<sub>1<\/sub>=d<sub>1<\/sub>/D、m<sub>2<\/sub>=d<sub>2<\/sub>/d<sub>1<\/sub>……总拉深系数 m=d/D=m<sub>1<\/sub>·m<sub>2<\/sub>…mn。它也等于拉深后工件周长与拉深前毛坯周长之比。"},{"t":"p","x":"含义：<b>m 反映拉深变形程度<\/b>，m 越小表示拉深前后直径变化越大、变形程度越大；m 是拉深工艺最重要的工艺参数，是工艺计算的基础。材料既能拉深成形又不被拉裂时的最小 m 值称<b>极限拉深系数<\/b>，是判断能否一次拉成的依据。"}],"recite":"拉深系数 m=d/D，拉深后直径比拉深前直径。它衡量变形程度：m 越小，缩得越狠，变形越大。m 是整个拉深工艺计算的基础，不拉裂的最小 m 叫极限拉深系数。","chapter":"第 5 章 拉深工艺与模具设计"},{"id":"t4-4","title":"5．影响极限拉深系数的因素有哪些？","detail":[{"t":"p","x":"四个方面："},{"t":"ul","items":["<b>材料性能<\/b>：塑性好、屈强比小、厚向异性系数 r 大、硬化指数 n 大 → 极限拉深系数小（易拉深）。"]},{"t":"ul","items":["<b>模具方面<\/b>：间隙小、凹模圆角半径小、凸模圆角半径过小都会增大拉深力使 m 增大；锥形凹模可减小包角与摩擦，使 m 减小。"]},{"t":"ul","items":["<b>拉深条件<\/b>：有压边圈时 m 可比无压边圈时小（但压边力过大会拉裂）；无中间退火时随拉深次数增加 m 应逐渐增大；润滑好则 m 可小些。"]},{"t":"ul","items":["<b>工件方面<\/b>：相对厚度 t/D 大（重要因素）→ 抗起皱能力高、压边力小、m 可减小；工件形状越简单，m 越小。"]}],"recite":"四方面：材料（塑性好、屈强比小、r 大、n 大 → 能拉得更狠）；模具（间隙别太小、圆角半径别太小、锥形凹模更好）；条件（有压边、润滑好、多道次时系数逐次放大）；工件（t/D 大、形状简单更有利）。","chapter":"第 5 章 拉深工艺与模具设计"},{"id":"t4-5","title":"6．如何确定拉深次数及每次的拉深系数？","detail":[{"t":"p","x":"两种方法：<b>推算法<\/b>与<b>查表法<\/b>（按相对高度 h/d 直接查表）。"},{"t":"p","x":"推算法步骤：① 计算毛坯相对厚度 t/D×100%，查表得各次极限拉深系数 m<sub>1<\/sub>、m<sub>2<\/sub>…；② 计算总拉深系数 m=d/D；③ 若 m≥m<sub>1<\/sub> 可一次拉成；否则依次计算 d<sub>1<\/sub>=m<sub>1<\/sub>D、d<sub>2<\/sub>=m<sub>2<\/sub>d<sub>1<\/sub>、d<sub>3<\/sub>=m<sub>3<\/sub>d<sub>2<\/sub>……<b>直到第一次出现 dn≤d，此时的 n 即拉深次数<\/b>；④ <b>调整系数<\/b>：试算得到的末次直径往往小于工件直径，需把各次系数适当放大（且不小于对应极限值、由首件到末件逐次增大），使 m<sub>1<\/sub>′·m<sub>2<\/sub>′…mn′=m，再重算各次工序直径，末次应回到工件直径；⑤ 由公式计算各次工序件高度。"}],"recite":"查表得各次极限系数，算 m总=d/D；从 m总 比 m<sub>1<\/sub> 判断能不能一次拉成。不能就逐次乘：d<sub>1<\/sub>=m<sub>1<\/sub>D、d<sub>2<\/sub>=m<sub>2<\/sub>d<sub>1<\/sub>……算到第一次 dn≤d，这个 n 就是次数——注意一到就停，别多算一级。然后把系数适当放大，使连乘等于 m总，重算各次直径，末次应正好回到工件直径。","chapter":"第 5 章 拉深工艺与模具设计"},{"id":"t4-6","title":"7．拉深时凸、凹模间隙过大或过小时各造成什么后果？","detail":[{"t":"p","x":"<b>间隙过小<\/b>：变形阻力增加，板料与模具表面接触压力加大、摩擦磨损增大，拉深力增大、零件变薄严重、模具寿命降低；但得到的零件侧壁平直光滑、质量较好、精度较高。"},{"t":"p","x":"<b>间隙过大<\/b>：对毛坯的校直与挤压作用变小，拉深力降低、模具寿命提高；但零件质量变差，侧壁不直、形成弯曲形状，尺寸精度不易保证。"},{"t":"p","x":"确定原则：既考虑板料本身的尺寸公差，又考虑拉深过程中的增厚现象，故间隙一般比毛坯厚度略大。无压边圈 Z/2=(1～1.1)t<sub>max<\/sub>；有压边圈 Z/2=t<sub>max<\/sub>+ct。精度要求高的零件可采用负间隙拉深，但拉深力要增大 20%，需加大拉深系数。"}],"recite":"间隙过大：拉深力小、模具省，但侧壁不直、精度差、形状走样；间隙过小：阻力大、件被拉薄、模具磨得快、容易裂，不过侧壁光直、精度高。所以间隙一般比料厚略大，兼顾质量和寿命。","chapter":"第 5 章 拉深工艺与模具设计"},{"id":"t4-7","title":"8．拉深时为什么要加润滑？如何正确润滑？","detail":[{"t":"p","x":"目的：减小板料与凹模、压边圈之间的摩擦，降低拉深阻力与拉深力，减少模具磨损，防止工件划伤与局部过度变薄，从而提高极限变形程度、改善零件质量、延长模具寿命。"},{"t":"p","x":"正确做法：在<b>凹模圆角、凹模平面、压边圈表面以及与之接触的毛坯表面<\/b>，每隔一定周期均匀涂抹一层润滑剂；而<b>凸模表面及与凸模接触的毛坯表面禁止涂润滑剂<\/b> —— 否则材料易相对凸模滑动，危险断面处材料得不到足够的摩擦阻滞，反而更容易拉裂。"}],"recite":"润滑是为了减小摩擦和拉深力、防划伤、把变形程度提上去。涂的位置有讲究：凹模圆角、凹模平面、压边圈和与之接触的毛坯面要涂；凸模表面和贴着凸模的那面不能涂，涂了料容易打滑，危险断面反而更容易裂。","chapter":"第 5 章 拉深工艺与模具设计"}],"sections":[{"title":"考前指南 · 考点地图","sub":"怎么用这份文档最省时间","color":"pa","blocks":[{"t":"p","x":"这份文档只有两个目的：把<b>一定会考的分<\/b>先拿到手，再用剩下的时间补齐<b>可能出成名词解释、简答题的知识点<\/b>。所以它不按教材顺序写，而按“得分优先级”排。"},{"t":"h2","x":"一、文档结构与使用顺序"},{"t":"table","head":["页面","内容","性质","建议用法"],"rows":[["必考选择 25","25 道原题（含解析）","已知必考，原题","先通做一遍，错的题只看解析里的“判断依据”一句"],["拉深大题","必考大题：拉深工艺计算","已知必考，考相似题","把五步流程背下来，再动手做 2 道变式"],["章节知识点","第 1—5 章知识点","选择、简答、名词解释的题库","按“加粗句 + 表格”扫读，不逐字看"],["思考题 39","课件思考题参考答案","名词解释 / 简答题高发区","先背每题的“背诵版”，详细版用来理解"]],"rel":null},{"t":"h2","x":"二、试卷结构预判"},{"t":"p","x":"依据你提供的材料（25 道单选 + 1 道必考计算大题 + 课件各章末尾思考题），本科目期末卷的结构基本可以锁定为下表。分值栏是按常见配置推断的，用来看“哪块最值钱”，不必当真。"},{"t":"table","head":["题型","分值占比（推断）","命题来源","对应章节"],"rows":[["单项选择题","约 30～40 分","已给 25 题原题","全五章"],["计算题（大题）","约 15～20 分","拉深工艺计算，考相似题","第 5 章 拉深"],["名词解释","约 10～15 分","课件黑体术语","全五章"],["简答题","约 20～25 分","课件章末思考题","全五章"],["综合分析 / 结构题","约 10～15 分","模具结构、工艺方案拟定","第 3、4 章"]],"rel":null},{"t":"h2","x":"三、五章考点权重与必背清单"},{"t":"p","x":"权重按课件页数与该章在选择题中出现的频次估的：冲裁（工艺 + 模具结构）合计占了一半以上，是绝对重点；拉深因为有必考大题，单章权重被抬高。"},{"t":"table","head":["章","课件页数","权重","必须能脱口而出的内容"],"rows":[["第 1 章 绪论","76","★","冲压定义、冲压三要素、两工序十四小类、冲压优缺点"],["第 2 章 基本理论","62","★★","塑性条件、增量/全量理论、加工硬化、七项机械性能指标、冲压性能三方面"],["第 3 章 冲裁工艺","173","★★★★★","变形三阶段、断面四区、间隙、排样搭边步距、冲裁力、压力中心、刃口尺寸"],["第 3 章 冲裁模结构","108","★★★★","模具五大组成、单工序/级进/复合、正倒装、凸模长度、凹模尺寸、闭合高度"],["第 4 章 弯曲","103","★★★","变形特点、回弹、最小弯曲半径、毛坯展开、弯曲力、弯曲模间隙"],["第 5 章 拉深","100","★★★★★","起皱与拉裂、拉深系数、毛坯直径、拉深次数、压边力与拉深力"]],"rel":null},{"t":"box","title":"一句话策略","body":["选择题（25 题原题）必须全对，这是白送的分；拉深大题按模板套，能拿 80% 以上；名词解释和简答靠“思考题 39”里的背诵版按点给分；剩下时间才去看结构图。"]},{"t":"h2","x":"四、三类题型的答题模板"},{"t":"h3","x":"名词解释（3～5 分，写 2～3 句）"},{"t":"p","x":"<b>格式：定义 + 关键判据 + 一句作用/意义。<\/b> 例：“冲裁间隙——指凹模刃口横向尺寸与凸模刃口横向尺寸之差，分单边间隙 C 与双边间隙 Z，常用相对值 C/t 表示。它是影响冲裁断面质量、尺寸精度和模具寿命的主要因素。”"},{"t":"h3","x":"简答题（5～8 分，分点写）"},{"t":"p","x":"<b>格式：先一句总述，再 ①②③ 分点，每点一个短句，最后一句结论。<\/b> 判卷按点给分，宁可点多写短，不要一段长文字。“思考题 39”里的答案已按此格式写好，可直接背。"},{"t":"h3","x":"计算题（15～20 分，写清步骤）"},{"t":"p","x":"<b>格式：已知条件（含单位换算）→ 公式 → 代入 → 结果 → 结论句。<\/b> 拉深题一定会给“所有尺寸用中线、保留两位小数”，这就是在提示你第一步先做中线换算——不做这一步，后面全错。"},{"t":"h2","x":"五、五天冲刺路线"},{"t":"table","head":["时间","任务","达标标准"],"rows":[["第 1 天","必考选择 25 题 + 章节知识点·冲裁工艺","25 题全对；能画出断面四区并说出各区成因"],["第 2 天","拉深大题 + 章节知识点·拉深","不看答案独立做完原题，误差 ≤1 mm"],["第 3 天","章节知识点·弯曲 + 冲裁模结构","能说出模具五大部分及各部分零件"],["第 4 天","思考题 39 题通背（用“自测”模式自检）","每章至少记住 5 个要点"],["第 5 天","错题回看 + 画一遍拉深计算流程图","合上书能默写 6 个核心公式"]],"rel":null}]},{"title":"第三部分 章节知识点 · 第 1 章 绪论","sub":"概念与工序分类","color":"ch1","blocks":[{"t":"h2","x":"1.1 三个基本概念"},{"t":"p","x":"<b>模具<\/b>：在工业生产中，将材料（金属与非金属）加工成为产品的一种特殊工艺装备，其本身的形状与尺寸限定产品的形状与尺寸，俗称“模子”。模具被称为“工业之母”“效益放大器”。"},{"t":"p","x":"<b>冲压模具（冲模、冷冲模）<\/b>：在冲压加工中，将材料加工成零件（或半成品）的特殊工艺装备。"},{"t":"p","x":"<b>冲床（冲压机床）<\/b>：对放置于模具中的材料实现压力加工的机械设备。"},{"t":"p","x":"<b>冲压<\/b>：利用冲模在冲床上对金属（或非金属）板料施加压力，使其<b>分离或变形<\/b>而获得零件的一种加工方法。它建立在金属塑性变形基础上，属于压力加工；因主要加工 0.5～3 mm 的板料，故称<b>板料冲压<\/b>；因通常在常温下进行，故称<b>冷冲压<\/b>。"},{"t":"box","title":"冲压生产三要素","body":["<b>合理的冲压工艺<\/b>（冲裁、弯曲、拉深）+ <b>先进的模具<\/b> + <b>高效的冲压设备<\/b>。三者缺一不可，这也是简答题常考的三点。"]},{"t":"h2","x":"1.2 冲压加工的优缺点"},{"t":"table","head":["优点","具体表现"],"rows":[["无屑加工","材料利用率高，不产生切屑"],["质量稳定","冲压件质量主要靠模具保证，互换性好"],["生产率高","一次行程可完成多道工序"],["成本低","大批量生产条件下加工成本低"],["成形容易","可生产形状复杂的零件，刚度好、重量轻"]],"rel":null},{"t":"table","head":["缺点","具体表现"],"rows":[["生产类型的限制","模具要求高、制造复杂、费用高，小批量生产不经济"],["精度的限制","冲压件精度取决于模具精度，精度要求过高时难以达到"]],"rel":null},{"t":"h2","x":"1.3 冲压工序的分类（选择题、名词解释高发区）"},{"t":"p","x":"按<b>变形性质<\/b>分两大类，共十四小类。这一张表必须能默写。"},{"t":"h3","x":"一、分离工序（6 种）——使板料沿一定轮廓线分离"},{"t":"p","x":"特点：沿一定边界的材料被破坏，使板料的两部分分开。"},{"t":"table","head":["工序","定义","目的"],"rows":[["冲孔","用模具沿封闭轮廓冲裁板料，<b>冲下部分为废料<\/b>","制取内孔"],["落料","用模具沿封闭轮廓冲裁板料，<b>冲下部分为工件<\/b>","制取所需外形"],["切断","用剪刀或模具切断板料或条料，使其分离","截取坯料"],["切口（切舌）","将部分材料切开但不完全分离，切开部分发生弯曲","局部成形"],["切边","将工件边缘的多余材料冲切下来","修整外形"],["剖切","将坯件（弯曲件或拉深件）剖成两部分或几部分","一坯两件"]],"rel":null},{"t":"box","title":"冲孔与落料的唯一区别","body":["看<b>冲下来的部分是工件还是废料<\/b>：冲下来是废料、孔留在条料上→<b>冲孔<\/b>；冲下来是工件、孔留在条料上→<b>落料<\/b>。两者的模具基准件也因此不同：冲孔以凸模为基准，落料以凹模为基准。"]},{"t":"h3","x":"二、成形工序（8 种）——使板料在不破坏的条件下产生塑性变形"},{"t":"table","head":["工序","定义"],"rows":[["弯曲（压弯）","用模具把平面毛坯弯成具有一定角度或形状；含压弯、卷边、扭弯"],["拉深","将平板毛坯拉成开口空心件，或使空心件进一步改变形状尺寸；分不变薄拉深与变薄拉深"],["胀形","从空心件内部施加径向压力，强迫局部材料减薄、表面积增大"],["起伏成形","使平板毛坯产生局部凸起或凹进"],["翻边","将工件上的孔边缘或外缘翻成竖立的直边"],["缩口","将预先拉深好的圆筒或管状坯料口部缩小"],["整形","将原先的弯曲件或拉深件压成正确的形状"],["校平","将有拱弯、翘曲的平板制件压平"]],"rel":null},{"t":"h2","x":"1.4 冲压技术的发展（了解即可）"},{"t":"p","x":"冲压技术的真正发展始于 20 世纪初（1913 年）美国福特汽车的工业化生产；20 世纪 60 年代成形极限图（FLD）的提出是里程碑；80—90 年代有限元与 CAD 技术使板成形从经验走向科学。发展方向：冲压成形理论与新工艺、模具新材料（粉末高速钢、高合金钢）与表面处理（CVD、PVD、盐浴渗金属）、先进制造工艺（慢走丝线切割、电火花、精密磨削）、模具 CAD/CAM 与快速经济制模（3D 打印）、提高板料冲压成形性能、先进生产管理模式。"},{"t":"h3","x":"本章速记（合上书自测）"},{"t":"ul","items":["<b>三个概念<\/b>：模具=限定产品形状尺寸的工艺装备；冲压=在冲床上用冲模加压使板料分离或变形；冲压三要素=合理工艺+先进模具+高效设备。","<b>两类工序<\/b>：分离 6 种（切断、落料、冲孔、切口、切边、剖切）；成形 8 种（弯曲、拉深、胀形、起伏成形、翻边、缩口、整形、校平）。","<b>一个区分<\/b>：落下的部分是零件→落料；是废料→冲孔。","<b>优点四条<\/b>：无屑、质量稳定、生产率高、成本低；<b>缺点两条<\/b>：批量受限（模具贵）、精度受模具限制。"]}]},{"title":"第 2 章 冲压成形的基本理论","sub":"塑性条件 · 硬化 · 冲压性能","color":"ch2","blocks":[{"t":"p","x":"本章不考计算，但<b>名词解释与简答题几乎必然从这里出<\/b>（塑性条件、增量/全量理论、加工硬化、冲压性能三方面、七项机械性能指标）。第 2 部分的 4、5、7、9 题也出自本章。"},{"t":"h2","x":"2.1 金属塑性变形的基本概念"},{"t":"p","x":"金属在外力作用下的变形分三阶段：<b>弹性变形 → 弹-塑性变形 → 断裂<\/b>。"},{"t":"table","head":["概念","定义","要点"],"rows":[["弹性变形","外力去除后，物体能完全恢复原始形状和尺寸的变形","可恢复"],["塑性变形","外力去除后，不能恢复原始形状和尺寸，所存在的残余变形","不可恢复，变形的实质是原子间距离变化"],["总变形","实际冲压成形的情形，弹性与塑性二者兼有","卸载后必有回弹"],["变形抗力","金属抵抗变形的力，常用屈服强度 σ<sub>s<\/sub> 表征","越小越易成形"],["塑性","材料在外力作用下发生永久变形而不破坏其完整性的能力","与材料性质、变形方式、变形条件有关"],["塑性指标","延伸率 δ 与断面收缩率 ψ","由拉伸试验获得，是开始破坏时的塑性变形量"]],"rel":null},{"t":"h2","x":"2.2 影响金属塑性变形的主要因素（六项）"},{"t":"table","head":["因素","规律","记忆点"],"rows":[["化学成分","钢中含碳量↑、合金元素↑ → 塑性成形性↓","磷“冷脆”、硫“热脆”、氮“时效脆性”、氢“氢脆/白点”，均有害；碳少量有利、过量有害（Fe3C）"],["组织状态","单相组织（铁素体、奥氏体）优于多相（珠光体）；均匀细小等轴晶优于粗大树枝晶","网状二次渗碳体使脆性增大"],["变形温度","温度↑ → 塑性↑、变形抗力↓、成形性↑","高温变形抗力仅为常温的 1/4～1/5"],["变形速度","速度↑ → 硬化↑、塑性↓；但超过临界点后“热效应”使塑性↑","一般生产采用较低变形速度"],["表面状态","表面缺陷易成“裂纹源”，表面质量好有利于提高塑性","含润滑条件与坯料表面质量"],["应力状态","<b>压应力数目越多，塑性越好、变形抗力越低；拉应力数目越多，塑性越差<\/b>","三向受压的大理石、三向受拉的铅"]],"rel":null},{"t":"box","title":"提高金属塑性的四条途径（简答常考）","body":["① 提高材料成分和组织的均匀性；② 合理选择成形温度和成形速度；③ <b>选择三向受压较强的变形方式<\/b>；④ 保证好的表面质量、减少变形的不均匀性。"]},{"t":"h2","x":"2.3 塑性条件（屈服准则）"},{"t":"p","x":"<b>塑性条件<\/b>又称屈服准则或屈服条件，是描述不同应力状态下变形体内质点<b>开始产生塑性变形并使塑性变形继续进行所必须遵循的条件<\/b>。单向应力状态时，应力达到屈服极限即进入塑性状态；复杂应力状态则需各应力分量之间满足一定关系。"},{"t":"h3","x":"一、屈雷斯卡（Tresca）塑性条件——最大剪应力理论"},{"t":"p","x":"任意应力状态下，只要<b>最大剪应力达到某临界值<\/b>（与应力状态无关），材料就开始屈服；由单向拉伸试验知该临界值等于 σ<sub>s<\/sub>/2。设 σ<sub>1<\/sub>＞σ<sub>2<\/sub>＞σ<sub>3<\/sub>，则："},{"t":"m","x":"σ<sub>1<\/sub> − σ<sub>3<\/sub> = σ<sub>s<\/sub>"},{"t":"p","x":"优点：形式简单，与试验结果基本相符，用于分析板料成形问题有足够精度。缺点：<b>忽略了中间主应力 σ<sub>2<\/sub> 的作用<\/b>，不够完善。"},{"t":"h3","x":"二、密塞斯（von Mises）塑性条件——等效应力理论"},{"t":"p","x":"任意应力状态下，当某点的<b>等效应力达到某一临界值<\/b>（等于 σ<sub>s<\/sub>）时，材料开始屈服："},{"t":"m","x":"σ<sub>e<\/sub> = (1/<span class=\"rt\"><span class=\"rt-sign\">√<\/span><span class=\"rt-body\">2<\/span><\/span>)·<span class=\"rt\"><span class=\"rt-sign\">√<\/span><span class=\"rt-body\">(σ<sub>1<\/sub>−σ<sub>2<\/sub>)² + (σ<sub>2<\/sub>−σ<sub>3<\/sub>)² + (σ<sub>3<\/sub>−σ<sub>1<\/sub>)²<\/span><\/span> = σ<sub>s<\/sub>"},{"t":"p","x":"也可写成与 Tresca 类似的形式 σ<sub>1<\/sub>−σ<sub>3<\/sub>=βσ<sub>s<\/sub>，其中 β=1～2.155："},{"t":"table","head":["应力状态","β 取值"],"rows":[["单向拉伸、单向压缩、双向等拉、双向等压","1"],["纯剪（无正应力）、平面应变","2.155"],["其它（应力分量未知）","2.1"]],"rel":null},{"t":"l","x":"Mises 准则比 Tresca 准则多考虑了中间主应力 σ<sub>2<\/sub>，因而更接近实验数据。"},{"t":"h2","x":"2.4 塑性变形时应力与应变的关系"},{"t":"p","x":"由拉伸曲线可见：① 材料屈服后应力应变不再是线性关系；② 变形过程不可逆；③ 同一应力下加载历史不同、应变也不同 —— 即<b>塑性变形时应变不仅与应力大小有关，还与加载历史密切相关，一般不存在一一对应关系<\/b>。表示这种关系的理论有两种。"},{"t":"table","head":["理论","研究区间","前提条件","结论"],"rows":[["增量理论","加载过程中某一微量时间间隔内的<b>应变增量<\/b>","不要求简单加载","应变增量与应力偏量成正比"],["全量理论","从加载开始到某时刻的<b>全应变（总应变）<\/b>","<b>简单加载<\/b>（各应力分量按同一比例增加）","塑性总应变与应力偏量成正比"]],"rel":null},{"t":"p","x":"全量理论的三个前提：小变形；泊松比等于 0.5 且材料不可压缩；载荷按比率增长。工程上只要<b>近似满足<\/b>简单加载条件即可使用全量理论，可大大简化分析。"},{"t":"box","title":"全量理论得出的四条结论（第 5 章思考题第 3 题的答案基础）","body":["① 应力分量与应变分量的性质<b>不一定一致<\/b>（拉应力不一定对应拉应变）；② 某方向应力为零，其应变不一定为零；③ 应力分量与应变分量的大小次序相对应（σ<sub>1<\/sub>＞σ<sub>2<\/sub>＞σ<sub>3<\/sub> 则 ε<sub>1<\/sub>＞ε<sub>2<\/sub>＞ε<sub>3<\/sub>）；④ 若两个应力分量相等，对应的应变分量也相等。"]},{"t":"p","x":"由此得到判别方法：在多向应力状态下，<b>把该方向应力与平均应力 σ<sub>m<\/sub>=(σ<sub>1<\/sub>+σ<sub>2<\/sub>+σ<sub>3<\/sub>)/3 比较<\/b>——大于平均应力一定产生拉应变，小于平均应力一定产生压应变，等于平均应力则无变形。"},{"t":"h3","x":"伸长类变形与压缩类变形的划分"},{"t":"p","x":"<b>伸长类变形<\/b>：变形区的拉应力绝对值最大，主要变形为沿该方向的伸长变形（如胀形、翻孔）。<b>压缩类变形<\/b>：变形区的压应力绝对值最大，主要变形为沿该方向的压缩变形（如拉深、缩口）。"},{"t":"h2","x":"2.5 加工硬化与硬化曲线"},{"t":"p","x":"<b>加工硬化<\/b>：材料在塑性变形过程中，随着变形程度增加，其<b>变形抗力与硬度提高而塑性下降<\/b>的现象。"},{"t":"table","head":["影响","具体表现"],"rows":[["不利","使所需变形力增加，限制材料进一步变形（多工序拉深必须中间退火）"],["有利","减小过大的局部变形，使变形趋于均匀，从而<b>增大成形极限<\/b>，同时提高材料强度"]],"rel":null},{"t":"p","x":"<b>硬化曲线<\/b>：材料变形抗力随变形程度变化的情况。低碳钢名义应力-应变曲线分四段：弹性阶段、屈服阶段、强化阶段、缩颈断裂阶段。名义曲线不能真实反映硬化，因为应力按原始截面积计算、应变只取变形前后两个状态；须改用<b>真实应力<\/b>（按瞬时截面积计算）与<b>真实应变<\/b>（按变形累积计算），所得曲线称为硬化曲线，其在失稳点后仍上升，说明材料在持续硬化。"},{"t":"p","x":"生产中用<b>近似硬化曲线——指数曲线<\/b>："},{"t":"m","x":"σ = C·ε^n"},{"t":"p","x":"式中 C 为塑性系数、n 为硬化指数，均取决于材料种类与性能，可由拉伸试验获得。"},{"t":"p","x":"C 与 n 取决于材料种类与性能，由拉伸试验获得。<b>n 反映材料能均匀塑性变形的能力<\/b>，可阻止零件某些薄弱部位继续塑性变形；n 大时变形均匀、不易产生局部集中变形与破坏，有利于增大伸长类变形的成形极限，但对后续工序不利（硬化显著）。"},{"t":"h2","x":"2.6 板料的冲压性能及其与机械性能的关系"},{"t":"p","x":"<b>冲压性能<\/b>：板料对各种冲压成形工艺的适应能力。板料在成形中可能出现两种失稳：<b>拉伸失稳<\/b>（拉应力下局部缩颈或断裂）与<b>压缩失稳<\/b>（压应力下起皱）。"},{"t":"p","x":"<b>成形极限<\/b>：板料失稳前可达到的最大变形程度。分<b>总体成形极限<\/b>（如极限拉深系数、极限胀形高度、极限翻孔系数，是规则形状零件工艺设计的重要依据）与<b>局部成形极限<\/b>（描述零件上各点的变形程度）。"},{"t":"h3","x":"一、冲压性能的三个方面"},{"t":"table","head":["方面","定义","影响因素"],"rows":[["抗破裂性","冲压过程中<b>产生开裂的难易程度<\/b>","材料塑性、成形条件"],["贴模性","冲压过程中<b>取得与模具形状一致性的能力<\/b>","起皱、塌陷会降低贴模性"],["定形性","零件脱模后<b>保持其在模具内既得形状的能力<\/b>","主要受<b>回弹<\/b>影响"]],"rel":null},{"t":"p","x":"贴模性与定形性决定零件的形状与尺寸精度；但抗破裂性差会导致零件严重破坏且难以修复，故生产中<b>主要用抗破裂性<\/b>作为评定板料冲压成形性能的指标。"},{"t":"h3","x":"二、七项机械性能指标（必背表）"},{"t":"table","head":["指标","要求","原因"],"rows":[["屈服极限 σ<sub>s<\/sub>","小好","易屈服、变形抗力小；压缩变形时不易起皱，弯曲回弹小"],["屈强比 σ<sub>s<\/sub>/σ<sub>b<\/sub>","小好","从屈服到拉裂有较大塑性变形区间，变形区易变形、传力区不易拉裂，对拉深极有利"],["均匀延伸率 δ<sub>u<\/sub>","大好","表示均匀稳定塑性变形能力，直接决定伸长类变形性能；是翻孔、扩孔性能的最主要参数"],["弹性模量 E","大好","弹性变形小、回弹小"],["硬化指数 n","对伸长类变形大好","变形均匀、不易局部集中变形，提高成形极限"],["厚向异性系数 r","大好","板平面方向比厚度方向易变形，不易变薄或增厚，减小起皱、不易开裂，利于拉深"],["板平面各向异性系数 Δ<sub>r<\/sub>","小好","Δ<sub>r<\/sub> 越大各向异性越严重，影响变形均匀性与零件质量（凸耳）"]],"rel":null},{"t":"h2","x":"2.7 冲压用材料"},{"t":"p","x":"对冲压用板料的基本要求有五方面："},{"t":"ul","items":["<b>机械性能<\/b>：屈服极限小、延伸率大、屈强比小、弹性模量大、硬化指数高、厚向异性系数大、各向异性系数小。"]},{"t":"ul","items":["<b>化学成分<\/b>：C、Si、Mn、P、S 含量增加使塑性降低、脆性增加；低碳沸腾钢塑性好但易时效，拉深时出现<b>滑移线<\/b>，可拉深前辊压或改用加铝、钒脱氧的镇静钢。"]},{"t":"ul","items":["<b>金相组织<\/b>：晶粒大小不均及过大最易引起裂纹，过大晶粒拉深后表面粗糙；带状组织、游离碳化物与非金属夹杂物都会降低成形性能。"]},{"t":"ul","items":["<b>表面质量<\/b>：光滑、无氧化皮、裂纹、划伤等缺陷。"]},{"t":"ul","items":["<b>厚度公差<\/b>：凸凹模间隙按料厚确定，尤其校正弯曲与整形工序，厚度公差直接影响零件精度与模具寿命。"]},{"t":"p","x":"常用冲压材料：黑色金属（普通碳素钢、优质碳素结构钢、合金钢、不锈钢钢板）、有色金属（铜及铜合金、铝及铝合金）、非金属（胶木板、橡胶板、塑料板、纸板）。"},{"t":"h3","x":"本章速记（合上书自测）"},{"t":"ul","items":["<b>塑性条件两个<\/b>：Tresca——最大剪应力达 σ<sub>s<\/sub>/2 屈服，σ<sub>1<\/sub>−σ<sub>3<\/sub>=σ<sub>s<\/sub>，忽略中间主应力；Mises——等效应力达 σ<sub>s<\/sub> 屈服，多考虑 σ<sub>2<\/sub>，更接近实验。","<b>两种理论<\/b>：增量理论（应变增量、不要求简单加载）；全量理论（总应变、必须简单加载）。","<b>七项指标<\/b>：σ<sub>s<\/sub> 小、屈强比小、δ<sub>u<\/sub> 大、E 大、n 大、r 大、Δ<sub>r<\/sub> 小。","<b>冲压性能三方面<\/b>：抗破裂性（主用指标）、贴模性、定形性（受回弹影响）。","<b>一句话<\/b>：压应力数目越多塑性越好；应变性质要看该方向应力与平均应力的大小关系。"]}]},{"title":"第 3 章 冲裁工艺与模具设计","sub":"变形机理 · 质量 · 工艺计算","color":"ch3","blocks":[{"t":"p","x":"本章是全书分值最高的一章（课件 173 页）。25 道选择题里有 8 道直接出自本章，思考题 8 道，还可能出刃口尺寸计算。核心是四件事：<b>断面四区、间隙、排样、刃口尺寸<\/b>。"},{"t":"h2","x":"3.1 冲裁的定义与分类"},{"t":"p","x":"<b>冲裁<\/b>：使板料沿封闭曲线相互分离的冲压工序。广义上它是冲孔、落料、切断、切口、切边、剖切等分离工序的总称；狭义上就是<b>冲孔与落料<\/b>。"},{"t":"p","x":"用途有两个：直接冲制成品零件；为弯曲、拉深、翻边、胀形等成形工序<b>制备毛坯<\/b>。"},{"t":"p","x":"按变形机理分三类：<b>普通冲裁、精密冲裁、微冲裁<\/b>。"},{"t":"box","title":"落料与冲孔（务必分清）","body":["<b>落料<\/b>——冲裁后封闭曲线以内的部分为零件，即落下的部分是零件，目的是获得所需外形轮廓。<b>冲孔<\/b>——冲裁后封闭曲线以外的部分为零件，即落下的部分是废料，目的是获得所需内孔形状。"]},{"t":"h2","x":"3.2 冲裁变形机理"},{"t":"h3","x":"一、冲裁时板料所受的力（四项）"},{"t":"table","head":["力","作用"],"rows":[["凸、凹模端面对板料的压力（垂直作用力）","产生<b>剪切<\/b>作用"],["因凸凹模之间存在间隙、上下刃口不在同一垂直线上而产生的<b>弯矩<\/b>","产生<b>弯曲<\/b>作用"],["凸、凹模对板料的侧压力","产生<b>横向挤压<\/b>作用"],["凸模端面与侧面、凹模端面与侧面的摩擦力","阻碍材料流动"]],"rel":null},{"t":"p","x":"结论：冲裁变形<b>不是纯剪切过程<\/b>，还伴随弯曲、拉伸和挤压等附加变形。"},{"t":"h3","x":"二、变形区与裂纹起源（选择题第 5 题的出处）"},{"t":"p","x":"以<b>上、下刃口连线为中心的纺锤形区域<\/b>是主要变形区，从模具刃口向板料中心逐步扩大。<b>裂纹的起点在刃口侧面距刃尖很近的板料处，裂纹先从凹模一侧开始，然后才在凸模刃口侧面产生。<\/b>"},{"t":"h3","x":"三、冲裁变形过程的三个阶段"},{"t":"table","head":["阶段","特征"],"rows":[["弹性变形","弹性压缩、弯曲、拉伸；出现初始（塌角）圆角；材料翘曲；变形<b>可恢复<\/b>"],["塑性变形","应力达屈服极限，产生塑性变形；更大的塌角；刃口出现微裂纹；变形区出现塑性剪切面；变形<b>不可恢复<\/b>"],["断裂分离","产生粗糙而有锥度的断裂带；毛刺形成"]],"rel":null},{"t":"h3","x":"四、冲裁断面的四个特征区（必背）"},{"t":"table","head":["特征区","成因","质量评价"],"rows":[["圆角带（塌角）","刃口附近的材料被牵连拉入，产生弯曲和伸长变形","塑性越好越大"],["光亮带","模具挤压、切入材料使其产生塑性变形而形成","<b>整个断面上质量最好的部分<\/b>，是测量与使用部位"],["断裂带","刃口处微裂纹在拉应力作用下不断扩展断裂形成","表面粗糙且带锥度"],["毛刺","断裂带周边形成的不规则撕裂毛边","越小越好"]],"rel":null},{"t":"p","x":"四区所占比例随材料机械性能、料厚、刃口锋利程度、模具结构及间隙而变化：塑性差的材料断裂倾向严重，断裂带增宽、光亮带与圆角带比例小、毛刺也小；塑性好的材料相反。<b>较高质量的断面是光亮带较宽（约占断面 1/3），其余都很小，且平面无穹弯。<\/b> 提高断面质量的关键是<b>延长塑性变形阶段、推迟裂纹产生<\/b>（增加光亮带高度），或采用整形工序。"},{"t":"box","title":"三个必背结论","body":["① <b>光亮带是测量和使用部位<\/b>：落料件的光亮带在大端，冲孔件的光亮带在小端。","② <b>落料件的大端（光面）尺寸等于凹模尺寸<\/b>；<b>冲孔件的小端（光面）尺寸等于凸模尺寸<\/b>。","③ 因此刃口尺寸计算：<b>冲孔以凸模为基准件<\/b>（先算 d<sub>p<\/sub>，间隙取在凹模方向）；<b>落料以凹模为基准件<\/b>（先算 D<sub>d<\/sub>，间隙取在凸模方向）。"]},{"t":"h2","x":"3.3 冲裁件质量及影响因素"},{"t":"p","x":"冲裁件质量指标有三项：<b>断面质量<\/b>（断面平直、光亮带占较大比例）、<b>尺寸精度<\/b>（实际尺寸与图纸基本尺寸之差）、<b>形状误差<\/b>（平面度、圆度；表现为扭曲、翘曲、变形）。"},{"t":"h3","x":"一、影响断面质量的因素（四项）"},{"t":"table","head":["因素","影响规律"],"rows":[["材料性能","塑性好则弹性变形小、裂纹出现迟，光亮带比例大、毛刺与穹弯大、断裂带窄；塑性差则相反"],["<b>间隙大小及分布均匀性<\/b>","<b>最主要因素<\/b>，决定上下裂纹是否重合"],["模具刃口锋利程度","刃口磨钝后接触面积增加、应力集中减轻、挤压作用增大，裂纹推迟 → 圆角大、光亮带宽，但毛刺增高"],["模具制造精度","影响间隙的均匀性"]],"rel":null},{"t":"p","x":"刃口磨钝的位置与毛刺位置的关系（易考细节）：<b>凹模刃口磨钝<\/b>→冲孔件孔口<b>下端<\/b>产生毛刺；<b>凸模刃口磨钝<\/b>→落料件<b>上端<\/b>产生毛刺；两者同时磨钝→冲裁件上下端都有毛刺。"},{"t":"h3","x":"二、间隙对冲裁质量与模具寿命的影响"},{"t":"p","x":"<b>冲裁间隙<\/b>：凹模刃口横向尺寸 DA 与凸模刃口横向尺寸 dT 之差，分单边间隙 C 与双边间隙 Z，通常用相对值 C/t×100% 表示。"},{"t":"table","head":["间隙状态","断面特征","尺寸偏差"],"rows":[["间隙合适","上下裂纹重合，断面斜度小、平直光滑、毛刺小、无裂纹分层","尺寸接近刃口尺寸"],["间隙过小","上下裂纹向外错开，出现<b>双光亮带<\/b>，两光亮带之间夹断裂带","冲孔件尺寸＜凸模、落料件尺寸＞凹模（径向压应力大，卸载后回弹）"],["间隙过大","上下裂纹向里错开、不重合，材料二次拉裂，出现<b>双锥度<\/b>，毛刺大","冲孔件尺寸＞凸模、落料件尺寸＜凹模（径向拉应力大，卸载后回缩）"]],"rel":null},{"t":"p","x":"间隙不均匀时，间隙不合理处出现较大毛刺、断面质量差，故设计制造与安装必须保证间隙分布均匀。<b>间隙越大，模具寿命越高；间隙越小，冲裁件质量越高。<\/b> 生产中按断面质量、尺寸精度、模具寿命三者综合考虑给出一个范围值；因磨损会使间隙变大，<b>新模具应取最小合理间隙 Z<sub>min<\/sub><\/b>。"},{"t":"h3","x":"三、间隙的确定方法"},{"t":"table","head":["方法","依据","说明"],"rows":[["理论确定法","保证上下裂纹重合连成一线","Z 与料厚 t、凸模相对压入深度 h/t、裂纹方向角 β 有关；h/t 越小，合理间隙越大"],["经验查表法","按使用要求、材料性质、料厚查表","断面与尺寸要求高取小间隙；精度要求不高取大间隙以降低冲裁力、提高寿命"],["经验公式法","Z=(7～10)%t，即 Z<sub>min<\/sub>=0.07t、Z<sub>max<\/sub>=0.10t","最省事的估算法"]],"rel":null},{"t":"h2","x":"3.4 冲裁工艺设计"},{"t":"h3","x":"一、冲裁件的工艺性"},{"t":"p","x":"<b>冲裁工艺性<\/b>：冲裁件对冲裁工艺的适应能力，即能否用最简便最经济的方法生产出合格件。影响因素是<b>形状、尺寸和精度要求<\/b>。"},{"t":"table","head":["结构要求","具体数值/做法"],"rows":[["形状","尽可能简单、对称，利于材料合理利用"],["圆角","外形与内孔<b>避免尖锐清角<\/b>，宜有适当圆角（尖角处应力集中、模具易崩刃）"],["悬臂与凹槽","避免窄长悬臂和凹槽，<b>凸出与凹入部分宽度 B≥1.5t<\/b>"],["孔边距、孔间距","<b>≥1.5t<\/b>"],["弯曲件/拉深件上冲孔","孔边与直壁之间保持一定距离"],["孔径","不宜太小，<b>应大于料厚 t<\/b>"],["精度","金属冲裁件经济精度 <b>IT11<\/b>；落料件最好低于 IT10、冲孔件最好低于 IT9；表面粗糙度最高 6.3 μm；非金属件 IT14～15"]],"rel":null},{"t":"p","x":"尺寸标注三条：① 需保证孔心距时直接标注孔中心线间距离；② 孔的位置尺寸基准选在<b>冲压过程中不参与变形的面<\/b>上；③ 定位基准尽可能与设计基准重合，避免基准不重合误差。"},{"t":"h3","x":"二、工序的组合与顺序"},{"t":"table","head":["组合方式","定义","对应模具"],"rows":[["单工序冲裁","一次行程只完成一道工序","单工序模"],["级进冲裁（连续冲裁）","一次行程中在<b>送料方向连续排列的多个工位<\/b>上同时完成多道工序","级进模"],["复合冲裁","只有<b>一个工位<\/b>，一次行程中同时完成两道以上工序","复合模"]],"rel":null},{"t":"p","x":"顺序安排：① <b>级进冲裁<\/b>——先冲孔（缺口或结构废料），最后落料或切断，把工件与条料分离；② <b>单工序多次冲裁<\/b>——先落料使坯料与条料分离，再冲孔或冲缺口；冲大小不同、相距较近的孔时，为减少孔的变形，应<b>先冲大孔后冲小孔<\/b>。"},{"t":"p","x":"工艺方案确定的基本步骤：分析产品冲裁工艺性 → 列出所需基本冲压工序 → 列出可能的若干方案 → 分析比较得出最佳方案。"},{"t":"h2","x":"3.5 冲裁工艺计算"},{"t":"h3","x":"一、排样"},{"t":"p","x":"<b>排样<\/b>：冲裁件在条料或板料上的布置方式。排样影响材料利用率、生产率、模具结构与寿命、冲裁质量、操作方便性与安全；目的是以最低材料消耗和最高生产率得到合格零件。衡量指标是<b>材料利用率<\/b>："},{"t":"m","x":"η = C/(A×B) ×100%"},{"t":"p","x":"式中 C 为一个步距内冲压件的实际面积，A 为送料步距，B 为条料宽度。废料分<b>结构废料<\/b>（由工件形状决定）与<b>工艺废料<\/b>（为保证质量必须损耗）；提高利用率主要从<b>减少工艺废料<\/b>着手。"},{"t":"table","head":["排样形式","含义","特点"],"rows":[["有废料排样","沿零件全部外形轮廓冲裁，周边都留剩料","质量好、模具寿命高，<b>生产中大多采用<\/b>"],["少废料排样","沿部分外形轮廓冲裁，局部有搭边","利用率较高，质量与模具寿命略低"],["无废料排样","外形吻合排列，无任何搭边","利用率最高、冲裁力小、模具简单，但质量差、寿命低"]],"rel":null},{"t":"p","x":"<b>搭边<\/b>：排样时件与件之间、件与条料侧边之间设置的工艺余料。作用有两点：① 补偿定位误差引起的条料偏移，保证冲裁件质量与精度；② 起送进定位作用，并使工艺废料具有一定刚度，利于条料顺利送进。搭边值↑则材料利用率↓；搭边过小则冲裁时易翘曲或被拉断、毛刺增大，还可能被拉入间隙损坏刃口。搭边值主要由<b>经验（查表）<\/b>确定。"},{"t":"p","x":"<b>步距<\/b>（进距）：条料每次送进的距离，A=零件送进方向尺寸+件间搭边。（这就是选择题第 11 题：50+5=55 mm。）"},{"t":"p","x":"<b>条料宽度<\/b>：原则是最小宽度要保证零件周围有足够搭边，最大宽度要能在导料板间顺利送进并留有间隙。有侧压装置时 B=(D+2a+Δ)<sub>−<\/sub>Δ（D 为零件垂直于送料方向的最大尺寸，a 为侧搭边，Δ 为条料宽度公差）；无侧压装置时需再加补偿值 C1；有侧刃时按侧刃数与侧刃切边宽度计算。"},{"t":"h3","x":"二、冲裁工艺力"},{"t":"p","x":"<b>冲裁力<\/b>是冲裁过程中凸模对材料的压力，通常指其最大值，是选用压力机、模具设计与强度校核的依据。冲裁力-行程曲线分三段：AB 弹性段急剧上升；BC 塑性段上升变缓，当<b>加工硬化的影响与受剪面积减小的影响相等<\/b>时达到最大值（C 点）；CD 断裂段急剧下降。"},{"t":"m","x":"F = K·L·t·τ ≈ L·t·σ<sub>b<\/sub>"},{"t":"p","x":"式中 K 为安全系数（一般取 1.3），L 为冲裁周边长度，t 为料厚，τ 为材料抗剪强度，σ<sub>b<\/sub> 为抗拉强度。"},{"t":"table","head":["力","经验公式","说明"],"rows":[["卸料力","Fx = Kx·F","把箍在凸模上的料卸下"],["推件力","FT = n·KT·F","把卡在凹模内的件顺冲裁方向推出；n=h/t（h 为凹模直刃壁高度）"],["顶件力","FD = KD·F","把卡在凹模内的件逆冲裁方向顶出"]],"rel":null},{"t":"p","x":"压力机公称压力必须≥各工艺力之和 Fz。<b>采用弹性卸料+下出件<\/b>时 Fz=F+Fx+FT；<b>采用刚性卸料+下出件<\/b>时 Fz=F+FT（刚性卸料的卸料力由卸料板承受，不计入）——这就是选择题第一组第 3 题。"},{"t":"h3","x":"三、降低冲裁力的三个措施"},{"t":"table","head":["措施","做法","要点"],"rows":[["阶梯冲裁","多凸模做成不同长度，工作端面呈阶梯布置","使各凸模最大冲裁力不同时出现；凸模高度差 H 应大于光亮带高度；各层对称布置使合力过模具中心；冲裁力只按最大那层计算"],["斜刃冲裁","凸模或凹模刃口做成斜刃，刃口逐步切入","斜刃对称布置以免单向侧压力；<b>落料模：凸模平刃、凹模斜刃<\/b>；<b>冲孔模：凹模平刃、凸模斜刃<\/b>；用于大型件与厚板"],["加热冲裁","板料加热使抗剪强度下降","一般只适用于厚板件"]],"rel":null},{"t":"h3","x":"四、压力中心的确定"},{"t":"p","x":"<b>冲模压力中心<\/b>：冲压合力的作用点（凸模对工件施加力的作用点）。必须使其与<b>冲床滑块的中心线重合<\/b>，否则产生偏心力矩，模具偏斜、间隙不匀、导向磨损。"},{"t":"p","x":"常用<b>解析法<\/b>（求平行力系合力作用点）：① 按比例画出冲裁轮廓；② 建立直角坐标系；③ 把轮廓分解为若干直线段与圆弧段，求出各段长度 l<sub>i<\/sub> 及其形心坐标 (x<sub>i<\/sub>, y<sub>i<\/sub>)；④ 因冲裁力与轮廓长度成正比，可用线段长度代替冲裁力，按力矩平衡原理计算："},{"t":"m","x":"x<sub>c<\/sub> = Σ(l<sub>i<\/sub>·x<sub>i<\/sub>)/Σl<sub>i<\/sub>"},{"t":"m","x":"y<sub>c<\/sub> = Σ(l<sub>i<\/sub>·y<sub>i<\/sub>)/Σl<sub>i<\/sub>"},{"t":"p","x":"特殊情况可大幅简化：有两个对称轴的图形，压力中心在几何中心；有一个对称轴的图形，压力中心在对称轴上；直线段的压力中心在线段中点。多凸模同时冲裁时公式仍适用，只是 l<sub>i<\/sub> 换成各凸模轮廓周长、(x<sub>i<\/sub>, y<sub>i<\/sub>) 换成各凸模压力中心坐标。"},{"t":"h2","x":"3.6 凸、凹模刃口尺寸的计算（本章最可能出的计算题）"},{"t":"h3","x":"一、三条计算原则"},{"t":"ul","items":["<b>保证冲出合格零件<\/b>：冲孔以凸模为基准件（先算 d<sub>p<\/sub>，间隙取在凹模方向）；落料以凹模为基准件（先算 D<sub>d<\/sub>，间隙取在凸模方向）。"]},{"t":"ul","items":["<b>保证模具使用寿命<\/b>：新模具取最小合理间隙 Z<sub>min<\/sub>，磨损到最大合理间隙；凹模磨损使落料尺寸增大，故落料凹模取接近零件<b>最小极限尺寸<\/b>；凸模磨损使冲孔尺寸减小，故冲孔凸模取接近孔<b>最大极限尺寸<\/b>。"]},{"t":"ul","items":["<b>合理确定制造精度<\/b>：模具制造精度比零件高 2～4 级，公差取工件公差的 1/3～1/4（常取 Δ/4）。"]},{"t":"h3","x":"二、分别加工法（适用于圆形或简单规则形状）"},{"t":"p","x":"<b>冲孔（以凸模为基准件，间隙取在凹模上）<\/b>："},{"t":"m","x":"d<sub>p<\/sub> = (d + xΔ)<sub>−δ<sub>p<\/sub><\/sub>"},{"t":"m","x":"d<sub>d<\/sub> = (d<sub>p<\/sub> + Z<sub>min<\/sub>)<sub>+δ<sub>d<\/sub><\/sub>"},{"t":"p","x":"<b>落料（以凹模为基准件，间隙取在凸模上）<\/b>："},{"t":"m","x":"D<sub>d<\/sub> = (D − xΔ)<sub>+δ<sub>d<\/sub><\/sub>"},{"t":"m","x":"D<sub>p<\/sub> = (D<sub>d<\/sub> − Z<sub>min<\/sub>)<sub>−δ<sub>p<\/sub><\/sub>"},{"t":"p","x":"式中 d、D 为工件孔、外形的基本尺寸，Δ 为工件公差，x 为磨损系数（工件精度 IT10 以上取 x=1；IT11～IT13 取 x=0.75；IT14 取 x=0.5），δ<sub>p<\/sub>、δ<sub>d<\/sub> 为凸、凹模制造公差（按单向入体原则标注：轴类标负公差、孔类标正公差）。"},{"t":"p","x":"采用分别加工法时必须满足 δ<sub>p<\/sub>+δ<sub>d<\/sub> ≤ Z<sub>max<\/sub> − Z<sub>min<\/sub>，否则无法保证间隙；常取 δ<sub>p<\/sub>=0.4(Z<sub>max<\/sub>−Z<sub>min<\/sub>)、δ<sub>d<\/sub>=0.6(Z<sub>max<\/sub>−Z<sub>min<\/sub>)。"},{"t":"h3","x":"三、配作加工法（适用于形状复杂的冲裁件）"},{"t":"p","x":"<b>配作（配合加工）<\/b>：先按设计尺寸制造<b>基准件<\/b>，再根据基准件的<b>实际尺寸<\/b>按要求的间隙配制另一件。优点是模具间隙由配制保证、模具公差不受间隙限制，制造容易。图纸上基准件标注尺寸与公差，配作件只注公称尺寸并注明“凸（凹）模刃口按凹（凸）模实际刃口尺寸配制，保证最小双面合理间隙值 Z<sub>min<\/sub>”。"},{"t":"p","x":"计算基准件前必须先判断各尺寸<b>磨损后变大、变小还是不变<\/b>，分 A、B、C 三类："},{"t":"table","head":["类别","冲孔（基准件=凸模）","落料（基准件=凹模）"],"rows":[["A 类","磨损后<b>变小<\/b>：Ap=(Amax − xΔ)<sub>−δ<\/sub>","磨损后<b>变大<\/b>：Ad=(Amax − xΔ)<sub>+δ<\/sub>"],["B 类","磨损后<b>变大<\/b>：Bp=(Bmin + xΔ)<sub>+δ<\/sub>","磨损后<b>变小<\/b>：Bd=(Bmin + xΔ)<sub>−δ<\/sub>"],["C 类","磨损后<b>不变<\/b>：Cp=C ± δ/2","磨损后<b>不变<\/b>：Cd=C ± δ/2"]],"rel":null},{"t":"l","x":"注意：同一类尺寸在冲孔与落料中的“变大/变小”方向正好相反，这是最容易记混的地方。取 δ=Δ/4，C 类取 ±Δ/8。课件例题：落料凹模 Aa=(52−0.5×0.74)<sub>+0.185<\/sub>=51.63<sub>+0.185<\/sub>；Bd=(28+0.5×0.48)<sub>−0.12<\/sub>=28.24<sub>−0.12<\/sub>；Cc=10.18±0.045。"},{"t":"p","x":"<b>孔心距<\/b>：一次冲制有孔心距要求的多个孔时，孔心距精度由凹模孔心距保证，磨损不影响孔心距，故凹模孔心距公称尺寸直接取工件孔心距的<b>平均值<\/b>，公差取工件孔距公差的 <b>1/4<\/b>，按对称偏差布置。"},{"t":"h3","x":"本章速记（合上书自测）"},{"t":"ul","items":["<b>断面四区<\/b>：圆角带→光亮带（质量最好、测量部位）→断裂带→毛刺；落料大端=凹模，冲孔小端=凸模。","<b>间隙三档<\/b>：过小出双光亮带；合适上下裂纹重合；过大出双锥度、毛刺大。Z=(7～10)%t，新模取 Z<sub>min<\/sub>。","<b>刃口三原则<\/b>：冲孔以凸模为基准、落料以凹模为基准；凹模取近最小极限尺寸、凸模取近最大极限尺寸；模具精度高 2～4 级。","<b>三个数<\/b>：搭边查表、步距=件长+搭边、条宽 B 按有／无侧压计算。","<b>降低冲裁力三法<\/b>：阶梯冲裁、斜刃冲裁、加热冲裁。"]}]},{"title":"第 3 章（续）冲裁模结构及设计","sub":"五大组成 · 三类模具 · 零部件","color":"ch4","blocks":[{"t":"p","x":"这一部分在课件里单列一套（108 页），考法以<b>结构识别、组成、零件功能、尺寸校核<\/b>为主，简答题高发（思考题 9 道）。"},{"t":"h2","x":"4.1 冲裁模的分类"},{"t":"table","head":["分类依据","类型"],"rows":[["按工序性质","冲裁模、弯曲模、拉深模"],["按工序组合方式","单工序模、连续模（级进模）、复合模"],["按导向方式","开式模（无导向）、导板模、导柱模"],["按卸料装置","刚性卸料模、弹性卸料模"],["按挡料定位形式","固定挡料销、活动挡料销、导正销、侧刃冲裁模"]],"rel":null},{"t":"h2","x":"4.2 三类典型结构（必考）"},{"t":"h3","x":"一、单工序模（简单模）"},{"t":"p","x":"在压力机一次冲压行程中<b>只能完成单一冲压工序<\/b>的模具，如落料模、冲孔模、弯曲模、拉深模。结构最简单，但效率低、精度依赖两次装夹。"},{"t":"h3","x":"二、级进模（连续模、跳步模）"},{"t":"p","x":"在压力机一次行程中，按一定顺序<b>在同一模具的不同工位上<\/b>完成两道以上工序的模具，所完成的工序均分布在条料的送进方向上，属多工序模。"},{"t":"table","head":["优点","缺点"],"rows":[["生产效率高，适用于大批量生产","结构复杂、制造困难、成本高"],["减少模具与设备数量，便于实现自动化","各工序在不同工位完成，<b>定位累积误差影响工件精度<\/b>"]],"rel":null},{"t":"h3","x":"三、复合模"},{"t":"p","x":"在压力机一次行程中，在模具的<b>一个工位<\/b>上<b>同时<\/b>完成多道不同冲压工序的模具。工作部分除凸模、凹模外，还有<b>凸凹模<\/b>。按凸凹模安装位置分正装式与倒装式。"},{"t":"table","head":["形式","凸凹模位置","结构特点","缺点"],"rows":[["倒装式","凸凹模装在<b>下模<\/b>","冲孔废料由凸凹模孔向下排出，结构简单、操作方便","凸凹模孔内积存废料可能把孔涨裂，受<b>最小壁厚<\/b>限制，不宜冲内外尺寸差过小的零件"],["正装式","凸凹模装在<b>上模<\/b>","凸凹模孔内不积废料，不会涨裂","冲孔废料落在模具工作面上不易清除，影响操作与安全"]],"rel":null},{"t":"p","x":"<b>凸凹模最小壁厚<\/b>：不积聚废料时，冲裁硬材料 c≥1.5t，冲裁软材料 c≥t；积聚废料时因胀力大，数值还要加大。<b>不满足最小壁厚要求时，不能采用复合模。<\/b>"},{"t":"h2","x":"4.3 冲裁模的组成（五个部分）"},{"t":"table","head":["部分","功能","典型零件"],"rows":[["1 工作部分","完成材料的分离或成形，零件质量与精度主要靠它保证","凸模、凹模、凸凹模"],["2 定位及挡料部分","确定条料、毛坯及半成品在模具中的正确位置","导料板、导料销、挡料销、导正销、侧刃、定位板、定位销"],["3 卸料及推件装置","把箍在凸模外的料卸下，把卡在凹模内的件推出，保证冲压连续进行","卸料板、打杆、推块、推杆、推件器、顶件块、弹簧、橡胶"],["4 导向装置","保证上下模正常运行、不产生位置偏移","导柱、导套（导板、滚珠导柱导套）"],["5 连接固定部分","连接紧固各零件，使之成为完整整体","模柄、上/下模座、凸模固定板、垫板、凸凹模固定板、螺钉、销钉"]],"rel":null},{"t":"p","x":"按功用又分两类：<b>工艺结构零件<\/b>（直接参与工艺过程、与坯料直接作用——工作部分、定位挡料、卸料推件）；<b>辅助结构零件<\/b>（保证工艺过程可靠——导向、连接固定）。按安装位置分上模部分与下模部分。"},{"t":"box","title":"对冲裁模的要求（思考题第 2 题）","body":["① 能冲出合格零件（刃口尺寸、间隙合理）；② 足够的强度与刚度，工作时不变形；③ 可靠的导向精度与间隙均匀性；④ 卸料、推件顺畅，操作安全方便；⑤ 结构工艺性好，尽量采用标准件与标准模架，降低制造成本；⑥ 足够的耐磨性与使用寿命。"]},{"t":"h2","x":"4.4 冲裁模设计的一般步骤（七步，必背顺序）"},{"t":"p","x":"① 冲裁件工艺性分析 → ② 确定冲裁工艺方案 → ③ 必要的工艺计算（排样与利用率、冲压力与压力中心、间隙、刃口尺寸）→ ④ 选择模具结构类型 → ⑤ 确定主要零部件的结构与尺寸 → ⑥ 冲裁设备的选用与校核 → ⑦ 绘制模具总装图及零件图。"},{"t":"p","x":"模具类型的选择依据：<b>冲裁精度要求、生产批量、模具加工能力<\/b>。批量越大越倾向级进模与复合模；单件小批用简易模或单工序模。"},{"t":"h2","x":"4.5 主要零部件的结构与设计"},{"t":"h3","x":"一、凸模"},{"t":"table","head":["项目","要点"],"rows":[["结构形式","按结构分整体式、镶拼式；按形状分圆形、非圆形"],["固定方法","台阶式、挂销式、螺钉及销钉、铆接式、浇注粘接式"],["长度计算","<b>L=固定板厚度+卸料板厚度+导料板厚度+附加长度<\/b>；附加长度含凸模进入凹模深度、闭合时卸料板与固定板的安全距离（15～20 mm）、总修磨量"],["设计原则","满足使用要求前提下越短越好（提高刚度与稳定性）"]],"rel":null},{"t":"h3","x":"二、凹模"},{"t":"table","head":["结构形式","优点","缺点","适用"],"rows":[["整体式","结构简单、强度好、制造精度高","非工作部分也用模具钢，成本高","<b>中小型及精度要求高的制件（最常用）<\/b>"],["组合式","仅工作部分用模具钢，成本低、维修方便","结构稍复杂、精度略低","大中型及精度要求不很高的制件"],["镶拼式","加工方便、降低复杂模具加工难度、易损件易换","精度低、装配要求高","窄壁、形状复杂、大型制件"]],"rel":null},{"t":"p","x":"凹模外形尺寸的经验计算：凹模高度 <b>H=k·b<\/b>（b 为最大孔口尺寸，k 为厚度系数，按 b 与料厚查表，约 0.10～0.60）；凹模壁厚 <b>c=(1.5～2)H<\/b>；凹模周界 <b>A=a+2c、B=b+2c<\/b>（取整，并按“就近就高”套用国标）。凹模刃壁高度：t≤3 mm 时 h<sub>0<\/sub>=3 mm；t＞3 mm 时 h<sub>0<\/sub>=t。"},{"t":"h3","x":"三、定位零件"},{"t":"p","x":"条料定位有两个内容：<b>送进导向<\/b>（垂直于送料方向定位，如导料板）与<b>送料定距<\/b>（控制步距，如挡料销、侧刃、导正销）。（选择题第一组第 6 题就考这一点。）"},{"t":"h3","x":"四、卸料与推（顶）件装置"},{"t":"table","head":["装置","特点","适用"],"rows":[["固定卸料板（刚性）","卸料力大、结构简单，但零件有时会变形","厚料（＞0.5 mm）"],["弹性卸料板","卸料力小、结构复杂，但有压料作用，可防翘曲、工件平整，还能冲废料","常用于复合模"],["刚性推件","一般装于上模，推件力来自压力机滑块，推件力大且可靠","下出件"],["弹性推件","一般装于下模，除推出工件外还对工件有压平作用","正装式复合模"]],"rel":null},{"t":"p","x":"卸料板外形长宽一般与凹模一致，内侧形状与凸模外形一致并留有间隙：固定卸料板取 0.2～0.5 mm（兼作导板时按 H7/h6）；弹性卸料板取 0.1～0.2 mm。模具开启状态下卸料板应高出工作零件刃口 0.3～0.5 mm。"},{"t":"h3","x":"五、导向零件"},{"t":"p","x":"导柱与导套为<b>间隙配合<\/b>（H7/h6 或 H6/h5），导柱下部与下模座导柱孔、导套外径与上模座导套孔采用<b>过盈配合<\/b>。材料常用 20 钢渗碳淬火，渗碳深度 0.8～1.2 mm，硬度 HRC58～62。生产批量大、模具寿命长、工件精度高时采用导柱导套导向。"},{"t":"h3","x":"六、固定与联接零件"},{"t":"table","head":["零件","作用与要点"],"rows":[["模座","模具的基础，要有足够强度刚度；材料 HT200、HT250、ZG310-570、ZG270-500；尺寸按凹模周界选择，<b>厚度约为凹模厚度的 1.5 倍<\/b>；圆形模座周界比凹模外径大 30～70 mm，矩形模座长边比凹模大 40～70 mm，外轮廓比冲床漏料孔至少大 40～50 mm"],["模柄","上模通过模柄联到冲床滑块上，用于 1000 kN 以下冲床；分旋入式（装卸方便、垂直度低、小模具）、压入式（垂直度好、中小型模具）、凸缘式（较大模具）、浮动式（有球面浮动环节，适用精密冲裁模）"],["凸、凹模固定板","安装固定小型凸、凹模；厚度为凹模厚度的 <b>60%～80%<\/b>；安装孔与凸模采用过渡配合 H7/m6 或 H7/n6，压装后端面一起磨平；材料 45 钢"],["垫板","承受凸、凹模压力，防止压陷模座；外形与固定板相同，厚 3～8 mm，45 钢或 T8A，硬度 HRC52～56；支承端面压力超过模座许用值时才加"],["螺钉与销钉","标准件；螺钉直径由凹模厚度决定"]],"rel":null},{"t":"h2","x":"4.6 冲裁设备的选用与闭合高度校核"},{"t":"p","x":"<b>模具闭合高度<\/b>：模具在最低工作位置时，上模板上平面与下模板下平面之间的距离。<b>压力机装模高度<\/b>：滑块在下止点时，滑块下表面至工作台垫板上表面之间的距离。为使模具正常工作，必须满足："},{"t":"m","x":"H<sub>min<\/sub> + 10 ≤ H<sub>m<\/sub> ≤ H<sub>max<\/sub> − 5"},{"t":"p","x":"其中 H<sub>min<\/sub>、H<sub>max<\/sub> 为压力机最小、最大装模高度。H<sub>m<\/sub> 应尽可能取大值，最好接近 H<sub>max<\/sub>−5，以免连杆调节过长损坏连接螺纹。当 H<sub>m<\/sub>＜H<sub>min<\/sub> 时模具无法安装，若相差不大可另加厚垫板满足要求。"},{"t":"p","x":"此外还需校核：压力机公称压力≥工艺力总和；滑块行程满足取件与放料要求；工作台面尺寸与漏料孔尺寸能容纳模具。"},{"t":"h3","x":"本章速记（合上书自测）"},{"t":"ul","items":["<b>五大部分<\/b>：工作部分、定位挡料、卸料推件、导向、连接固定；前三个=工艺结构零件。","<b>三类模具<\/b>：单工序（一次一工序）、级进（不同工位、有累积误差）、复合（同工位同时、精度高、受最小壁厚限制）。","<b>正倒装<\/b>：倒装式凸凹模在下模、废料下排但孔内积料；正装式在上模、不积料但清废难。","<b>两个公式<\/b>：凸模长度 L=固定板+卸料板+导料板+附加长度；凹模厚度 H=k·b，壁厚 c=(1.5～2)H。","<b>闭合高度<\/b>：H<sub>min<\/sub>+10 ≤ H<sub>m<\/sub> ≤ H<sub>max<\/sub>−5。"]}]},{"title":"第 4 章 弯曲工艺与模具设计","sub":"变形特点 · 回弹 · 展开计算","color":"ch5","blocks":[{"t":"p","x":"弯曲章的核心只有三件事：<b>变形特点（中性层）<\/b>、<b>回弹<\/b>、<b>毛坯展开长度<\/b>。25 道选择题里考了“弯曲偏移”（第 4 题）与“减小回弹”（第二组第 2 题），思考题 7 道。"},{"t":"h2","x":"5.1 弯曲的定义与分类"},{"t":"p","x":"<b>弯曲<\/b>：将板料、棒料、管料和型材等弯成具有一定形状及角度零件的成形方法。毛坯种类有板料、棒料、管材、型材；按工具与模具不同分压弯、卷边、扭弯等，本章讲板料在压力机上用模具弯曲——<b>压弯<\/b>。"},{"t":"p","x":"按变形终了时凸模、毛坯、凹模是否吻合后再加冲击，分<b>自由弯曲<\/b>（三者吻合后不再发生冲击作用）与<b>校正弯曲<\/b>（吻合后还有一次冲击，对弯曲件起校正作用）。"},{"t":"h2","x":"5.2 弯曲变形的五个特点（网格线实验）"},{"t":"table","head":["序号","特点","说明"],"rows":[["1","变形区主要在<b>圆角部分<\/b>","工件分直边与圆角两部分，圆角区网格变成扇形；远离圆角的直边网格不变，靠近圆角的直边有少许变化"],["2","圆角变形区内<b>变形不均匀<\/b>","外层（靠凹模）纵向纤维受拉伸长，内层（靠凸模）受压缩短，由表及里程度渐小；其间必有一层长度不变——<b>应变中性层<\/b>，曲率半径 ρ"],["3","圆角变形区内<b>应力不均匀<\/b>","外层切向拉应力、内层切向压应力，其间必有一层切向应力为零——<b>应力中性层<\/b>；弹性弯曲或变形程度小时两中性层重合于板料中央（ρ=r+t/2），变形程度大时都向内移动且 ρ应力＜ρ应变"],["4","相对弯曲半径 r/t 小时<b>板料变薄<\/b>","r/t 越小，变薄程度越大"],["5","相对宽度 b/t 影响断面形状","<b>宽板<\/b>（b/t＞3）横向应变受邻料限制，断面几乎不变仍为矩形；<b>窄板<\/b>（b/t＜3）断面由矩形变扇形且内宽外窄"]],"rel":null},{"t":"p","x":"<b>弯曲变形程度<\/b>用切向应变表示，沿板厚按线性规律变化；变形不大、材料不变薄且中性层在板中央时，内外表面切向应变数值相等且最大："},{"t":"m","x":"ε_max = 1/(2·r/t + 1)"},{"t":"p","x":"即表面应变量与相对弯曲半径大致成<b>反比<\/b>，故工程上用 <b>r/t（相对弯曲半径）<\/b> 表示弯曲变形程度，r/t 越小变形程度越大。r/t 的倒数称<b>弯曲系数<\/b>。外表面最大拉应变受材料不产生拉裂的限制，因此 r/t 有极值——<b>最小相对弯曲半径<\/b>。"},{"t":"h2","x":"5.3 弯曲件质量分析与控制（五类缺陷）"},{"t":"h3","x":"一、弯裂"},{"t":"p","x":"<b>弯裂<\/b>：弯曲变形区<b>外层材料产生裂纹<\/b>的现象。主要原因是<b>弯曲变形程度超出材料的成形极限<\/b>。控制措施四条："},{"t":"ul","items":["选择塑性好的材料，对冷作硬化的材料弯曲前<b>退火<\/b>。"]},{"t":"ul","items":["采用 r/t 大于最小相对弯曲半径的弯曲（即弯曲半径不能小于 r<sub>min<\/sub>）。"]},{"t":"ul","items":["排样时使<b>弯曲线与板料纤维组织方向垂直<\/b>（此时塑性最好、弯曲系数最小）。"]},{"t":"ul","items":["将<b>有毛刺的一面朝向弯曲凸模<\/b>，或弯曲前去除毛刺，避免毛坯外侧有划伤、裂纹等缺陷。"]},{"t":"h3","x":"二、偏移"},{"t":"p","x":"<b>偏移<\/b>：弯曲过程中板料毛坯在模具中发生<b>移动<\/b>的现象，结果是两直边长度不符合图纸要求。原因三条：① 坯料定位不稳定、压料效果不理想；② 坯料形状左右不对称；③ 模具结构左右不对称。"},{"t":"p","x":"控制措施两条：① 选择可靠的定位和压料方式，采用合适的模具结构（含反侧压块、定料销）；② <b>对小型不对称弯曲件采用成对弯曲再剖切<\/b>。（选择题第一组第 4 题即考此点。）"},{"t":"h3","x":"三、板料横截面的畸变与翘曲"},{"t":"p","x":"变形区截面形状与尺寸发生变化称<b>畸变<\/b>（窄板弯曲后由矩形变扇形）。"},{"t":"h3","x":"四、变形区变薄与弯曲后长度增加"},{"t":"p","x":"使弯曲件毛坯尺寸难以精确确定；弯曲与落料复合时，<b>应先设计弯曲模，再设计落料模<\/b>。"},{"t":"h3","x":"五、回弹（本章最高频考点）"},{"t":"p","x":"<b>回弹<\/b>：外力去除后，板料中的塑性变形保留、弹性变形完全恢复，使弯曲件从模具取出后其<b>弯曲角与弯曲半径与模具不一致<\/b>的现象。危害是降低弯曲件精度；弯曲件的回弹值比其他塑性加工方法大，是不易解决的特殊问题。"},{"t":"p","x":"<b>根本原因<\/b>：弯曲变形后变形区断面上的切向应力分布不均，卸载时内部产生<b>弹性恢复应力<\/b>；只要有残存的弹性变形，回弹便不可避免。"},{"t":"p","x":"回弹用弯曲角的回弹量 Δα 与曲率回弹量 Δρ 表示；卸载后弯曲角增大称<b>正回弹<\/b>，减小称<b>负回弹<\/b>。"},{"t":"table","head":["影响因素","规律"],"rows":[["材料力学性能","回弹量与<b>屈服极限成正比、与弹性模量成反比<\/b>（E 大则抵抗弹性变形能力强；σ<sub>s<\/sub> 大则弹性成分大）"],["相对弯曲半径 r/t","r/t 越大，变形程度越小，总变形中弹性变形比例增大，<b>回弹值越大<\/b>（半径很大的件不易成形的原因）"],["弯曲方式","<b>自由弯曲比校正弯曲回弹大得多<\/b>；校正弯曲力越大回弹越小，甚至出现负回弹"],["弯曲角","弯曲角越大，变形区长度越大，回弹累积值越大"],["工件形状","U 形件因两侧边受限制，回弹小于 V 形件；形状复杂件一次弯成时各部分互相牵制，回弹困难"]],"rel":null},{"t":"box","title":"减小回弹的五条措施（简答必背）","body":["① <b>改进弯曲件局部结构<\/b>：在弯曲区压制加强筋，增加刚度与塑性变形程度；② <b>选用合适材料<\/b>：弹性模量大、屈服极限低的材料；③ <b>工艺上采取措施<\/b>：用校正弯曲代替自由弯曲（最常用、最有效），硬材料或有加工硬化的材料弯曲前退火；④ <b>补偿法<\/b>：按回弹趋势修正凸、凹模工作部分形状与尺寸（最简单最有效）；⑤ <b>改变变形区应力状态<\/b>：凸模局部凸起使力集中作用于变形区、纵向加压弯曲，使内外层切向应力同号、回弹趋势相反而互相抵消。"]},{"t":"h2","x":"5.4 弯曲件的工艺性"},{"t":"table","head":["要求","具体内容"],"rows":[["圆角对称","对称零件的圆角半径也应对称，保证弯曲时毛坯受力平衡、无横向滑动"],["直边高度","直边高度不能太小（弯曲角为 90° 时直边高度 h≥2t），否则难以保证形状；可先压槽后弯曲，或加高直边弯曲后再切掉"],["局部弯曲","局部弯曲某一段边缘时，弯曲线与尖角部位之间应留出距离 a，或开<b>工艺槽、工艺孔<\/b>，防止尖角处应力集中而撕裂"],["缺口","弯曲边缘有缺口时应在缺口处留<b>连接带<\/b>，防止缺口处变形分叉，连接带弯曲后切去"],["精度","弯曲件尺寸经济公差等级最好在 <b>IT13<\/b> 以下，增加整形工序可达 IT11；精度要求高的件必须严格控制料厚公差"],["标注","局部结构（如孔）的位置尺寸标注应考虑冲压顺序：标在外形上则工序可随意安排；标在弯曲后的位置则必须“落料—弯曲—冲孔”"],["材料","良好塑性、较小屈强比、较大弹性模量"]],"rel":null},{"t":"h2","x":"5.5 弯曲工艺计算"},{"t":"h3","x":"一、毛坯展开长度"},{"t":"p","x":"依据：<b>应变中性层的长度弯曲前后不变<\/b>，故按中性层展开求毛坯长度。中性层位置（圆角部分）："},{"t":"m","x":"ρ = r + x·t"},{"t":"p","x":"式中 r 为内弯曲半径，t 为料厚，x 为中性层系数（与 r/t 有关，r/t＞5 时 x≈0.5，中性层接近板厚中央；r/t 越小 x 越小，中性层向内移）。展开长度："},{"t":"m","x":"L = Σ l + Σ (πα/180)(r + xt)"},{"t":"p","x":"α 为弯曲角（度）。计算步骤：① 分割出变形区（圆角部分）；② 确定各直边长度；③ 由 r/t 查 x；④ 计算各圆角中性层展开长度；⑤ 相加得毛坯总长度。"},{"t":"p","x":"对 r＜0.5t 的<b>无圆角半径弯曲<\/b>，相邻直边也有变薄，需按体积相等原则用修正公式计算；形状复杂、多角、精度高的件还要试弯修正。<b>铰链式弯曲件<\/b>用推圆方法卷圆，卷圆过程中板料增厚、中性层外移。"},{"t":"h3","x":"二、最小弯曲半径"},{"t":"p","x":"<b>最小弯曲半径 r<sub>min<\/sub><\/b>：弯曲变形区外层不产生拉裂破坏时所允许的最小圆角半径，对应<b>最小相对弯曲半径 r<sub>min<\/sub>/t<\/b>（弯曲系数的倒数）。影响因素五条："},{"t":"table","head":["因素","规律"],"rows":[["材料机械性能","塑性越好，可用的弯曲半径越小；可用退火、正火提高塑性以减小 r<sub>min<\/sub>"],["板料纤维方向","弯曲线<b>垂直于纤维方向<\/b>时塑性最好、弯曲系数最小；弯曲半径小时应使折弯线垂直于纤维方向"],["弯曲角","弯曲角越小，靠近圆角的直边参与变形、对变形区外层的受拉状态起缓解作用越显著，r<sub>min<\/sub> 可更小"],["表面与侧边质量","有划伤、裂纹、毛刺时易开裂，需取较大 r<sub>min<\/sub>；应清除毛刺、毛刺面朝凸模、弯曲前退火"],["板料厚度","薄料切向应变梯度大，邻近纤维能补充表层变形，故<b>薄料比厚料可用更小的 r<sub>min<\/sub><\/b>"]],"rel":null},{"t":"p","x":"实际生产中多用<b>经验法（查表）<\/b>确定 r<sub>min<\/sub>；当弯曲半径小于 r<sub>min<\/sub> 时，应<b>分两次或多次弯曲<\/b>分散变形量，塑性差或有硬化的材料应退火或加热弯曲。"},{"t":"h3","x":"三、弯曲力"},{"t":"table","head":["类型","公式","说明"],"rows":[["自由弯曲","F = 0.6·K·b·t²·σ<sub>b<\/sub>/(r+t)（V 形）；U 形系数取 0.7","K 为安全系数取 1.3，b 为宽度，r 为内弯曲半径"],["校正弯曲","F = q·A","q 为单位校正力（查表），A 为被校正部分的投影面积"],["顶件力/压料力","取自由弯曲力的 <b>30%～80%<\/b>","设有顶件或压料装置时"]],"rel":null},{"t":"p","x":"弯曲力随行程变化：弹性阶段较小，自由弯曲阶段基本不随行程变化，<b>校正弯曲阶段随行程急剧增加<\/b>。"},{"t":"h2","x":"5.6 弯曲模的类型与设计"},{"t":"table","head":["类型","特点"],"rows":[["V 形件弯曲模","结构简单但易偏移；带顶杆/ V 形顶板/定料销的结构可防偏移，带定料销可得边长偏差 ±0.1 mm 的工件"],["U 形件弯曲模","结构简单，壁部易回弹；分普通、校正、深挤（L≥r<sub>1<\/sub>+3t、h≥3r<sub>1<\/sub>）三种"],["L 形件弯曲模","易偏移和回弹；校正式使压弯时工件倾斜一定角度（厚料 10°、薄料 5°），下压校正力作用于原先竖边，减少回弹"],["四角形、圆形、铰链形","结构复杂，可用两次弯曲或复合弯曲（圆形件用摆动凹模）"]],"rel":null},{"t":"p","x":"弯曲模零部件：工作零件（凸模、凹模、凸凹模）、定位零件（定位板、定位钉）、顶件及压料装置、固定零件（导柱导套、模架、固定板、垫板、模柄、紧固件）。"},{"t":"table","head":["工作部分尺寸","确定方法"],"rows":[["凸模圆角半径 rp","取 rp=r（工件圆角）；若 r＜r<sub>min<\/sub>，取 rp≥r<sub>min<\/sub>，弯成较大圆角后再整形；r/t 大时应按回弹量修正"],["凹模圆角半径 rd","不宜过小（避免擦伤、压痕、弯曲力增大），一般不小于 3 mm，按料厚选取；<b>两边 rd 必须一致<\/b>，防止板料横向偏移"],["凸、凹模间隙","V 形件靠调节压力机闭合高度实现，不必在设计时给出；U 形件需合理选取，过大则回弹大、过小则弯曲力大磨损快"],["凹模深度","深度过小则两端自由部分多、回弹大、两臂不平直；过大则费料、顶件行程增加。弯边高度不大或要求两边平直时深度<b>大于<\/b>工件高度；弯边高度大而平直度要求不高时深度<b>小于<\/b>工件高度"],["U 形件凸凹模尺寸","标注外形尺寸时以<b>凹模<\/b>为基准（凹模基本尺寸=工件最小尺寸+xΔ，凸模=凹模−Z）；标注内形尺寸时以<b>凸模<\/b>为基准（凸模=工件最大尺寸−xΔ，凹模=凸模+Z）；偏差按入体原则布置"]],"rel":null},{"t":"h3","x":"本章速记（合上书自测）"},{"t":"ul","items":["<b>五特点<\/b>：变形集中在圆角；变形与应力都不均匀（存在两个中性层）；r/t 小则变薄；宽板断面不变、窄板变扇形。","<b>回弹五措施<\/b>：改进局部结构（压筋）、选 E 大 σ<sub>s<\/sub> 小的材料、校正弯曲代替自由弯曲、补偿法、改变变形区应力状态。","<b>展开长度<\/b>：L=Σ直边+Σ(πα/180)(r+xt)，中性层 ρ=r+xt。","<b>最小弯曲半径五因素<\/b>：材料塑性、纤维方向（弯曲线垂直纤维最好）、弯曲角、表面与侧边质量、料厚。","<b>弯曲力<\/b>：自由弯曲 0.6（V 形）/0.7（U 形）×Kbt²σ<sub>b<\/sub>/(r+t)；校正弯曲 qA；顶件压料取 30%～80%。"]}]},{"title":"第 5 章 拉深工艺与模具设计","sub":"变形机理 · 拉深系数 · 工艺计算","color":"ch6","blocks":[{"t":"p","x":"本章有必考大题，是全书“最值钱”的一章。知识主线是：<b>变形过程（环形变形区）→ 两大质量问题（起皱、拉裂）→ 拉深系数 m → 五步工艺计算 → 模具工作部分<\/b>。"},{"t":"h2","x":"6.1 拉深的定义与两类"},{"t":"p","x":"<b>拉深<\/b>：利用拉深模在压力机压力作用下，将平板毛坯压成各种开口空心件，或将已制成的空心件加工成其他形状空心件的加工方法。"},{"t":"table","head":["类型","毛坯","特点"],"rows":[["不变薄拉深（普通拉深）","平板毛坯","拉深过程中不产生较大变薄，<b>筒壁与筒底厚度基本一致<\/b>"],["变薄拉深","空心有底开口件","通过<b>减小壁厚<\/b>成形零件，底厚大于壁厚"]],"rel":null},{"t":"p","x":"拉深件类型：轴对称旋转体（喇叭、搪瓷杯）、盒形件（饭盒、油箱、电器外壳）、不对称拉深件（汽车覆盖件）。本章主要讨论<b>圆筒形零件<\/b>。"},{"t":"h2","x":"6.2 拉深变形过程与变形特点"},{"t":"p","x":"用<b>坐标网格实验法<\/b>（等间距同心圆+等分度辐射线划出扇形网格）观察金属流动：原始直径 D 的平板毛坯拉成圆筒后，<b>毛坯环形部分（外径 D、内径 d）变成工件直壁——环形区是变形区<\/b>；<b>直径 d 的圆盘部分变成筒底——不参加变形，是不变形区<\/b>。"},{"t":"p","x":"处于凸模底下的材料变化很小，变形主要集中在凹模平面上的 (D−d) 圆环形部分，这里是<b>主要变形区<\/b>。变形区内变形不均匀：在<b>切向压应力<\/b>与<b>径向拉应力<\/b>共同作用下，沿切向被压缩（越靠口部压缩越多）、沿径向被伸长（越靠口部伸长越多），因此<b>厚度沿高度各处不同，口部增厚最多（约 30%）；筒壁与底部转角稍上部位厚度最小，减薄近 10%<\/b>。"},{"t":"box","title":"一句话记住变形特点","body":["拉深时材料“<b>从外圈往口部挤、沿圆周被压缩、沿半径被拉长<\/b>”，所以口部变厚、底部转角稍上处变薄。"]},{"t":"h2","x":"6.3 拉深件质量分析与控制"},{"t":"h3","x":"一、起皱"},{"t":"p","x":"<b>起皱<\/b>：受切向压应力作用，<b>凸缘部分（特别是凸缘外边缘）材料失稳<\/b>，沿切向形成高低不平的皱折（拱起），类似压杆失稳。"},{"t":"p","x":"危害三方面：① 厚度加大后很难通过凸凹模间隙拉入，易使毛坯所受拉力过大而<b>断裂报废<\/b>；② 加剧模具磨损，模具寿命大幅降低；③ 皱纹在侧壁保留下来，影响外观质量。"},{"t":"p","x":"影响因素三条：① <b>凸缘部分相对厚度 t/D 小<\/b>，板料抗纵向弯曲能力小，容易起皱；② <b>切向压应力大<\/b>（变形程度大，需转移的剩余材料多），容易起皱；③ <b>凹模工作部分几何形状<\/b>——与平端面凹模相比，<b>锥形凹模允许用相对厚度较小的毛坯而不起皱<\/b>。"},{"t":"p","x":"防止起皱最有效的措施是<b>采用压边圈<\/b>：板料被强迫在压边圈与凹模平面的间隙中流动，稳定性得到加强；但加压边圈后拉深阻力增加。压边装置分<b>弹性压边<\/b>（弹簧式、橡皮式，用于中小件）与<b>刚性压边<\/b>（用于双动压力机拉深大型件）。"},{"t":"h3","x":"二、拉裂（拉深的主要难题）"},{"t":"p","x":"<b>拉裂<\/b>：筒壁与底部转角稍上部位的材料被拉断。当筒壁拉应力超过筒壁材料抗拉强度时，就会在<b>底部圆角与筒壁相切处——“危险断面”<\/b>产生破裂。"},{"t":"p","x":"原因是变形与硬化都不均匀：侧壁上部的厚度增加最多（约 30%）；<b>筒壁与底部转角稍上部位厚度最小（减少近 10%）、变薄最严重<\/b>，且越靠近底部变形程度越小、硬化程度越小、强度最低，所以这里最容易被拉裂。"},{"t":"p","x":"结论：<b>拉深中的主要问题是起皱和拉裂，但一般情况下起皱不是主要难题（加压边圈即可解决），主要问题是拉裂。<\/b>"},{"t":"p","x":"防止拉裂的四条措施：① 选用<b>硬化指数大、屈强比小<\/b>的材料；② 适当<b>增大凸、凹模圆角半径<\/b>；③ <b>增加拉深次数<\/b>、使每次变形量小；④ <b>改善润滑<\/b>。实践表明，直壁圆筒形件首次拉深中，<b>拉裂最易发生在拉深初期<\/b>。"},{"t":"h3","x":"三、硬化与凸耳"},{"t":"p","x":"拉深是塑性变形过程，材料必然<b>加工硬化<\/b>（变形抗力升高、塑性下降），多工序拉深时需中间退火。拉深后圆筒端部出现<b>凸耳<\/b>（一般 4 个，也可能 2、6、8 个），原因是<b>毛坯的各向异性<\/b>；凸耳需用修边去除，增加工序。"},{"t":"h2","x":"6.4 拉深件的工艺性与工艺方案"},{"t":"table","head":["结构要求","要点"],"rows":[["高度","尽量减小拉深件高度 → 减少拉深次数"],["形状","尽可能简单、对称，避免尖底形；半敞开非对称件可<b>成对拉深<\/b>后剖切成两件"],["凸缘","带凸缘件各部分尺寸比例要恰当以减小拉深次数；凸缘外形最好与直壁断面相似，减小切边余量"],["圆角","圆角半径尽量大些 → 减少整形工序"],["冲孔","孔中心至底边距离太小或凸缘上孔位置不当时应改用钻孔；底部孔径有要求"],["精度","断面尺寸精度一般低于 IT11，筒壁上、下部分壁厚差约 0.6～1.2t"],["尺寸标注","不能同时标注内、外壁尺寸（厚度变化），只能标其中之一；阶梯件以最小截面处底部为深度方向统一基准"]],"rel":null},{"t":"p","x":"拟定工艺方案的四条规则："},{"t":"ul","items":["每一道拉深的拉深系数<b>必须大于对应材料的极限拉深系数<\/b>；由于加工硬化，<b>首次拉深系数宜取小值，后续拉深系数逐渐增大<\/b>。"]},{"t":"ul","items":["对多次拉深、加工硬化严重的材料，必须进行<b>中间退火<\/b>。"]},{"t":"ul","items":["带底孔的拉深件：孔径要求不高可<b>先冲孔后拉深<\/b>或采用落料—拉深复合；<b>底孔要求较高时应先拉深后冲孔<\/b>（选择题第一组第 15 题）。"]},{"t":"ul","items":["凸缘部分及侧壁的孔均应在<b>拉深完再冲孔<\/b>。"]},{"t":"h2","x":"6.5 拉深系数"},{"t":"p","x":"<b>拉深系数 m<\/b>：拉深后工件直径与拉深前毛坯（半成品）直径之比，即 m=d/D；多次拉深时 m<sub>1<\/sub>=d<sub>1<\/sub>/D、m<sub>2<\/sub>=d<sub>2<\/sub>/d<sub>1<\/sub>……总拉深系数 m=d/D=m<sub>1<\/sub>·m<sub>2<\/sub>…mn。拉深系数也等于拉深后工件周长与拉深前毛坯周长之比。"},{"t":"p","x":"意义：m 反映变形程度，<b>m 越小变形程度越大<\/b>；它是拉深工艺最重要的工艺参数，是工艺计算的基础。<b>极限拉深系数<\/b>：材料既能拉深成形又不被拉裂时的最小拉深系数。"},{"t":"p","x":"拉深时毛坯外边缘切向压缩变形量 Δ=π(D−d)，相对压缩量反映变形程度。"},{"t":"table","head":["影响因素","规律"],"rows":[["材料机械性能","塑性越好、屈强比越小 → 极限拉深系数越小。σ<sub>s<\/sub> 小则变形区抗力小，σ<sub>b<\/sub> 大则危险断面强度高不易破裂"],["厚向异性系数 r 与硬化指数 n","r 大、n 大 → 拉深性能好、极限拉深系数小。r 大时板平面方向比厚度方向易变形，变形力小、不易起皱、传力区不易拉破；n 大则抗局部颈缩失稳能力强、变形均匀"],["模具间隙","间隙小 → 挤压与摩擦大 → 拉深力大 → m 增大"],["凹模圆角半径 rd","rd 小 → 材料流动阻力大 → 拉深力大 → m 增大"],["凸模圆角半径 rp","rp 过小 → 毛坯弯曲变形大、危险断面强度被削弱 → m 增大"],["凹模形状","锥形凹模支撑变形区的是锥面不是平面，防皱好、包角小、摩擦与弯曲阻力小 → m 减小"],["有无压边圈","有压边圈不易起皱，m 可比无压边圈时小；但压边力过大会增加阻力、易拉裂，故应在保证不起皱前提下<b>尽可能小<\/b>"],["拉深次数","有加工硬化且无中间退火时，m 应逐渐增大"],["润滑","润滑好 → 摩擦小、阻力小 → 极限拉深系数可小些"],["板料相对厚度 t/D","<b>重要因素<\/b>：t/D 大则凸缘抗失稳起皱能力提高，压边力可减小甚至不要，摩擦与变形抗力减小，m 可减小"],["工件形状","形状越简单，极限拉深系数越小"]],"rel":null},{"t":"h2","x":"6.6 圆筒形件拉深工艺计算（与第二部分配套看）"},{"t":"h3","x":"一、毛坯尺寸"},{"t":"p","x":"两条原理：<b>形状相似原理<\/b>（毛坯形状与工件截面形状相似，故筒形件用圆形毛坯）与<b>体积不变原理<\/b>（不变薄拉深按面积相等计算，即<b>等面积法<\/b>）。注意：<b>t＜1 mm 按工件标注尺寸计算；t≥1 mm 按工件中线尺寸计算<\/b>。"},{"t":"p","x":"<b>修边余量 Δh<\/b>：因板料各向异性、模具间隙不均、摩擦阻力不匀及毛坯定位不准，拉深件口部或凸缘周边不整齐，需在拉深后安排修边工序，为此要留出修边余量，按零件<b>高度查表<\/b>确定。"},{"t":"p","x":"毛坯计算步骤：① 确定修边余量 Δh；② 计算拉深件表面积（划分简单几何体分别求面积再相加）；③ 按面积相等求坯料直径。<b>形状复杂<\/b>的旋转体用“久里金”法则：任何形状母线旋转一周所得旋转体面积，等于该母线长度与其形心绕该轴旋转一周周长的乘积。"},{"t":"p","x":"无凸缘筒形件的毛坯直径："},{"t":"m","x":"D = <span class=\"rt\"><span class=\"rt-sign\">√<\/span><span class=\"rt-body\">d² + 4d(h+Δh) − 1.72dr − 0.56r²<\/span><\/span>"},{"t":"h3","x":"二、拉深次数"},{"t":"p","x":"两种方法：<b>推算法<\/b>与<b>查表法<\/b>。推算法步骤：① 计算毛坯相对厚度 t/D×100%，查表得各次极限拉深系数；② 计算总拉深系数 m=d/D；③ 比较 m 与 m<sub>1<\/sub>：若 m≥m<sub>1<\/sub> 可一次拉成；否则依次算 d<sub>1<\/sub>=m<sub>1<\/sub>D、d<sub>2<\/sub>=m<sub>2<\/sub>d<sub>1<\/sub>……<b>直到 dn≤d，其下标 n 即拉深次数<\/b>。查表法按相对高度 h/d 直接查表。"},{"t":"h3","x":"三、半成品尺寸"},{"t":"p","x":"① <b>调整拉深系数<\/b>：按极限系数算出的末次直径小于工件直径时，应把各次系数<b>适当放大<\/b>（且不小于极限值），使
