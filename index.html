@。","answers":["冲裁力","卸料力","推件力","顶件力"],"n":4}],"fillGroups":[{"key":1,"name":"高频必背","short":"高频必背","from":1,"to":6,"note":"考频最高的 6 条，优先背"},{"key":2,"name":"按考频排序","short":"按考频","from":7,"to":27,"note":"按公开试卷、题库命中份数由高到低"},{"key":3,"name":"网络预测题","short":"网络预测","from":28,"to":42,"note":"预测的高频填空题，含重复考点"}],"short":[{"id":"s1","no":1,"ci":0,"title":"冲裁变形过程包括哪几个阶段？各阶段有何特征？","detail":["①弹性变形阶段：凸模接触板料至应力达屈服极限，板料产生弹性压缩与弯曲，刃口附近应力集中，材料尚未塑性流动。","②塑性变形阶段：应力超过屈服极限，材料挤入凹模并塑性流动，刃口侧面被挤光形成光亮带，间隙附近微裂纹萌生。","③断裂分离阶段：裂纹自刃口侧面产生并沿间隙方向扩展，上下裂纹重合后板料分离，形成断裂带与毛刺。"],"recite":"三段式：弹性→塑性→断裂分离；弹性段受压弯曲、塑性段形成光亮带、断裂段裂纹重合分离留断裂带与毛刺。"},{"id":"s2","no":2,"ci":0,"title":"冲裁断面的特征区有哪几种？各由什么形成？","detail":["①塌角（圆角带）：刃口附近材料被牵连拉入变形而成，约占板厚的 5% 左右，塑性好的材料塌角较大。","②光亮带：凸、凹模挤压切入形成的平滑且与板面垂直的断面，约占板厚的 1/3～1/2。","③断裂带：裂纹扩展、材料被撕裂形成的粗糙斜面，材料塑性差时此区变宽。","④毛刺：刃口附近微裂纹与材料被撕裂后残留在边缘的尖状突起。"],"recite":"塌角（圆角）、光亮带、断裂带、毛刺；分别由牵连变形、挤压切入、裂纹扩展、撕裂残留形成。"},{"id":"s3","no":3,"ci":0,"title":"试分析影响冲裁件质量的因素。","detail":["①冲裁间隙：过大过小都使光亮带变窄、毛刺与断面斜度增大，尺寸精度下降；合理间隙时上下裂纹在板厚中部重合，断面最整齐。","②刃口状态：刃口锋利、间隙均匀时断面好；刃口磨钝后形成圆角，毛刺迅速增大，需及时刃磨。","③材料性能：塑性好的材料光亮带宽、断裂带窄、塌角大；硬脆材料反之，断裂带占比大。","④模具制造精度与压力机精度：影响间隙均匀性、刃口垂直度与送料定位，进而决定尺寸精度与断面垂直度。"],"recite":"四因素：间隙、刃口状态、材料性能、模具与压力机精度；间隙均匀合理时断面最整齐。"},{"id":"s4","no":4,"ci":0,"title":"分析冲裁间隙的大小与冲裁件尺寸之间的关系。","detail":["①间隙较大时，变形区以拉应力为主，冲裁后材料弹性回复使落料件尺寸小于凹模刃口尺寸，冲孔孔径大于凸模尺寸。","②间隙较小时，变形区以压应力为主，弹性回复方向相反，落料件尺寸大于凹模尺寸，冲孔孔径小于凸模尺寸。","③故间隙决定尺寸偏差的方向与大小：落料件尺寸随间隙增大而减小，冲孔孔径随间隙增大而增大，生产中据此按零件精度要求选取间隙。"],"recite":"间隙大→落料件偏小、冲孔孔偏大；间隙小→落料件偏大、冲孔孔偏小（弹性回复方向不同）。"},{"id":"s5","no":5,"ci":0,"title":"冲裁间隙的大小对冲裁断面质量有何影响？","detail":["①合理间隙：上下裂纹在板厚中部（约 1/3～1/2 处）相遇重合，断面平直、斜度小、光亮带约占 1/3～1/2，毛刺小且易去除。","②间隙过大：上下裂纹错开，形成二次光亮带，毛刺厚而大并沿板面拉长，塌角与斜度增大，光亮带比例减小。","③间隙过小：挤压与摩擦加剧，出现二次光亮带，毛刺高而薄，塌角与斜度小，但冲裁力、模具磨损和刃口崩裂风险明显增大。"],"recite":"合理间隙裂纹重合、断面光洁；过大→二次光亮带+拉长毛刺；过小→挤压大、毛刺高薄、模具磨损快。"},{"id":"s6","no":6,"ci":0,"title":"简述冲裁模刃口尺寸的计算原则和方法。","detail":["①计算原则：落料以凹模为基准，冲孔以凸模为基准；落料件外形由凹模决定，冲孔孔径由凸模决定。","②凹模按磨损后尺寸增大的规律计算：<i class=\"v\">D<\/i>凹=(<i class=\"v\">D<\/i> max−<i class=\"v\">x<\/i>Δ)+<i class=\"v\">δ<\/i>；凸模按磨损后尺寸减小的规律计算：<i class=\"v\">d<\/i>凸=(<i class=\"v\">d<\/i> min+<i class=\"v\">x<\/i>Δ)−<i class=\"v\">δ<\/i>；凸凹模均取最小合理间隙起始值。","③方法一（分开加工）：凸、凹模分别标注制造公差，须满足 ｜<i class=\"v\">δ<\/i>凸｜+｜<i class=\"v\">δ<\/i>凹｜≤ <i class=\"v\">Z<\/i> max−<i class=\"v\">Z<\/i> min，适用于形状简单、批量大的模具。","④方法二（配合加工／配作）：先按基准件（落料凹模或冲孔凸模）计算并标注公差，另一件按间隙配作、只标基本尺寸，适用于形状复杂或薄料模具。"],"recite":"落料以凹模为基准、冲孔以凸模为基准；凹模按磨损增大算正偏差，凸模按磨损减小算负偏差；分开加工须满足 <i class=\"v\">δ<\/i>凸+<i class=\"v\">δ<\/i>凹≤<i class=\"v\">Z<\/i><sub>max<\/sub>−<i class=\"v\">Z<\/i><sub>min<\/sub>，复杂件用配合加工。"},{"id":"s7","no":7,"ci":0,"title":"简述降低冲裁力的措施。","detail":["①阶梯凸模冲裁：多凸模做成不同高度，使各凸模分批剪断板料，减小同时剪切的最大力；小凸模应做得较短以免折断。","②斜刃冲裁：刃口做成斜角使剪切逐渐进行，冲裁力可降低 30%～50%；为获得平整件，落料时斜刃做在凹模上，冲孔时做在凸模上。","③加热冲裁（红冲）：将板料加热到蓝脆区以外的温度以降低抗剪强度，从而降低冲裁力，但需防止氧化与变形。","④辅助措施：增大冲裁间隙、减小搭边值，也可小幅降低冲裁力。"],"recite":"阶梯凸模（分批剪断）、斜刃（逐渐剪切，降 30~50%）、加热（降抗剪强度）；落料斜刃在凹模、冲孔在凸模。"},{"id":"s8","no":8,"ci":0,"title":"什么是连续模（级进模）？连续模冲压有何特点？","detail":["①定义：在条料送进方向上有两个或两个以上工位，压力机一次行程中在不同工位上依次完成两道或两道以上工序的模具。","②优点：生产率高、便于实现自动化与多工序组合（冲裁、弯曲、拉深可一并完成），适合大批量小型件生产，操作安全。","③缺点：模具轮廓尺寸大、结构复杂、制造与调试成本高、对维修要求高。","④必要条件：须有可靠的定距机构（侧刃、导正销）、导料与卸料机构；工件精度主要取决于送进步距与定位精度。"],"recite":"多工位、一次行程分步完成多工序；高效易自动化、适合大批量小件；但模具大、成本高，须靠侧刃/导正销定距。"},{"id":"s9","no":9,"ci":0,"title":"什么是复合模？复合模冲压有何特点？","detail":["①定义：只有一个工位，压力机一次行程内在同一工位同时完成两道或两道以上工序的模具（如落料与冲孔复合）。","②优点：结构紧凑、轮廓面积小；内外形相对位置精度高（同一工位一次定位），生产效率较单工序模高。","③缺点：模具零件壁厚小、强度要求高，制造与维修困难，安装调整要求高。","④分类：落料凹模装在下模称正装式（打料装置在上模，出件可靠）；落料凹模装在上模称倒装式（废料可由下模漏出，适合薄料大批量）。"],"recite":"单工位一次同时完成多工序；精度高、结构紧凑、效率较高；但强度要求高、维修难；凹模在下为正装、在上为倒装。"},{"id":"s10","no":10,"ci":0,"title":"模具定位零件有何作用？常用定位零件有哪几种？","detail":["①作用：使条料、块料或工序件在模具内保持正确位置，并保证送进步距，从而保证工件内外形及件与件之间的相对位置精度。","②条料导向类：导料销、导料板（导尺）、侧压板，用于控制条料宽度方向位置。","③送料定距类：挡料销（固定式、活动式、始用挡料销）、导正销、侧刃，用于控制每次送进的距离。","④块料或工序件定位类：定位销、定位板，用于单个毛坯或半成品的定位。"],"recite":"作用是定位置、定步距；三类：导料（导料板、导料销）、定距（挡料销、导正销、侧刃）、块件定位（定位销、定位板）。"},{"id":"s11","no":11,"ci":0,"title":"什么是冲裁模压力中心？为什么要与冲床滑块中心重合？如何计算？","detail":["①定义：冲裁时各冲压力合力的作用点，即模具的压力中心。","②重合原因：若压力中心与滑块中心线偏心，压力机与模具承受偏载并产生附加弯矩，造成滑块导轨单边磨损、模具刃口磨损不均、间隙偏移，进而降低工件质量甚至损坏模具与设备。","③计算方法：多凸模冲裁时按各凸模冲裁力对坐标轴的力矩平衡求合力作用点，<i class=\"v\">x<\/i>=ΣFi <i class=\"v\">x<\/i><sub><i class=\"v\">i<\/i><\/sub>／ΣFi，<i class=\"v\">y<\/i>=ΣFi <i class=\"v\">y<\/i><sub><i class=\"v\">i<\/i><\/sub>／ΣFi。","④形状对称的单一冲件，其压力中心即几何中心；形状复杂件可分段求各段重心，再按各段冲裁力（或轮廓长度）加权。"],"recite":"冲压力合力作用点；偏心会偏载、磨损不均、间隙偏移，故须与滑块中心重合；按各凸模冲裁力对坐标轴力矩平衡求 <i class=\"v\">x<\/i>、<i class=\"v\">y<\/i>。"},{"id":"s12","no":12,"ci":0,"title":"什么是冲裁模闭合高度？如何确定？","detail":["①定义：模具处于闭合状态（最低工作位置）时，上模座上平面至下模座下平面之间的距离。","②计算：<i class=\"v\">H<\/i>=上模座厚+下模座厚+凸模工作长度+凹模厚度−凸、凹模重叠（进入）部分，并计入垫板厚度。","③选机条件：须满足 <i class=\"v\">H<\/i> max−<i class=\"v\">H<\/i>1 ≥ <i class=\"v\">H<\/i> ≥ <i class=\"v\">H<\/i> min（<i class=\"v\">H<\/i>1 为垫板厚度或所需安全余量），即模具闭合高度必须介于压力机最大与最小闭合高度之间。","④当 <i class=\"v\">H<\/i> 偏小时可加压垫板调整，偏大则无法安装，须改选压力机或修改模具。"],"recite":"闭合时上模座上平面到下模座下平面的距离；须满足 <i class=\"v\">H<\/i><sub>max<\/sub>−<i class=\"v\">H<\/i>1≥<i class=\"v\">H<\/i>≥<i class=\"v\">H<\/i><sub>min<\/sub>，偏小加垫板、偏大须换压力机。"},{"id":"s13","no":13,"ci":1,"title":"弯曲时变形主要在什么部位？有何特点？","detail":["①变形部位：集中在凸模圆角附近的弯曲变形区，即曲率发生变化的一段；直边部分基本不变形，只随中性层平移并略有倾斜。","②应力特征：变形区内层受压、外层受拉，存在长度不变、应力为零的中性层。","③厚度与断面：变形区板厚减薄、外层变薄最明显；宽板弯曲断面近似不变，窄板弯曲出现截面畸变（翘曲）。","④卸载后：弹性变形恢复产生回弹，弯曲角与弯曲半径偏离模具尺寸。"],"recite":"变形集中在弯曲圆角区，直边不变形；内压外拉、有中性层；板厚减薄、断面畸变、卸载回弹。"},{"id":"s14","no":14,"ci":1,"title":"宽板、窄板弯曲时的应力应变状态有何不同？","detail":["①宽板（宽度 <i class=\"v\">B<\/i> 远大于厚度 <i class=\"v\">t<\/i>）：宽度方向变形受相邻材料约束，宽向应变近似为零（平面应变），宽向应力不为零但较小，工程上按单向（切向）应力状态分析，故称“宽板弯曲为单向应力状态”。","②窄板（宽度与厚度相近）：宽度方向可自由变形，宽向应力近似为零，而宽向应变不为零，形成三向应变状态（外层切向拉、厚向压、宽向收缩，内层相反）。","③后果：窄板弯曲因宽向应变不均匀易产生截面畸变与翘曲；宽板弯曲断面基本保持平直，一般不翘曲。"],"recite":"宽板：宽向应变≈0，按单向（切向）应力分析，不翘曲；窄板：宽向应力≈0、三向应变，易翘曲。"},{"id":"s15","no":15,"ci":1,"title":"什么是弯曲系数（相对弯曲半径）？其代表什么含义？","detail":["①定义：相对弯曲半径 <i class=\"v\">r<\/i>/<i class=\"v\">t<\/i>，<i class=\"v\">r<\/i> 为弯曲件内表面的弯曲半径，<i class=\"v\">t<\/i> 为板厚；工程上也称弯曲系数，用其表示弯曲变形程度。","②含义：<i class=\"v\">r<\/i>/<i class=\"v\">t<\/i> 越小，外层材料的拉伸应变越大、变形程度越大，越易弯裂，但卸载回弹越小；<i class=\"v\">r<\/i>/<i class=\"v\">t<\/i> 越大，变形越缓和、回弹越大。","③极限值：为保证外层不裂，存在最小相对弯曲半径（<i class=\"v\">r<\/i>/<i class=\"v\">t<\/i>）min，其大小取决于材料塑性与热处理状态。"],"recite":"<i class=\"v\">r<\/i>/<i class=\"v\">t<\/i> 表示弯曲变形程度；<i class=\"v\">r<\/i>/<i class=\"v\">t<\/i> 小→变形大易裂但回弹小；<i class=\"v\">r<\/i>/<i class=\"v\">t<\/i> 大→回弹大；有保证不裂的最小 <i class=\"v\">r<\/i>/<i class=\"v\">t<\/i>。"},{"id":"s16","no":16,"ci":1,"title":"简述影响弯曲系数（弯曲变形程度）的因素。","detail":["①材料塑性：塑性好、延伸率大的材料允许较大变形程度，最小相对弯曲半径小。","②加工硬化状态：冷作硬化后塑性下降，允许变形程度减小，须中间退火恢复塑性。","③板厚与轧制方向：板厚越大外层应变越大，最小 <i class=\"v\">r<\/i>/<i class=\"v\">t<\/i> 增大；弯曲线与轧制方向垂直时塑性较好、不易裂。","④弯曲方式与模具：有无校正弯曲、凸模圆角与间隙大小直接影响变形均匀性。","⑤工件形状与表面质量：宽度、过渡圆角、缺口与毛刺会造成应力集中，降低允许变形程度。"],"recite":"材料塑性、硬化状态、板厚与轧制方向、弯曲方式与模具、件形与表面质量。"},{"id":"s17","no":17,"ci":1,"title":"什么是弯曲回弹现象？产生回弹的根本原因是什么？","detail":["①现象：卸载后弯曲件的弯曲角与弯曲半径发生变化，与模具工作部分尺寸不一致（角度变大或变小、半径张开），造成形状与尺寸超差。","②根本原因：弯曲变形由塑性变形与弹性变形共同组成，卸载时弹性变形完全恢复；同时变形区内残余应力重新分布，使工件产生附加弹性恢复。","③影响因素：相对弯曲半径 <i class=\"v\">r<\/i>/<i class=\"v\">t<\/i> 越大、材料屈服强度越高、弹性模量越小，回弹越大；校正弯曲可显著减小回弹。"],"recite":"卸载后弯曲角与半径回弹、与模具不符；根因是弯曲总含弹性变形，卸载时弹性恢复+残余应力重分布。"},{"id":"s18","no":18,"ci":1,"title":"简述减小弯曲件回弹的常用措施。","detail":["①改进零件设计：减小相对弯曲半径 <i class=\"v\">r<\/i>/<i class=\"v\">t<\/i>，在弯曲区压制加强筋提高刚度，选用力学性能稳定、厚度均匀的材料。","②改进工艺：用校正弯曲代替自由弯曲；对冷作硬化材料先退火降低屈服强度；回弹大的材料可加热弯曲；<i class=\"v\">r<\/i>/<i class=\"v\">t<\/i> 很大时采用拉弯工艺。","③改进模具：凸凹模取负间隙或不同间隙，凸模做成局部突起或小圆角，按实测回弹量修正模具工作部分尺寸。","④增加约束：采用弹性顶件与压料装置，使弯曲终了时变形区处于受压状态，抑制弹性恢复。"],"recite":"改设计（减小 <i class=\"v\">r<\/i>/<i class=\"v\">t<\/i>、加强筋）、改工艺（校正弯曲、退火、加热、拉弯）、改模具（负间隙、补偿修正、压料顶件）。"},{"id":"s19","no":19,"ci":2,"title":"什么是起皱现象？为什么会产生起皱？防止起皱的有效措施是什么？","detail":["①现象：拉深时凸缘变形区（或侧壁）在切向压应力作用下失稳，形成波浪状皱褶，影响工件质量并可能引发拉裂。","②原因：凸缘区受切向压应力压缩，当压应力超过临界失稳应力即失稳起皱；拉深系数越小、凸缘越宽、板越薄、材料弹性模量与硬化指数越低，越易起皱。","③措施：采用压边圈并选取合适压边力（过大拉裂、过小起皱）；设置压料筋或拉深槛以增大径向拉应力、减小切向压应力；增大板厚或减小凸缘宽度、增加拉深次数；合理选取凹模圆角与润滑。"],"recite":"切向压应力使凸缘失稳起皱；加压边圈控压边力、设压料筋/拉深槛、增厚减凸缘、多次拉深。"},{"id":"s20","no":20,"ci":2,"title":"凸缘变形区的应力分布有何特点？","detail":["①三向应力状态：切向为压应力 <i class=\"v\">σ<\/i><sub>3<\/sub>，径向为拉应力 <i class=\"v\">σ<\/i><sub>1<\/sub>（由凸模经侧壁传来，用以克服变形抗力与摩擦），厚向为压应力 <i class=\"v\">σ<\/i><sub>2<\/sub>（由压边圈与凹模造成）。","②沿径向分布：由外缘向凹模入口，切向压应力的绝对值逐渐减小，外缘处压应力最大，是起皱的发源地；径向拉应力由外向内增大，凹模入口处最大，是拉裂的危险位置。","③沿厚度分布：因压边与模具约束，内外层应力状态不同，产生附加弯曲效应，使板厚减薄并在凸模圆角处形成危险断面。"],"recite":"三向：切向压、径向拉、厚向压；外缘切向压最大（起皱源），凹模口径向拉最大（易裂）。"},{"id":"s21","no":21,"ci":2,"title":"什么是拉深系数？其代表什么含义？","detail":["①定义：拉深系数 <i class=\"v\">m<\/i>=<i class=\"v\">d<\/i>/<i class=\"v\">D<\/i>，即拉深后圆筒件直径 <i class=\"v\">d<\/i> 与拉深前毛坯（或半成品）直径 <i class=\"v\">D<\/i> 之比；多次拉深时，各次拉深系数之积等于总拉深系数。","②含义：<i class=\"v\">m<\/i> 越小，切向压缩与径向拉伸越剧烈，变形程度越大，所需拉深次数少但越易拉裂；<i class=\"v\">m<\/i> 越大变形越缓和。","③取值：首次拉深 <i class=\"v\">m<\/i><sub>1<\/sub> 一般为 0.5～0.6（无压边时更大），后续各次拉深系数逐次略增；生产中按极限拉深系数校核拉深次数。"],"recite":"<i class=\"v\">m<\/i>=<i class=\"v\">d<\/i>/<i class=\"v\">D<\/i>，拉深后与拉深前直径之比；<i class=\"v\">m<\/i> 小变形大易裂，各次之积为总拉深系数；首次约 0.5~0.6。"},{"id":"s22","no":22,"ci":2,"title":"影响极限拉深系数的因素有哪些？","detail":["①材料性能：塑性好、屈强比小、硬化指数 <i class=\"v\">n<\/i> 与厚向异性系数 <i class=\"v\">r<\/i> 大的材料，抗拉裂能力强，极限拉深系数可小。","②板厚相对直径 <i class=\"v\">t<\/i>/<i class=\"v\">D<\/i>：板料越厚，抗失稳与抗拉裂能力越强，极限拉深系数可小。","③模具几何参数：凸模圆角半径过小易拉裂，凹模圆角与锥形凹模、球形凹模有利于成形。","④压边力与润滑：压边力过大易拉裂、过小易起皱；良好润滑降低摩擦、提高成形极限。","⑤拉深方式与速度、毛坯形状与尺寸，也会影响极限拉深系数。"],"recite":"<i class=\"v\">m<\/i> 太小即拉裂；主要受材料塑性、<i class=\"v\">t<\/i>/<i class=\"v\">D<\/i>、模具圆角、压边力与润滑影响。"},{"id":"s23","no":23,"ci":2,"title":"拉深时凸、凹模间隙过大或过小时各造成什么后果？","detail":["①间隙过大（大于板厚）：侧壁不受约束，工件易起皱、贴模差、尺寸精度低且回弹大；但拉深阻力小、不易拉裂。","②间隙过小（小于板厚）：侧壁受到挤压，拉深力增大、易拉裂，模具磨损加剧、工件表面易划伤；但尺寸精度高、侧壁垂直度好。","③取值：一般单面间隙取（1.0～1.1）<i class=\"v\">t<\/i> 左右，末次拉深可接近板厚以保证精度；精度要求高时取小间隙并配合良好润滑。"],"recite":"过大→起皱贴模差、精度低但不裂；过小→挤压大、易裂、磨损划伤；常取 (1.0~1.1)<i class=\"v\">t<\/i>。"}],"shortChapters":[{"title":"冲裁工艺","short":"冲裁工艺","count":12},{"title":"弯曲工艺","short":"弯曲工艺","count":6},{"title":"拉深工艺","short":"拉深工艺","count":5}],"term":[{"id":"d1","no":1,"ci":0,"title":"冷冲压（冲压）","detail":["在常温下，利用安装在压力机上的冲模对材料施加压力，使其产生分离或塑性变形，从而获得所需零件的一种压力加工方法。它属于金属塑性加工，具有生产率高、尺寸稳定、互换性好、材料利用率高、可加工复杂形状、成本低等优点，广泛用于汽车、家电与电子等行业。"],"recite":"常温下用装在压力机上的冲模加压，使材料分离或塑性变形而得到零件的加工方法；高效、稳定、省料。"},{"id":"d2","no":2,"ci":0,"title":"冲裁","detail":["利用模具使板料沿封闭或非封闭轮廓产生分离的工序。按轮廓是否封闭及用途可分为落料、冲孔、切断、修边、切舌、剖切等，广义上都属冲裁；狭义的冲裁工艺主要指落料与冲孔，是冲压生产中最基本、应用最广的分离工序。"],"recite":"用模具使板料沿轮廓分离的工序；广义含落料、冲孔、切断、修边等，通常指落料和冲孔。"},{"id":"d3","no":3,"ci":0,"title":"落料与冲孔","detail":["二者是同一冲裁工序按用途区分的两种形式，都沿封闭轮廓使材料分离。冲裁后以封闭曲线以内的部分作为工件的称落料，其外形尺寸由凹模刃口尺寸决定，用于获得一定形状的平板零件；以封闭曲线以外的部分作为工件、被冲掉的部分为废料的称冲孔，孔径由凸模刃口尺寸决定，用于在工件上制出孔。"],"recite":"落料——要封闭线以内，凹模定外形尺寸；冲孔——要孔，凸模定孔径。"},{"id":"d4","no":4,"ci":0,"title":"弯曲","detail":["将板料、管材或型材弯成具有一定曲率和角度的零件的成形工序。弯曲时变形集中在凸模圆角附近、曲率发生变化的弯曲变形区，直边部分基本不变形；变形区内层受压、外层受拉，存在长度不变的中性层；板厚略有减薄、断面产生畸变，卸载后有回弹。"],"recite":"把板料弯成一定曲率或角度的成形工序；变形集中在圆角区，内压外拉、有中性层，卸载回弹。"},{"id":"d5","no":5,"ci":0,"title":"拉深","detail":["利用模具在压力机一次行程中，将平板毛坯制成开口空心零件（筒形件、盒形件、带凸缘筒形件等）的成形工序，又称拉延、压延。拉深时凸缘为主变形区、筒壁为传力区，凸缘受切向压应力与径向拉应力而容易起皱，危险断面在筒壁与底部圆角过渡处，容易拉裂。"],"recite":"平板毛坯经模具制成开口空心件的成形工序；凸缘变形、筒壁传力，易起皱与拉裂。"},{"id":"d6","no":6,"ci":1,"title":"冲裁间隙","detail":["冲裁模中凹模刃口横向尺寸与凸模刃口横向尺寸之差值，分单面间隙（<i class=\"v\">Z<\/i>/2）与双面间隙（<i class=\"v\">Z<\/i>）。它是冲裁工艺中最重要的参数：间隙合理时上下裂纹在板厚中部重合，断面光洁、毛刺小；间隙过小时挤压加剧，出现二次光亮带，冲裁力、卸料力和刃口磨损增大；间隙过大时光亮带变窄，塌角、斜度与拉长毛刺增大，尺寸精度下降。间隙还直接影响卸料力、推件力与模具寿命。"],"recite":"凹模与凸模刃口横向尺寸之差（单面、双面）；影响断面质量、冲裁力、卸料力与模具寿命。"},{"id":"d7","no":7,"ci":1,"title":"单工序模、复合模与级进模","detail":["按工序组合程度分三类：单工序模是在压力机一次行程中只完成一道工序的模具，结构简单、制造方便，适合小批量或大型件；复合模只有一个工位，一次行程中在同一工位同时完成两道及以上工序（如落料与冲孔复合），内外形位置精度高、结构紧凑，但零件壁厚小、强度要求高、制造维修难；级进模（连续模）在送料方向上有两个及以上工位，一次行程中在不同工位逐次完成多道工序，效率高、易自动化，但轮廓尺寸大、成本高，须用侧刃或导正销定距。"],"recite":"单工序=一次行程一道工序；复合=同工位一次完成多工序（精度高、难修）；级进=多工位逐次完成（高效、模具大）。"},{"id":"d8","no":8,"ci":1,"title":"模具闭合高度","detail":["冲模处于最低工作位置（闭合状态）时，上模座上平面至下模座下平面之间的距离，等于上模座厚、下模座厚、凸模工作长度与凹模厚度之和减去凸凹模重叠部分，并计入垫板厚度。选择压力机时须满足 <i class=\"v\">H<\/i> max−<i class=\"v\">H<\/i>1 ≥ <i class=\"v\">H<\/i> ≥ <i class=\"v\">H<\/i> min，偏小可加垫板调整，偏大则无法安装。"],"recite":"模具闭合时上模座上平面到下模座下平面的距离；须介于压力机最大与最小闭合高度之间。"},{"id":"d9","no":9,"ci":1,"title":"压力中心","detail":["冲压时各冲压力合力的作用点。多凸模冲裁或复杂件冲压时，按各冲压力对坐标轴的力矩平衡求合力作用点，<i class=\"v\">x<\/i>=ΣFi <i class=\"v\">x<\/i><sub><i class=\"v\">i<\/i><\/sub>／ΣFi，<i class=\"v\">y<\/i>=ΣFi <i class=\"v\">y<\/i><sub><i class=\"v\">i<\/i><\/sub>／ΣFi。设计时应使模具压力中心与压力机滑块中心线重合，否则产生偏心载荷与附加弯矩，使滑块导轨单边磨损、模具刃口磨损不均、间隙偏移，降低工件质量甚至损坏设备。"],"recite":"各冲压力合力的作用点；须与滑块中心重合，否则偏载磨损、间隙偏移。"},{"id":"d10","no":10,"ci":1,"title":"搭边","detail":["排样时工件与工件之间、工件与条料侧边之间留下的工艺余料。作用是补偿送料定位误差与剪板误差、保证工件轮廓完整；增加条料刚度、便于送料、提高生产率；并防止条料边缘毛刺被拉入间隙。搭边过大浪费材料、降低利用率，过小则易被拉断，且毛刺与边缘材料挤入间隙会加剧刃口磨损。"],"recite":"工件之间及工件与条料侧边间的工艺余料；补偿误差、增加刚度；过大浪费、过小拉断与磨损。"},{"id":"d11","no":11,"ci":1,"title":"排样","detail":["冲裁件在条料、带料或板料上的布置方式，包括确定搭边值、送进步距、条料宽度与排样形式。按材料利用情况分为有废料排样（工件周边均有搭边，质量好但利用率低）、少废料排样（部分边缘无搭边）、无废料排样（无搭边、直接由切断获得，利用率最高但毛刺与精度较差）。排样直接决定材料利用率、冲裁件质量与模具寿命。"],"recite":"工件在条料上的布置方式；分有废料、少废料、无废料三种，决定利用率、质量与模具寿命。"},{"id":"d12","no":12,"ci":2,"title":"弯曲中性层","detail":["板料弯曲时外层纤维受拉、内层纤维受压，断面上必存在一层既不受拉也不受压、切向应力为零的过渡层，称弯曲中性层。其位置随相对弯曲半径 <i class=\"v\">r<\/i>/<i class=\"v\">t<\/i> 变化：变形程度小时接近板厚中部，<i class=\"v\">r<\/i>/<i class=\"v\">t<\/i> 很小时向内侧偏移。中性层长度在弯曲前后保持不变，故弯曲件展开长度等于中性层长度，是毛坯尺寸计算的依据。"],"recite":"弯曲时应力为零的过渡层；长度不变，按它算展开长度；<i class=\"v\">r<\/i>/<i class=\"v\">t<\/i> 小时向内偏移。"},{"id":"d13","no":13,"ci":2,"title":"最小弯曲半径","detail":["在保证板料外层纤维不发生裂纹或破坏的条件下，工件所能弯成的内表面最小圆角半径，是衡量弯曲变形极限的指标，工程上常用相对最小弯曲半径（<i class=\"v\">r<\/i>/<i class=\"v\">t<\/i>）min 表示。其值与材料塑性、加工硬化状态、板厚、弯曲线相对轧制方向及毛坯表面质量有关：塑性差、硬化严重、弯曲线平行于轧制方向时，允许的最小半径增大。"],"recite":"不裂前提下能弯的最小内圆角半径；塑性越好越小，硬化或平行轧向时变大。"},{"id":"d14","no":14,"ci":2,"title":"回弹","detail":["塑性弯曲时必然伴随弹性变形，卸载后弹性变形完全恢复、残余应力重新分布，使弯曲件的弯曲角度与弯曲半径偏离模具尺寸的现象，表现为角度张开或闭合、半径变大、工件翘曲。影响因素有材料力学性能（屈服强度高、弹性模量小则回弹大）、相对弯曲半径 <i class=\"v\">r<\/i>/<i class=\"v\">t<\/i>、弯曲中心角、弯曲方式与模具结构、工件形状。减小措施主要有补偿法、校正法、拉弯及合理选材。"],"recite":"卸载后弹性恢复，使角度与半径偏离模具尺寸；<i class=\"v\">r<\/i>/<i class=\"v\">t<\/i> 大、屈服强度高则回弹大；补偿、校正、拉弯。"},{"id":"d15","no":15,"ci":3,"title":"拉深系数","detail":["拉深后工件直径与拉深前毛坯（或半成品）直径之比，<i class=\"v\">m<\/i>=<i class=\"v\">d<\/i>/<i class=\"v\">D<\/i>，是衡量拉深变形程度的指标。<i class=\"v\">m<\/i> 越小，切向压缩与径向拉伸越剧烈、变形程度越大，越易拉裂；各次拉深系数之积等于总拉深系数。一次拉深不发生拉裂的最小 <i class=\"v\">m<\/i> 称极限拉深系数，受材料塑性、相对厚度 <i class=\"v\">t<\/i>/<i class=\"v\">D<\/i>、模具圆角、压边力与润滑影响；首次拉深 <i class=\"v\">m<\/i><sub>1<\/sub> 一般为 0.5～0.6。"],"recite":"<i class=\"v\">m<\/i>=<i class=\"v\">d<\/i>/<i class=\"v\">D<\/i>，拉深后与拉深前直径之比；越小变形越大、易裂；之积为总系数，最小值即极限拉深系数。"}],"termChapters":[{"title":"通用概念","short":"通用概念","count":5},{"title":"冲裁与冲裁模","short":"冲裁与冲裁模","count":6},{"title":"弯曲","short":"弯曲","count":3},{"title":"拉深","short":"拉深","count":1}]};</script>
<script>
(function(){
'use strict';

/* ---------------- 工具 ---------------- */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip = h => { const d = document.createElement('div'); d.innerHTML = h; return (d.textContent || ''); };

const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){ toast('浏览器存储不可用，修改无法保存'); } }
};

const MCQ   = DATA.mcq;
const THINK = DATA.think;
const KNOW  = DATA.sections;
const BIG   = DATA.big;
const FILL  = DATA.fill;
const FILLG = DATA.fillGroups;
const PCFG  = {
  short: { items: DATA.short, ch: DATA.shortChapters },
  term:  { items: DATA.term,  ch: DATA.termChapters  }
};

let ANS   = store.get('sq_ans_v1', {});    // 选择题作答
let CUS   = store.get('sq_cus_v1', {});    // 思考题自定义
let BIGS  = store.get('sq_big_v1', {});   // 大题是否已看答案
let FILLS = store.get('sq_fill_v1', {});  // 填空：显示答案 / 已掌握
let PREDS = store.get('sq_pred_v1', {});  // 简答 + 名词解释：已掌握 / 答案标签
let ui    = store.get('sq_ui_v1', { theme:'light' });
let CURTAB = 'quiz';

const QS = { pool: [], idx: 0, grp: 'all', ord: 'seq', flt: 'all' };
const TSTATE = { ch: 'all', kw: '', open: {}, self: false };
const KN = { idx: 0 };
const BGS = { idx: 0 };
const FS = { grp:'all', kw:'' };
const PS = {
  short: { sec:'all', kw:'', open:{}, self:false },
  term:  { sec:'all', kw:'', open:{}, self:false }
};

/* ---------------- 主题 ---------------- */
function applyTheme(){ document.documentElement.setAttribute('data-theme', ui.theme); }
function syncThemeBtn(){ $('#themeBtn').textContent = ui.theme === 'dark' ? '☀　浅色模式' : '◐　深色模式'; }
applyTheme(); syncThemeBtn();
$('#themeBtn').onclick = () => {
  ui.theme = ui.theme === 'dark' ? 'light' : 'dark';
  store.set('sq_ui_v1', ui); applyTheme(); syncThemeBtn();
};

/* ---------------- toast ---------------- */
let toastTimer;
function toast(msg){
  let el = $('#toast');
  if (!el){
    el = document.createElement('div');
    el.id = 'toast';
    el.style.cssText = 'position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:99;' +
      'background:var(--ink);color:var(--bg);font-size:13px;padding:9px 18px;border-radius:10px;' +
      'box-shadow:var(--shadow);opacity:0;transition:.25s;pointer-events:none;max-width:80vw;text-align:center';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.opacity = '0'; }, 1900);
}

/* ---------------- 文档块渲染 ---------------- */
function renderBlocks(blocks){
  const out = [];
  (blocks || []).forEach(b => {
    switch (b.t){
      case 'h2': out.push('<h3>' + b.x + '</h3>'); break;
      case 'h3': out.push('<h4>' + b.x + '</h4>'); break;
      case 'p':  out.push('<p>' + b.x + '</p>'); break;
      case 'l':  out.push('<p class="lead">' + b.x + '</p>'); break;
      case 'c':  out.push('<p>' + b.x + '</p>'); break;
      case 'm':  out.push('<div class="fml">' + b.x + '</div>'); break;
      case 'k':  out.push('<div class="recite"><span class="rz">背诵</span><p>' + b.x + '</p></div>'); break;
      case 'ul': out.push('<ul>' + (b.items || []).map(x => '<li>' + x + '</li>').join('') + '</ul>'); break;
      case 'box':
        out.push('<div class="callout"><div class="ct">' + (b.title || '') + '</div><div class="cb">' +
          (b.body || []).map(x => '<p>' + x + '</p>').join('') + '</div></div>');
        break;
      case 'table':
        let cg = '';
        let rel = b.rel;
        if (!rel && b.head.length >= 5) rel = b.head.map((_, i) => (i === 0 ? 1.35 : 1));
        if (rel && rel.length === b.head.length){
          const sum = rel.reduce((a, c) => a + c, 0);
          cg = '<colgroup>' + rel.map(w => '<col style="width:' + (w / sum * 100).toFixed(2) + '%">').join('') + '</colgroup>';
        }
        out.push('<table class="tbl">' + cg +
          '<thead><tr>' + b.head.map(h => '<th>' + h + '</th>').join('') + '</tr></thead>' +
          '<tbody>' + (b.rows || []).map(r =>
            '<tr>' + b.head.map((_, i) => '<td>' + (r[i] || '') + '</td>').join('') + '</tr>').join('') +
          '</tbody></table>');
        break;
    }
  });
  return out.join('');
}

/* ---------------- 一级导航 ---------------- */
function go(tab){
  CURTAB = tab;
  $$('#nav1 button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $$('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + tab));

  closeDrawer();

}

$('#nav2').addEventListener('click', e => {

  const act = holder ? holder.dataset.act : '';

  else if (act === 'ord'){ QS.ord = b.dataset.v; buildPool(true); renderQuiz(); renderNav2(); }
  else if (act === 'flt'){ QS.flt = b.dataset.v; QS.idx = 0; buildPool(false); renderQuiz(); renderNav2(); }
  else if (act === 'reset'){
    if (!confirm('清空 25 道选择题的作答记录？')) return;
    ANS = {}; store.set('sq_ans_v1', ANS); buildPool(false); renderQuiz(); renderNav2(); toast('已清空');
  }
  else if (act === 'ch'){ TSTATE.ch = b.dataset.v; renderThink(); renderNav2(); closeDrawer(); }
  else if (act === 'know'){
    KN.idx = +b.dataset.i; showKnow(KN.idx); renderNav2(); closeDrawer();
    window.scrollTo({top:0, behavior:'smooth'});
  }
  else if (act === 'big'){
    BGS.idx = b.dataset.i === 'notes' ? 'notes' : +b.dataset.i;
    renderBig(); renderNav2(); closeDrawer();
    window.scrollTo({top:0, behavior:'smooth'});
  }
  else if (act === 'fgrp'){ FS.grp = b.dataset.v; renderFill(); renderNav2(); closeDrawer(); }
  else if (act === 'psec'){
    PS[b.dataset.k].sec = b.dataset.v; renderPred(b.dataset.k); renderNav2(); closeDrawer();
  }
  else if (act === 'fshowall' || act === 'fhideall'){
    FILL.forEach(q => {
      FILLS[q.id] = FILLS[q.id] || {};
      FILLS[q.id].shown = act === 'fshowall';
      FILLS[q.id].blanks = {};
    });
    store.set('sq_fill_v1', FILLS); renderFill(); renderNav2();

  }
  else if (act === 'freset'){
    if (!confirm('清空填空题的显示与掌握记录？')) return;
    FILLS = {}; store.set('sq_fill_v1', FILLS); renderFill(); renderNav2(); toast('已清空');
  }
  else if (act === 'export'){ exportData(); }
  else if (act === 'import'){ fileInput.click(); }
});

/* =========================================================
   一、选择题
   ========================================================= */
const byId = id => MCQ.find(q => q.id === id);

function buildPool(keep){
  let list = MCQ.filter(q => QS.grp === 'all' || String(q.group) === QS.grp);
  if (QS.flt === 'undone') list = list.filter(q => !ANS[q.id]);
  if (QS.flt === 'wrong')  list = list.filter(q => ANS[q.id] && !ANS[q.id].ok);
  if (QS.ord === 'rand'){
    for (let i = list.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      const t = list[i]; list[i] = list[j]; list[j] = t;
    }
  }
  const prev = QS.pool[QS.idx];
  QS.pool = list.map(q => q.id);
  if (keep && prev && QS.pool.indexOf(prev) >= 0) QS.idx = QS.pool.indexOf(prev);
  else QS.idx = 0;
}

function curQ(){ return byId(QS.pool[QS.idx]); }

function renderQuiz(){
  const box = $('#qcard');
  if (!QS.pool.length){
    box.innerHTML = '<div class="empty">这个筛选条件下没有题目了。<br>换个筛选，或点“清空作答记录”重新开始。</div>';
    $('#qbarText').textContent = '0 / 0';
    return;
  }
  const q = curQ(), a = ANS[q.id];
  const score = q.group === 1 ? '6.6 分' : '10 分';
  const groupName = q.group === 1 ? '第一组' : '第二组';
  $('#qbarText').textContent = '第 ' + (QS.idx + 1) + ' / ' + QS.pool.length + ' 题';

  let html = '<div class="qhead">' +
    '<span class="qno">' + String(q.no).padStart(2, '0') + '</span>' +
    '<div class="qmeta"><b>' + groupName + ' · 第 ' + q.no + ' 题</b><span>' + score + '</span></div>' +
    '<span class="qflag' + (a ? ' show ' + (a.ok ? 'ok' : 'bad') : '') + '">' +
      (a ? (a.ok ? '✓ 正确' : '✗ 答错') : '') + '</span></div>' +
    '<h2 class="stem">' + q.stem + '</h2><div class="opts">';

  q.options.forEach(o => {
    let cls = 'opt', mk = '';
    if (a){
      cls += ' locked';
      if (o.k === q.answer){ cls += ' correct'; mk = '✓'; }
      else if (o.k === a.p){ cls += ' wrong'; mk = '✗'; }
      else cls += ' dim';
    }
    html += '<button class="' + cls + '" data-k="' + o.k + '"><i>' + o.k + '</i><span>' + o.t + '</span>' +
            (mk ? '<span class="mk">' + mk + '</span>' : '') + '</button>';
  });
  html += '</div>';

  if (a){
    html += '<div class="verdict">' + (a.ok
      ? '<b class="ok">回答正确</b><span class="muted">继续下一题 →</span>'
      : '<b class="bad">正确答案是 ' + q.answer + '</b><span class="muted">你选了 ' + a.p + '，看下面解析</span>') +
      '</div><div class="analysis">';
    const an = q.analysis;
    if (an.kaodian) html += '<div class="anrow"><span class="lab l1">考点</span><p>' + an.kaodian + '</p></div>';
    if (an.yiju)    html += '<div class="anrow"><span class="lab l2">依据</span><p>' + an.yiju + '</p></div>';
    if (an.paichu)  html += '<div class="anrow"><span class="lab l3">排除</span><p>' + an.paichu + '</p></div>';
    html += '</div>';
  } else {
    html += '<div class="verdict muted">选择一个答案即可对答案并看解析（也可按键盘 A / B / C / D）</div>';
  }

  html += '<div class="qfoot">' +
    '<button class="btn" id="prevQ">← 上一题</button>' +
    '<span class="pos">' + (QS.idx + 1) + ' / ' + QS.pool.length + '</span>' +
    '<button class="btn primary" id="nextQ">' + (QS.idx + 1 >= QS.pool.length ? '回到开头' : '下一题 →') + '</button>' +
    '</div>';

  box.innerHTML = html;
  $$('.opt', box).forEach(btn => btn.onclick = () => pick(btn.dataset.k));
  $('#prevQ', box).onclick = () => { QS.idx = (QS.idx - 1 + QS.pool.length) % QS.pool.length; renderQuiz(); renderNav2(); };
  $('#nextQ', box).onclick = () => { QS.idx = (QS.idx + 1) % QS.pool.length; renderQuiz(); renderNav2(); };
}

function pick(k){
  const q = curQ(); if (!q || ANS[q.id]) return;
  ANS[q.id] = { p: k, ok: k === q.answer };
  store.set('sq_ans_v1', ANS);
  renderQuiz(); renderNav2();
}

function jump(id){
  let i = QS.pool.indexOf(id);
  if (i < 0){
    QS.grp = 'all'; QS.flt = 'all'; QS.ord = 'seq';
    buildPool(false);
    i = QS.pool.indexOf(id);
  }
  if (i >= 0){ QS.idx = i; renderQuiz(); renderNav2(); }
}

/* 键盘 */
document.addEventListener('keydown', e => {
  if (CURTAB !== 'quiz') return;
  const t = e.target.tagName;
  if (t === 'INPUT' || t === 'TEXTAREA') return;
  const k = e.key.toUpperCase();
  if (['A','B','C','D'].indexOf(k) >= 0){ e.preventDefault(); pick(k); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); $('#prevQ') && $('#prevQ').click(); }
  else if (e.key === 'ArrowRight' || e.key === 'Enter'){ e.preventDefault(); $('#nextQ') && $('#nextQ').click(); }
});

/* =========================================================
   二、思考题
   ========================================================= */
function thinkBlocks(q){
  const cus = CUS[q.id];
  if (cus && cus.detail){
    return cus.detail.split(/\n+/).filter(x => x.trim()).map(x => '<p>' + esc(x.trim()) + '</p>').join('');
  }
  return renderBlocks(q.detail);
}
function thinkRecite(q){
  const cus = CUS[q.id];
  if (cus && typeof cus.recite === 'string' && cus.recite.trim()) return esc(cus.recite.trim());
  return q.recite || '';
}

function renderThink(){
  const kw = TSTATE.kw.trim();
  let list = THINK;
  if (TSTATE.ch !== 'all'){
    const idx = +TSTATE.ch.slice(1);
    list = list.filter(q => q.id.indexOf('t' + idx + '-') === 0);
  }
  if (kw){
    list = list.filter(q =>
      (strip(q.title) + ' ' + strip(renderBlocks(q.detail)) + ' ' + (q.recite || '')).indexOf(kw) >= 0);
  }

  if (!list.length){
    $('#tlist').innerHTML = '<div class="empty">没有匹配的题目，换个关键词试试。</div>';
    updateThinkNav(); return;
  }

  $('#tlist').innerHTML = list.map((q, i) => {
    const cus = CUS[q.id] || {};
    const done = !!cus.done;
    const edited = !!(cus.detail || cus.recite);
    const open = !!TSTATE.open[q.id];
    const no = strip(q.title).match(/^\d+/);
    return '<article class="tcard' + (open ? ' open' : '') + (done ? ' done' : '') +
      (TSTATE.self ? ' masked' : '') + '" data-id="' + q.id + '">' +
      '<div class="thead"><span class="tno">' + (no ? no[0] : (i + 1)) + '</span>' +
      '<div class="ttitle"><b>' + strip(q.title).replace(/^\d+[．.]\s*/, '') +
        (edited ? '<span class="badge">已改</span>' : '') + '</b>' +
        '<em>' + q.chapter + '</em></div>' +
      '<span class="caret"></span></div>' +
      '<div class="tbody">' +
        '<div class="sec-t">详细答案</div>' + thinkBlocks(q) +
        '<div class="recite"><span class="rz">背诵版</span><p>' + thinkRecite(q) + '</p></div>' +
        '<div class="tactions">' +
          '<button class="btn" data-act="edit">编辑答案</button>' +
          '<button class="btn" data-act="restore"' + (edited ? '' : ' disabled') + '>恢复原文</button>' +
          '<label class="chk"><input type="checkbox" data-act="done"' + (done ? ' checked' : '') + '>已掌握</label>' +
        '</div>' +
        '<div class="editbox hide"></div>' +
      '</div></article>';
  }).join('');

  bindThink();
  updateThinkNav();
}

function updateThinkNav(){ if (CURTAB === 'think') renderNav2(); }

function bindThink(){
  $$('#tlist .tcard').forEach(card => {
    const id = card.dataset.id;
    const q = THINK.find(x => x.id === id);

    $('.thead', card).onclick = () => {
      TSTATE.open[id] = !TSTATE.open[id];
      card.classList.toggle('open', !!TSTATE.open[id]);
    };

    $('.tbody', card).addEventListener('click', e => {
      if (!TSTATE.self) return;
      if (e.target.closest('.tactions') || e.target.closest('.editbox')) return;
      card.classList.remove('masked');
    });

    const btnEdit = $('[data-act="edit"]', card);
    if (btnEdit) btnEdit.onclick = e => { e.stopPropagation(); openEditor(card, q); };

    const btnRestore = $('[data-act="restore"]', card);
    if (btnRestore) btnRestore.onclick = e => {
      e.stopPropagation();
      if (!confirm('把这一题的答案恢复成原文？你的修改会被删除。')) return;
      delete CUS[id]; store.set('sq_cus_v1', CUS);
      TSTATE.open[id] = true; renderThink(); toast('已恢复原文');
    };

    const chk = $('[data-act="done"]', card);
    if (chk) chk.onclick = e => {
      e.stopPropagation();
      CUS[id] = CUS[id] || {};
      CUS[id].done = chk.checked;
      store.set('sq_cus_v1', CUS);
      card.classList.toggle('done', chk.checked);
      renderNav2();
    };
  });
}

function openEditor(card, q){
  const box = $('.editbox', card);
  if (!box.classList.contains('hide')) return;
  card.classList.add('editing');
  const cus = CUS[q.id] || {};
  const detailText = cus.detail || strip(renderBlocks(q.detail)).replace(/\n{2,}/g, '\n').trim();
  const reciteText = (typeof cus.recite === 'string' && cus.recite) || strip(q.recite || '');

  box.innerHTML =
    '<label>详细答案（修改后记得点保存）</label>' +
    '<textarea class="ta1" rows="12"></textarea>' +
    '<label>背诵版</label>' +
    '<textarea class="ta2" rows="3"></textarea>' +
    '<div class="editfoot">' +
      '<button class="btn primary" data-act="save">保存</button>' +
      '<button class="btn" data-act="cancel">取消</button>' +
      '<span class="hint">只存在本机，随时可恢复原文</span>' +
    '</div>';
  $('.ta1', box).value = detailText;
  $('.ta2', box).value = reciteText;
  box.classList.remove('hide');
  $('.ta1', box).focus();

  $('[data-act="save"]', box).onclick = () => {
    const d = $('.ta1', box).value.trim();
    const r = $('.ta2', box).value.trim();
    CUS[q.id] = CUS[q.id] || {};
    CUS[q.id].detail = d;
    CUS[q.id].recite = r;
    store.set('sq_cus_v1', CUS);
    TSTATE.open[q.id] = true;
    renderThink(); toast('已保存');
  };
  $('[data-act="cancel"]', box).onclick = () => {
    box.classList.add('hide');
    card.classList.remove('editing');
  };
}

$('#search').addEventListener('input', e => { TSTATE.kw = e.target.value; renderThink(); });
$('#expandAll').onclick = () => {
  $$('#tlist .tcard').forEach(c => { TSTATE.open[c.dataset.id] = true; });
  renderThink();
};
$('#collapseAll').onclick = () => { TSTATE.open = {}; renderThink(); };
$('#selfBtn').onclick = () => {
  TSTATE.self = !TSTATE.self;
  $('#selfBtn').classList.toggle('primary', TSTATE.self);
  $('#selfBtn').textContent = TSTATE.self ? '退出自测' : '自测（遮答案）';
  if (TSTATE.self){
    $$('#tlist .tcard').forEach(c => { TSTATE.open[c.dataset.id] = true; });
    renderThink();
    toast('自测模式：答案已遮住，点击答案区域可查看');
  } else {
    $$('#tlist .tcard').forEach(c => c.classList.remove('masked'));
  }
};

/* 备份 */
function exportData(){
  const data = { v: 2, time: new Date().toISOString(),
    ans: ANS, cus: CUS, big: BIGS, fill: FILLS, pred: PREDS };
  const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '冲压复习_我的记录.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  toast('已导出');
}
const fileInput = document.createElement('input');
fileInput.type = 'file'; fileInput.accept = '.json'; fileInput.style.display = 'none';
document.body.appendChild(fileInput);
fileInput.onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (d.ans){ ANS = d.ans; store.set('sq_ans_v1', ANS); }
      if (d.cus){ CUS = d.cus; store.set('sq_cus_v1', CUS); }
      if (d.big){ BIGS = d.big; store.set('sq_big_v1', BIGS); }
      if (d.fill){ FILLS = d.fill; store.set('sq_fill_v1', FILLS); }
      if (d.pred){ PREDS = d.pred; store.set('sq_pred_v1', PREDS); }
      buildPool(false); renderQuiz(); renderThink();
      renderFill(); renderPred('short'); renderPred('term'); renderNav2();
      toast('导入成功');
    } catch (err){ toast('文件格式不对，导入失败'); }
  };
  r.readAsText(f);
  e.target.value = '';
};

/* =========================================================
   三、知识点
   ========================================================= */
function showKnow(i){
  const s = KNOW[i]; if (!s) return;
  KN.idx = i;
  $('#knowBody').innerHTML =
    '<div class="doc-h"><h2>' + strip(s.title).replace(/^第三部分\s*章节知识点\s*·\s*/, '') + '</h2>' +
    '<p>' + strip(s.sub || '') + '</p></div>' + renderBlocks(s.blocks);
}

/* =========================================================
   四、大题（先做后看答案）
   ========================================================= */
function renderBig(){
  const box = $('#bigBody');

  if (BGS.idx === 'notes'){
    box.innerHTML =
      '<div class="bhead"><div class="btop"><span class="btag">速记</span></div>' +
      '<h1 class="btitle">五步模板 · 易错点 · 附加问法</h1>' +
      '<p class="bsub">考前一天只看这一页</p></div>' +
      '<div class="doc" style="padding:24px 28px 28px">' + renderBlocks(BIG.notes) + '</div>' +
      pagerHtml('notes');
    bindPager();
    return;
  }

  const it = BIG.items[BGS.idx];
  const shown = !!BIGS[it.id];

  box.innerHTML =
    '<div class="bhead"><div class="btop">' +
      '<span class="btag' + (it.badge === '必考原题' ? ' exam' : '') + '">' + it.badge + '</span>' +
      '<span class="bmeta">建议用时 ' + it.minutes + ' 分钟</span></div>' +
      '<h1 class="btitle">' + it.title + '</h1>' +
      '<p class="bsub">' + it.sub + '</p></div>' +

    '<div class="bq"><div class="sec-t">题目</div>' + renderBlocks(it.stem) + '</div>' +

    '<details class="btables"><summary>附：查表数据（修边余量 Δh 与极限拉深系数 m）</summary>' +
      '<div class="doc-plain">' + renderBlocks(BIG.tables) + '</div></details>' +

    '<div class="banswer">' +
      '<button class="btn primary lg" id="showAns">' + (shown ? '收起参考答案' : '显示参考答案') + '</button>' +
      '<span class="hint">' + (shown
        ? '对完答案，把错的那一步在草稿上重写一遍'
        : '先在纸上把五步走完，再点这里对答案') + '</span>' +
    '</div>' +

    (shown ? '<div class="bans" id="ansBox">' +
      '<div class="bans-head"><b>参考答案</b><span class="bans-sum">' + it.summary + '</span></div>' +
      renderBlocks(it.answer) + '</div>' : '') +

    pagerHtml(BGS.idx);

  $('#showAns').onclick = () => {
    if (BIGS[it.id]){
      delete BIGS[it.id]; store.set('sq_big_v1', BIGS);
      renderBig(); renderNav2();
    } else {
      BIGS[it.id] = Date.now(); store.set('sq_big_v1', BIGS);
      renderBig(); renderNav2();
      setTimeout(() => {
        const el = $('#ansBox');
        if (el) el.scrollIntoView({ behavior:'smooth', block:'start' });
      }, 70);
    }
  };
  bindPager();
}

function pagerHtml(idx){
  const isNotes = idx === 'notes';
  const pos = isNotes ? '速记页' : (idx + 1) + ' / ' + BIG.items.length;
  const nextTxt = isNotes ? '回到第 1 题' : (idx + 1 >= BIG.items.length ? '看速记页 →' : '下一题 →');
  return '<div class="bpager">' +
    '<button class="btn" id="bigPrev">← 上一题</button>' +
    '<span class="pos">' + pos + '</span>' +
    '<button class="btn primary" id="bigNext">' + nextTxt + '</button>' +
    '</div>';
}
function bindPager(){
  const total = BIG.items.length;
  $('#bigPrev').onclick = () => {
    let i = BGS.idx;
    i = (i === 'notes') ? total - 1 : (i - 1 + total) % total;
    BGS.idx = i; renderBig(); renderNav2(); window.scrollTo({top:0,behavior:'smooth'});
  };
  $('#bigNext').onclick = () => {
    let i = BGS.idx;
    i = (i === 'notes') ? 0 : (i + 1 >= total ? 'notes' : i + 1);
    BGS.idx = i; renderBig(); renderNav2(); window.scrollTo({top:0,behavior:'smooth'});
  };
}

/* =========================================================
   五、填空题预测（答案挖空，自测后点亮）
   ========================================================= */
const fillById = id => FILL.find(q => q.id === id);

function fillStemHtml(q){
  const st = FILLS[q.id] || {};
  return q.stem.replace(/@@(\d+)@@/g, (m, i) => {
    const k = +i;
    const on = st.shown || (st.blanks && st.blanks[k]);
    return on
      ? '<span class="fb on">' + (q.answers[k] || '') + '</span>'
      : '<button class="fb" data-i="' + k + '" title="点此挖开这一空">＿ ＿ ＿</button>';
  });
}

function fillCardHtml(q){
  const st = FILLS[q.id] || {};
  const done = !!st.done, shown = !!st.shown;
  return '<article class="fcard' + (done ? ' done' : '') + '" data-id="' + q.id + '">' +
    '<div class="frow"><span class="fno">' + String(q.no).padStart(2, '0') + '</span>' +
      '<div class="fstem">' + (q.repeat ? '<span class="badge">重复</span>' : '') + fillStemHtml(q) + '</div></div>' +
    '<div class="ffoot">' +
      '<button class="btn" data-act="toggle">' + (shown ? '隐藏答案' : '显示答案') + '</button>' +
      '<span class="hint">共 ' + q.n + ' 空 · 可逐个点空位自测</span>' +
      '<label class="chk"><input type="checkbox" data-act="done"' + (done ? ' checked' : '') + '>已掌握</label>' +
    '</div></article>';
}

function fillStat(){
  const cnt = key => FILL.filter(q => FILLS[q.id] && FILLS[q.id][key]).length;
  const rows = FILLG.map(g => {
    const sub = FILL.filter(q => q.group === g.key);
    const a = sub.filter(q => FILLS[q.id] && FILLS[q.id].shown).length;
    const d = sub.filter(q => FILLS[q.id] && FILLS[q.id].done).length;
    return '<tr><td>' + g.name + '</td><td>' + g.from + '–' + g.to + '</td><td>' + sub.length +
      '</td><td>' + a + '</td><td>' + d + '</td><td>' + Math.round(d / sub.length * 100) + '%</td></tr>';
  }).join('');
  const a = cnt('shown'), d = cnt('done');
  $('#fillStat').innerHTML =
    '<thead><tr><th>分组</th><th>题号</th><th>题数</th><th>已显示答案</th><th>已掌握</th><th>掌握进度</th></tr></thead>' +
    '<tbody>' + rows +
      '<tr><th>合计</th><td>1–42</td><th>' + FILL.length + '</th><th>' + a + '</th><th>' + d +
      '</th><th>' + Math.round(d / FILL.length * 100) + '%</th></tr></tbody>';
}

function renderFill(){
  const kw = FS.kw.trim();
  const list = FILL.filter(q =>
    (FS.grp === 'all' || String(q.group) === FS.grp) &&
    (!kw || (strip(q.stem) + ' ' + q.answers.map(strip).join(' ')).indexOf(kw) >= 0));
  let html = '';
  const groups = FS.grp === 'all' ? FILLG : FILLG.filter(g => String(g.key) === FS.grp);
  groups.forEach(g => {
    const sub = list.filter(q => q.group === g.key);
    if (!sub.length) return;
    html += '<h2 class="ph2">' + g.name + '<span class="ph2n">第 ' + g.from + '–' + g.to +
      ' 题 · ' + sub.length + ' 道</span></h2>' +
      '<h3 class="ph3">' + g.note + '</h3>' +
      '<div class="flist">' + sub.map(fillCardHtml).join('') + '</div>';
  });
  $('#fillList').innerHTML = html || '<div class="empty">没有匹配的题目，换个关键词或分组试试。</div>';
  fillStat();
}

$('#fillList').addEventListener('click', e => {
  const card = e.target.closest('.fcard'); if (!card) return;
  const id = card.dataset.id, q = fillById(id);
  const st = FILLS[id] = FILLS[id] || {};

  const blank = e.target.closest('button.fb');
  if (blank){
    st.blanks = st.blanks || {}; st.blanks[+blank.dataset.i] = 1;
    store.set('sq_fill_v1', FILLS);
    card.outerHTML = fillCardHtml(q);
    return;
  }
  const chk = e.target.closest('[data-act="done"]');
  if (chk){
    st.done = chk.checked; store.set('sq_fill_v1', FILLS);
    card.outerHTML = fillCardHtml(q);
    fillStat(); if (CURTAB === 'fill') renderNav2();
    return;
  }
  if (e.target.closest('[data-act="toggle"]')){
    st.shown = !st.shown;
    if (!st.shown) st.blanks = {};
    store.set('sq_fill_v1', FILLS);
    card.outerHTML = fillCardHtml(q);
    fillStat(); if (CURTAB === 'fill') renderNav2();
  }
});
$('#fillSearch').addEventListener('input', e => { FS.kw = e.target.value; renderFill(); });
$('#fillShowAll').onclick = () => {
  FILL.forEach(q => { FILLS[q.id] = FILLS[q.id] || {}; FILLS[q.id].shown = true; FILLS[q.id].blanks = {}; });
  store.set('sq_fill_v1', FILLS); renderFill(); renderNav2(); toast('已显示全部答案');
};
$('#fillHideAll').onclick = () => {
  FILL.forEach(q => { FILLS[q.id] = FILLS[q.id] || {}; FILLS[q.id].shown = false; FILLS[q.id].blanks = {}; });
  store.set('sq_fill_v1', FILLS); renderFill(); renderNav2(); toast('已全部隐藏');
};

/* =========================================================
   六、简答 / 名词解释（题干与答案分离，双答案分开）
   ========================================================= */
const predById = (k, id) => PCFG[k].items.find(q => q.id === id);

function predCardHtml(k, q){
  const S = PS[k], st = PREDS[q.id] || {};
  const open = !!S.open[q.id], done = !!st.done, tab = st.tab || '';
  const ch = PCFG[k].ch[q.ci] || { short:'全部' };
  const showAns = open && !!tab;
  let pane;
  if (showAns && tab === 'detail')
    pane = '<div class="pane">' + q.detail.map(x => '<p>' + x + '</p>').join('') + '</div>';
  else if (showAns && tab === 'recite')
    pane = '<div class="pane recite"><span class="rz">背诵版</span><p>' + q.recite + '</p></div>';
  else
    pane = '<div class="pane"><p class="hint">点上方标签查看对应答案；详细答案与背诵版互不混排，先背后展开。</p></div>';

  return '<article class="pcard' + (open ? ' open' : '') + (done ? ' done' : '') +
      (S.self && showAns ? ' masked' : '') + '" data-id="' + q.id + '">' +
    '<div class="pcard-h"><span class="pno">' + String(q.no).padStart(2, '0') + '</span>' +
      '<div class="ptitle"><b>' + strip(q.title) + '</b><em>' + strip(ch.short) + ' · ' +
        (done ? '已掌握' : '未标记') + '</em></div><span class="caret"></span></div>' +
    '<div class="pbody">' +
      '<div class="ptabs">' +
        '<button data-act="tab" data-v="detail"' + (tab === 'detail' ? ' class="on"' : '') + '>详细答案</button>' +
        '<button data-act="tab" data-v="recite"' + (tab === 'recite' ? ' class="on"' : '') + '>背诵版</button>' +
      '</div>' + pane +
      '<div class="tactions"><label class="chk"><input type="checkbox" data-act="done"' +
        (done ? ' checked' : '') + '>已掌握</label></div>' +
    '</div></article>';
}

function predStat(k){
  const cfg = PCFG[k];
  const doneOf = arr => arr.filter(q => PREDS[q.id] && PREDS[q.id].done).length;
  const rows = cfg.ch.map((c, i) => {
    const sub = cfg.items.filter(q => q.ci === i);
    const op = sub.filter(q => PS[k].open[q.id]).length;
    const d = doneOf(sub);
    return '<tr><td>' + strip(c.short) + '</td><td>' + sub.length + '</td><td>' + op +
      '</td><td>' + d + '</td><td>' + Math.round(d / sub.length * 100) + '%</td></tr>';
  }).join('');
  $('#' + k + 'Stat').innerHTML =
    '<thead><tr><th>分节</th><th>题数</th><th>已展开</th><th>已掌握</th><th>掌握进度</th></tr></thead>' +
    '<tbody>' + rows +
      '<tr><th>合计</th><th>' + cfg.items.length + '</th><th>' +
      cfg.items.filter(q => PS[k].open[q.id]).length + '</th><th>' + doneOf(cfg.items) +
      '</th><th>' + Math.round(doneOf(cfg.items) / cfg.items.length * 100) + '%</th></tr></tbody>';
}

function renderPred(k){
  const S = PS[k], cfg = PCFG[k], kw = S.kw.trim();
  const list = cfg.items.filter(q =>
    (S.sec === 'all' || q.ci === +S.sec.slice(1)) &&
    (!kw || (strip(q.title) + ' ' + q.detail.map(strip).join(' ') + ' ' + strip(q.recite)).indexOf(kw) >= 0));
  let html = '';
  const secs = S.sec === 'all' ? cfg.ch.map((c, i) => i) : [+S.sec.slice(1)];
  secs.forEach(ci => {
    const sub = list.filter(q => q.ci === ci);
    if (!sub.length) return;
    html += '<h2 class="ph2">' + strip(cfg.ch[ci].short) +
      '<span class="ph2n">' + sub.length + ' 题 · 按考纲与公开题库命中的重合考点</span></h2>' +
      '<h3 class="ph3">默认只给题干，展开后详细答案与背诵版分开查看</h3>' +
      '<div class="plist">' + sub.map(q => predCardHtml(k, q)).join('') + '</div>';
  });
  $('#' + k + 'List').innerHTML = html || '<div class="empty">没有匹配的题目，换个关键词或分节试试。</div>';
  predStat(k);
}

['short','term'].forEach(k => {
  const S = PS[k];
  $('#' + k + 'List').addEventListener('click', e => {
    const card = e.target.closest('.pcard'); if (!card) return;
    const id = card.dataset.id, S = PS[k];

    const tabBtn = e.target.closest('.ptabs button');
    if (tabBtn){
      const st = PREDS[id] = PREDS[id] || {};
      st.tab = st.tab === tabBtn.dataset.v ? '' : tabBtn.dataset.v;
      S.open[id] = true;
      store.set('sq_pred_v1', PREDS); renderPred(k); renderNav2(); return;
    }
    const chk = e.target.closest('[data-act="done"]');
    if (chk){
      const st = PREDS[id] = PREDS[id] || {};
      st.done = chk.checked; store.set('sq_pred_v1', PREDS);
      renderPred(k); renderNav2(); return;
    }
    if (e.target.closest('.pane') && S.self){ card.classList.remove('masked'); return; }
    if (e.target.closest('.pcard-h')){ S.open[id] = !S.open[id]; renderPred(k); }
  });
  $('#' + k + 'Search').addEventListener('input', e => { S.kw = e.target.value; renderPred(k); });
  $('#' + k + 'ExpandAll').onclick = () => {
    PCFG[k].items.forEach(q => { S.open[q.id] = true; }); renderPred(k);
  };
  $('#' + k + 'CollapseAll').onclick = () => { S.open = {}; renderPred(k); };
  $('#' + k + 'Self').onclick = () => {
    S.self = !S.self;
    const b = $('#' + k + 'Self');
    b.classList.toggle('primary', S.self);
    b.textContent = S.self ? '退出自测' : '自测（遮答案）';
    if (S.self){
      PCFG[k].items.forEach(q => { S.open[q.id] = true; });
      toast('自测模式：答案已遮住，点答案区域可查看');
    }
    renderPred(k);
  };
});

/* =========================================================
   启动
   ========================================================= */
buildPool(false);
renderQuiz();
TSTATE.open[THINK[0].id] = true;
renderThink();
showKnow(0);
renderBig();
renderFill();
renderPred('short');
renderPred('term');
renderNav2();
})();
</script>
</body>
